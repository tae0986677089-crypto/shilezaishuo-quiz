找新玩法：一下車先買交通卡、問路邊阿伯哪裡好吃，隔天就像住了一個月。"},{"title":"能把不同領域串起來","text":"因為什麼都想看一點，你腦中裝滿別的產業、別的國家的例子。開會卡住時，你常說「我在日本看過一家店這樣做」，大家才發現問題可以換個方向解。你不是樣樣通樣樣鬆，而是看得夠多，才接得起來。"},{"title":"會追問「那後來呢」","text":"你對人好奇是真的，不是客套。在民宿跟老闆聊天，你會一路問到他當年為什麼離開台北。你並不是愛八卦，而是想知道一個人怎麼選了他的路；對方覺得被認真聽見，你也常聽到別人聽不到的故事。"}],"best_scenes":"你想看見沒看過的東西，所以方向還沒定的新專案、要出差跑現場的工作、要去試新市場和新工具的任務，最能讓你發揮。你不是只適合玩，而是越陌生、越有自主空間，你越清醒。","value":"你在乎外面發生了什麼，所以你是團隊裡的偵察兵。大家還在用三年前的做法時，你已經跑去看別人怎麼做，回來說「隔壁那家早就換系統了」。你不是坐不住，而是讓團隊不會在原地慢慢變鈍。","weaknesses":[{"title":"很會開始，不太會收尾","text":"敢先出發的另一面，是新鮮感一退就想換下一件。你的抽屜裡可能躺著好幾本只寫了前三頁的筆記。"},{"title":"太能適應，反而不扎根","text":"你到哪裡都過得去，所以不太覺得需要留下。長約、固定班表一出現，你心裡就先找好退路。"},{"title":"對重複的事沒耐心","text":"你的腦袋習慣吸收新東西，同一件事做到第三遍就開始飄。報帳、回覆一樣的問題，你不是不會，而是會拖到最後一天。"},{"title":"聊得很深，卻不常再聯絡","text":"你對人好奇，但好奇完常就換下一群人。合作方覺得跟你一見如故，下次想找你時，卻不確定你還在不在這個領域。"}],"risks":[{"title":"永遠在找下一站","text":"每到一個地方都覺得「好像不是這裡」。幾年後回頭看，你不是沒努力，而是每段都在快要長出東西時離開，最後很多開頭，卻沒有一段能讓你說「這是我的代表作」。"},{"title":"自由變成孤單","text":"你習慣自己來，不想麻煩人，也不想被牽絆。一開始很輕鬆，時間一久，你可能在某個異國夜市拍了照，才發現想分享的人越來越少。"},{"title":"把離開當成解藥","text":"遇到卡關、吵架或低潮，你第一個念頭是換個環境。你不是軟弱，只是習慣用移動處理心情；但問題常常跟著行李，一起到了下一站。"}],"growth":["想離職、想搬家之前，先寫下一句：是這裡限制了我，還是事情只是變難了？答案不同，做法就不同。","挑一件事做滿一年再評估，例如一項專業或一份作品集，讓探索有一個地方可以累積。","每趟回來，花半小時把見聞整理成三個重點傳給朋友，「我去過」才會變成「我懂了」。"],"evolution":{"from":"四處尋路的旅人","to":"替人畫地圖的嚮導","text":"你出發的理由，從「這裡好無聊」變成「我想找到某個東西」。你不是不再愛新鮮，而是走過的路開始留下記號，後面的人拿著你畫的地圖，也敢出發了。"},"relationship":{"shine":"你相信每個人都該走自己的路，所以你很少管人，也不太用框框要求對方。你不是不在乎，而是用給空間的方式在乎。跟你在一起，週六早上可能突然變成一趟山線小旅行，普通的晚餐也會因為你一句「欸，我上次在花蓮遇到一個人」變得很好聊。","shadows":[{"title":"需要空間時突然消失","text":"覺得被黏太緊時，你不是生氣，只是想透氣，於是訊息兩天沒回，對方卻在那頭猜了兩天。"},{"title":"很少說「我需要你」","text":"你太習慣一個人搞定，連搬家都自己叫車扛完，親近的人會覺得你好像不太需要他們。"},{"title":"把平淡當成沒感覺","text":"關係走到每週吃同一間餐廳的階段，你可能以為感覺沒了，其實只是不再新鮮。"}],"practice":[{"title":"先說再走","text":"想一個人靜一靜時，直接傳一句「我需要兩天自己的時間，不是因為你」，對方就不用猜。"},{"title":"把冒險變成兩人份","text":"下次想去的地方、想試的新東西，先問對方要不要一起，讓關係本身也變成一趟旅程。"},{"title":"在老地方找新鮮","text":"同一條散步路線，換成晚上走、換個話題聊，也能看到新風景，不一定要換人或換地方。"}]},"energy":{"charge":["去一個沒去過的地方，哪怕只是隔壁區的一條巷子","學一個完全陌生的新技能","一段自己安排、沒有人催的空白時間","跟來自不同背景的人聊天，聽他們的故事"],"drain":["每天一模一樣的行程和工作內容","出去玩卻排滿每小時的行程，完全沒有亂走的空檔","長時間待在同一個地方、同一群人裡","什麼都要層層報備，不能自己做決定","別人用「你就是定不下來」來形容你"],"message":"想往外走不是你的缺點，那是你天生的指南針。你不是定不下來，你只是還在找值得停下來的地方。累了就停一陣子，停下來不代表被困住。你在每條巷子、每個陌生人身上撿到的東西，總有一天會串成一條只有你走得出來的路。繼續好奇，也對自己溫柔一點。"},"ip":{"positioning":"「先幫你去試的人」：替觀眾踩點的實測探險家，或帶大家看見新世界的嚮導。","core":"你的內容核心是「我去試了，告訴你真實的樣子」。旅行、新工具實測、跨界嘗試、轉職或移居的過程，都很適合你用第一人稱帶觀眾走一遍。可以賣的東西包括：路線或清單類的數位商品、實測後整理的入門指南、帶團或體驗活動、陪跑型的小班課，以及品牌合作的實地開箱。","shadows":[{"title":"主題換得太快","text":"今天拍旅行、明天講理財，觀眾記不住你是誰，演算法也抓不到該推給誰。"},{"title":"只有記錄，沒有整理","text":"素材很多，但觀眾看完只知道你去了哪裡，不知道自己能帶走什麼。"},{"title":"不愛重複的經營工作","text":"固定更新、回留言、看數據這些例行的事，很容易被你一直擱在一邊。"}],"practice":[{"title":"給探索一個固定框架","text":"選一個大方向，例如「AI 工具實測」或「一個人旅行」，每支影片都用同樣的開頭和收尾結構，讓變化發生在內容裡，而不是在定位上。"},{"title":"每次出發都留一份給觀眾的東西","text":"一張清單、三個踩雷點、一條推薦路線。觀眾拿得走東西，才會收藏、分享，然後回來追你的下一集。"}]},"career":{"shine":"你需要自己做決定的空間，所以適合常有新挑戰的工作：業務開發、市場調查、新創、旅遊或戶外產業、記者、自由接案。你不是不能穩定，而是你的穩定要來自多種收入，例如接案加上內容、顧問加上課程，而不是只靠一份薪水。給你一張出差單，你常比坐在辦公室更有產出。","shadows":[{"title":"收入跟著興致起伏","text":"興致高時一口氣接五個案子，想出走時又全部停下來，存款曲線跟你的心情長得一模一樣。"},{"title":"經歷很寬，說不出主軸","text":"換過很多領域，面試時如果講不出一條線，別人只看到不穩定，看不到你的寬度。"}],"practice":[{"title":"準備一筆出走基金","text":"先存三到六個月的生活費，想轉換跑道時，是你選擇離開，而不是被錢逼著留下或衝動走。"},{"title":"替經歷找一條主線","text":"把做過的事串成一句話，例如「我一直在幫人走進新領域」，面試和自我介紹就有主軸。"},{"title":"練一項帶得走的技能","text":"寫作、剪輯、語言或某個產業知識，讓你不管換到哪裡，都有一樣東西不用重來。"}]},"partners":["智者","統治者"],"items":["新東西剛出來還沒評價，我就想先去試。","到了陌生的城市或環境，我很快就能找到自己的節奏。","我寧願收入不穩定，也要自己決定怎麼過日子。","想到未來十年每天都過得差不多，我會覺得喘不過氣。","一件事做到不新鮮了，我常常還沒做完就想換下一件。","別人已經告訴我結果了，我還是想自己去試一次。"],"as_second":"就算你的主調再穩，心裡還是住著一個想往外看的自己。待太久的地方，你會開始坐不住；一點新鮮的東西，就能讓你重新有精神。"},"叛逆者":{"name":"叛逆者","en":"Outlaw","keywords":["打破規則","獨立思考","改變","直言","真實","不從眾"],"people":["史蒂夫．賈伯斯（Steve Jobs）","理查．布蘭森（Richard Branson）","班克斯（Banksy）","女神卡卡（Lady Gaga）","伍佰"],"brands":["Apple","Liquid Death","Harley-Davidson","Virgin","Diesel"],"manifesto":"規則如果不合理，就該被改寫；我寧願被討厭，也不想假裝沒看見。","portrait":{"text":"你在乎的是真的，所以聽到「本來就是這樣」，你會先皺眉。開會時大家默默點頭，你常是第一個問「為什麼一定要這樣做」的人。你不是為反對而反對，而是看到只為了面子存在的流程，像買一支筆要主管簽三次名，就是沒辦法假裝沒事。你說話很直，常讓場面緊張一下，但散會後總有人私訊你：「其實我也這樣想。」你的直，是因為你相信事情可以更好。","questions":"你常問自己：「這個規則到底是為了誰？」「如果大家都不敢說，那我要不要說？」還有一題需要常回來問：「我想推翻的，是真的不合理，還是只是我不喜歡？」你不是缺勇氣的人，你需要的是把勇氣用在對的地方，而這一題能幫你分辨。","lesson":"你想讓事情變得更好，所以你正在練習的是從「拆」走到「蓋」。你並不是只會批評，但拆完之後，大家需要一個更好的選項。成熟的叛逆者不只說「這樣不對」，還會把新做法寫成一頁提案，找到兩三個同伴，讓改變不再是一個人的抗議。"},"mechanism":{"pursuit":"你追求的是真實和自由：不用演戲、不用討好，照自己相信的方式活。你不是想破壞一切，而是希望自己的存在，能讓某些早該改的老規矩鬆動一點，像讓公司終於取消那份沒人看的週報。","drive":"推動你的是對不合理的不服氣。看到浪費、虛偽或有人被欺負，你心裡就會燒起來。你不是愛找麻煩，而是忍著不說比站出來承擔後果還難受，回家路上會一直在腦中重播那一幕。","fear":"你最怕無能為力：明明看到問題，卻什麼也改變不了。更深一層，你怕的不是被討厭，而是有一天發現自己也變成當年最看不起的那種人，開會只會點頭、照規矩走。","belief":"「沒有什麼是理所當然的。」你不是要大家都聽你的，而是相信很多好的改變，都從一個人說「等一下，為什麼？」開始。"},"strengths":[{"title":"敢說出大家不敢說的話","text":"你受不了大家假裝沒看到，所以問題擺在眼前卻沒人點破時，你會是開口的那個。你不是愛出鋒頭，而是覺得沉默更危險；你一句「這個時程根本做不完」，常讓卡很久的事終於被拿出來談。"},{"title":"一眼看穿表面和包裝","text":"你對虛假特別敏感，華麗簡報或誇張廣告，你很快就抓到漏洞。業務講得天花亂墜，你只問一句「合約第七條為什麼字這麼小？」對方就卡住了。你不是多疑，而是在乎真相，也讓身邊的人少被騙幾次。"},{"title":"不怕跟別人不一樣","text":"你更在意是不是在做自己，而不是會不會被說奇怪。你不是刻意標新立異，而是照自己的感覺穿、做、說，所以你的作品和做事方式常有一種一眼就認得出的味道，在一片相似裡特別顯眼。"},{"title":"敢把整件事重新來過","text":"你不滿足於小修小補，因為你想改的是根本。別人在討論表格要加哪一欄，你直接問「我們為什麼還要填這張表？」。你不是在搗亂，很多新產品和新規則，都是從這種問題開始的。"}],"best_scenes":"你想讓不合理的東西消失，所以組織要改革、產品要翻新、品牌要做出跟市場不一樣的味道時，你最有力。你不是只會拆，評論、檢驗、內部改善這種需要有人說真話的工作，也是你的主場。","value":"你看不慣「習慣就好」，所以你是團隊裡的破冰船。大家照著做了五年的流程，你一句「這步驟刪掉會怎樣？」就逼大家重新想。你不是唱反調，而是讓團隊不會因為安逸變得僵化，讓真正的問題被看見。","weaknesses":[{"title":"直話說得太衝","text":"敢開口的另一面，是常忘了包裝。你的出發點是好的，語氣一衝，別人只聽到攻擊，沒聽到內容。"},{"title":"看誰都像在演","text":"你太會看穿包裝，有時連別人真心的客氣，也被你當成場面話，讓對方覺得好意被誤會。"},{"title":"不肯為小事讓步","text":"你很堅持自己的樣子，有時為了一個字體、一個說法不肯退，錯過大家可以一起往前的機會。"},{"title":"對上面的規定先反彈","text":"你習慣挑戰現狀，所以有時規定明明合理，只因為是上面說的，你也會先想反抗。"}],"risks":[{"title":"為了反對而反對","text":"你站在主流對面久了，可能連好的建議都直覺拒絕。這時候的叛逆，反而成了另一種不自由：只要多數人說好，你就先覺得不對。"},{"title":"越線傷到自己","text":"太想打破規則時，你可能低估代價：在公開場合跟老闆翻臉、沒看清合約就退出合作。改變沒有發生，自己卻先受了傷。"},{"title":"變成孤軍奮戰","text":"你太堅持自己的方式，願意支持你的人可能越來越少。沒有同伴的改變很難走遠，你也可能慢慢變得疲憊，覺得「反正說了也沒用」。"}],"growth":["每次想推翻什麼之前，先寫好一個替代方案，讓你的批評變成一份提案。","開口之前先問自己：這件事一年後還重要嗎？不重要的，就讓它過去。","把「這很爛」換成「我覺得可以這樣改」，同樣的立場，會有更多人願意聽。"],"evolution":{"from":"對著體制說不的人","to":"帶來改變的開路人","text":"你不再只是站在對面說不，而是動手蓋出新的選擇。你不是變乖了，而是發現拿出一個做得到的新方法，比大聲反對更能讓人跟上，同樣想改變的人也開始聚到你身邊。"},"relationship":{"shine":"你討厭演戲，所以你是最真實的朋友。你不會為了場面說好聽話，所以你一句「這個真的很好」特別有份量。你不是不會圓滑，而是覺得朋友值得聽真話。朋友被欺負時，你常是第一個在群組裡說「這樣不對吧」的人；在你身邊，大家也比較敢說真心話。","shadows":[{"title":"把建議說成審判","text":"朋友拿新作品給你看，你第一句就講哪裡不好，他後來就不太敢再拿給你看了。"},{"title":"不喜歡被要求","text":"伴侶說「你能不能早點回訊息」，你可能直覺覺得被管，反應比需要的更大。"},{"title":"爭論停不下來","text":"一場普通的討論變成辯論，你想贏的是道理，最後卻可能輸掉這段關係。"}],"practice":[{"title":"先肯定，再提醒","text":"說真話之前，先講一個你真心欣賞對方的地方，他比較聽得進你接下來的話。"},{"title":"分清楚請求和控制","text":"對方說「希望你早點回家」，不一定是在管你，很可能只是單純想你了。"},{"title":"允許彼此不同意","text":"不是每次都要說服對方，有時候說一句「我懂你的看法」，其實就夠了。"}]},"energy":{"charge":["做一件跟別人都不一樣、很有自己風格的事","終於把一個不合理的做法改掉","跟有想法、敢說真話的人聊天","有完全的自由，可以用自己的方式做事"],"drain":["一堆只為了形式而存在的流程和規定","被要求「不要多問，照做就對了」","需要一直說客套話、假裝同意的場合","看到明顯的不公平，卻無能為力","被人說「你就是太愛唱反調」"],"message":"你的不服氣，是這個世界需要的東西。很多事情會變好，都是因為有人先說了「這樣不對」。你不是麻煩製造者，你是早一步看見問題的人。只是別忘了，你不需要一個人對抗全世界。找到跟你一樣在乎的人，把火氣變成動手做的力氣；說得溫柔一點，你的聲音反而傳得更遠。"},"ip":{"positioning":"「說真話的人」：戳破誇大說法的實話派創作者，或打破產業慣例的另類品牌主理人。","core":"你的內容核心是「大家都這樣說，但我試過發現不是這樣」。破解迷思、拆穿行銷話術、挑戰產業慣例、分享非主流但有效的做法，都很適合你。可以賣的東西有：反主流的方法論課程、風格鮮明的自有商品、顧問或診斷服務、會員制的實話社群，以及願意讓你保留真實觀點的品牌合作。","shadows":[{"title":"靠引戰換流量","text":"嗆人的內容很容易爆，但也容易吸來只想吵架的觀眾，還可能傷到無辜的人。"},{"title":"只批評，不給答案","text":"觀眾看完很爽，卻不知道接下來可以怎麼做，久了只剩下一時的發洩感。"},{"title":"跟品牌合作卡卡的","text":"太堅持自己的調性，可能錯過合作機會，或是答應了又覺得很不自在。"}],"practice":[{"title":"對事不對人，用證據說話","text":"批評的是做法和說法，不針對個人；每一個「這不對」，都附上你實際測試或查證的結果，讓你的叛逆更有說服力。"},{"title":"每次拆穿都給一條新路","text":"指出問題之後，分享你找到的更好做法，讓觀眾從認同你的態度，變成真的從你的內容裡得到好處。"}]},"career":{"shine":"你想做真的、新的東西，所以適合需要突破的工作：新創、產品創新、品牌企劃、評論或調查型媒體、設計、改革型專案，或自己當老闆。你不是不適合組織，而是需要一個允許說真話的地方。賺錢上你適合走差異化：用鮮明立場吸引認同你的人，做小而忠誠的品牌。","shadows":[{"title":"跟主管或客戶硬碰硬","text":"意見不同時當場頂回去，對方記住的是你的態度，你的好點子反而被擱在一邊。"},{"title":"忽略必要的規則","text":"合約、報稅、發票這些「無聊的規矩」沒處理好，可能替自己惹上麻煩。"}],"practice":[{"title":"先贏得信任，再提出挑戰","text":"先把份內工作做好、累積看得見的成績，你提出的意見會更有份量。"},{"title":"找一個懂規則的夥伴","text":"讓擅長流程和行政的人幫你顧後台，你就能專心在想改變的那部分。"},{"title":"用小實驗代替爭論","text":"先用一個小規模的嘗試證明新做法有效，這比吵贏任何一場會議更能說服人。"}]},"partners":["創造者","智者"],"items":["大家都同意某個做法時，我常是那個提出不同意見的人。","廣告或簡報講得很誇張時，我很快就能看出哪裡有問題。","看到沒道理的規定，我會想把它改掉。","如果一直不能說真話，我會覺得自己快要悶壞了。","別人規定我怎麼做時，就算有道理，我也會想反抗。","我覺得被討厭也沒關係，總比假裝認同來得好。"],"as_second":"你表面上可能很配合，心裡卻有一條「沒道理就不做」的底線。被踩到的時候，你會突然變得很直接，連自己都嚇一跳。"},"戀人":{"name":"戀人","en":"Lover","keywords":["美感","深情","細膩","享受","儀式感","熱情"],"people":["愛黛兒","瑪麗蓮・夢露","林志玲","劉若英"],"brands":["Chanel","Godiva","Häagen-Dazs","Jo Malone London","郭元益"],"manifesto":"我想把日子過得有溫度、有美感，讓我在乎的人，都能感覺到自己被好好珍惜。","portrait":{"text":"你做事的起點是「有沒有感覺」，因為你相信，被好好對待的那些時刻，才是日子裡真正會留下來的東西。所以一杯咖啡好不好喝、一句話說得溫不溫柔，你很快就感受到。你記得朋友喜歡的花、伴侶不吃香菜，會為一頓普通的晚餐點上蠟燭。你不是太講究，而是不想讓重要的人覺得自己被隨便對待。也因為你總是全心投入，你做的事特別能打動人。","questions":"我在乎的人，也同樣在乎我嗎？這件事讓我心動嗎？我是不是又為了讓對方開心，忘了自己想要什麼？你常在睡前打開聊天紀錄，重看對方那句「好喔」，想著他是累了，還是不高興了。","lesson":"你正在練習的不是少愛一點，而是記得把自己也放進去。你很會讓別人覺得被珍惜，卻常把自己的需要排到最後。當你不再靠對方回訊息的速度，來確認自己值不值得，你的熱情會更自由，關係也會更平衡、更長久。"},"mechanism":{"pursuit":"你要的不是很多朋友，而是幾段真的能交心的關係。一個可以聊到捷運末班車的人、一個讓人捨不得離開的空間、一首讓你起雞皮疙瘩的歌，這些深刻的連結和感受，讓你覺得活著真好。","drive":"你做事很少只算划不划算，而是看心不心動。同樣一份企劃，如果能讓客人收到時笑出來，你願意多熬兩個晚上，把卡片上的字重寫三遍。只要投入了感情，你就會付出加倍的心力。","fear":"你最怕的不是吵架，而是被冷落、不再被需要。對方回訊息從三分鐘變成三小時、朋友聚會的照片裡沒有你，你可能在心裡繞好幾圈，擔心是不是自己做錯了，表面上卻還笑著說沒事。","belief":"「人生最值得的，是和在乎的人一起過的那些時刻。」你相信關係和感受，比頭銜和數字更值得花心思。"},"strengths":[{"title":"讓人感到被珍惜的用心","text":"你不是記性特別好，而是把別人的小事當成大事在記。客戶上個月提過孩子要考試，你這次見面就問結果；同事生日，你的卡片寫的是只有你們才懂的事。這些細節讓人覺得被看見，也讓人想一直跟你合作。"},{"title":"一眼看出哪裡不對的美感","text":"你對顏色、光線、質感有天生的敏銳。一份簡報、一個櫥窗、一張產品照，你一看就知道「這裡字太擠」「這個光太冷」，調完之後，大家都說整個好像活過來了。"},{"title":"全心投入的熱情","text":"當你真心喜歡一件事，會投入到忘記時間。你推薦的東西別人會買單，不是因為你會推銷，而是大家看得出來，你講到它的時候整個人在發光。這種熱情會傳染，身邊的人也跟著認真起來。"},{"title":"感受得到沒說出口的情緒","text":"你很會察覺別人沒說出口的心情，也說得出來。寫一段文案、挑一張照片，你總能抓到讓人心頭一暖的那個點，讓冷冰冰的產品也有了溫度。"}],"best_scenes":"需要讓人「有感覺」的地方最適合你：品牌視覺、空間和活動布置、文案和品牌故事、客戶關係經營、婚禮和生活風格產業。當產品規格跟別人差不多時，你能讓客人因為一個細節選擇你。","value":"你帶給團隊的是「被在乎」的感覺。你會在大家趕案的深夜，替每個人的飲料寫上名字；你讓作品多了讓人想收藏的質感，也讓工作不只是工作。大家會因為你，更願意投入、更願意留下來。","weaknesses":[{"title":"很難說不","text":"因為太在意對方的感受，你可能答應自己其實不想做的事，事後一個人覺得委屈。"},{"title":"細節不美就放不下","text":"一個顏色不對你就渾身不對勁，可能為了一點質感改到半夜，拖慢整個團隊的進度。"},{"title":"心動了就先衝","text":"喜歡就先買、先答應，事後才發現預算、時間或現實條件，其實都沒有算進去。"},{"title":"心情被別人牽著走","text":"你感受得太清楚，一句冷淡的回覆或一個皺眉，就可能讓你低落一整天。"}],"risks":[{"title":"在關係裡慢慢不見","text":"你可能為了配合對方，一點一點改掉自己的喜好、行程和夢想。等到有人問你最近喜歡什麼，你才發現，答案全都跟對方有關。"},{"title":"用付出換取愛","text":"你可能不自覺覺得「我對你這麼好，你也該這樣對我」。對方沒有同樣回應時，失落會慢慢變成怨氣，關係也跟著緊繃。"},{"title":"讓好惡代替判斷","text":"你喜歡一個人時，容易連他的缺點都看成可愛；不喜歡時，連他說對的建議都聽不進去。重要的合作和決定，可能因此被好惡左右。"}],"growth":["每週留兩小時完全只給自己，做一件不是為了誰、純粹讓你開心的事。","做重要決定前，除了問「我喜不喜歡」，也問一句「半年後我還撐得住嗎」。","想要什麼就直接說，例如「我希望你這週陪我吃一次飯」，不要等對方猜。"],"evolution":{"from":"全心付出的浪漫派","to":"懂得愛自己的溫暖者","text":"你會從「用付出證明自己值得被愛」，走到「知道自己本來就值得」。你的溫柔一點都不會少，只是多了界線，能照顧別人更久，也不再把自己掏空。"},"relationship":{"shine":"你在關係裡不是只會說愛，而是用很多小動作讓人感覺被選擇。你記得對方加班那天想喝的熱可可，紀念日的卡片會寫一件只有你們知道的小事，也願意放下手機，好好聽對方說完。很多人跟你在一起之後才說，原來被好好對待是這種感覺。","shadows":[{"title":"一句話想出十種意思","text":"對方回一個「嗯」，你可能想出好幾種解釋，自己很累，對方也一頭霧水。"},{"title":"期待對方自己懂","text":"你用行動表達愛，也希望對方自己察覺，對方沒發現時，你就默默失望，卻不說為什麼。"},{"title":"吵架時總是先退","text":"一有衝突你就想快點和好，先道歉、先讓步，真正的問題反而一直沒談開。"}],"practice":[{"title":"把猜測變成提問","text":"心裡開始亂想時，直接問：「你剛剛那樣說，是什麼意思？」答案通常比你想的簡單。"},{"title":"吵架時先喊暫停","text":"想先道歉了事時，改說「我需要想一下，我們明天再好好聊」，讓真正的問題有機會說開。"},{"title":"練習接受別人的好","text":"別人對你好時，說聲謝謝就好，不用急著加倍回報，你本來就值得被好好對待。"}]},"energy":{"charge":["跟喜歡的人慢慢吃一頓飯，聊到店家打烊","把房間一角布置成自己喜歡的樣子","看一部讓人心頭一暖的電影","收到一張手寫卡片，寫著只有你懂的事"],"drain":["待在冷冰冰、只談效率的環境","傳了訊息，對方已讀一整天都沒回","被要求交出自己覺得很醜的東西","跟人起衝突，或感覺被冷落"],"message":"你的溫柔不是太敏感，而是你感受世界的方式比別人細。別因為有人說你「想太多」「太感性」，就把自己收起來。只是記得，你送出去的那些珍惜，也要留一份給自己。今晚替自己泡一杯喜歡的茶，像對待重要的人那樣，好好對待自己一次。"},"ip":{"positioning":"讓日常變美的「生活質感家」或「有溫度的說故事的人」","core":"你的內容核心是「感受」：讓觀眾透過你的畫面和文字，感覺到生活可以更美、更有溫度，例如質感開箱、空間布置、生活儀式、關係心得。適合賣的是讓人有感的東西，例如自有品牌的香氛或選物、美感和攝影課程、陪伴型社群，或替品牌說故事的文案和視覺服務。","shadows":[{"title":"太在意按讚數","text":"一支影片反應不好就懷疑自己，讓創作的心情一直跟著數字起起伏伏。"},{"title":"質感拖慢出片","text":"每一格都要美才肯發，結果一個月只發一支，觀眾等不到你，演算法也忘了你。"},{"title":"被負評刺傷","text":"一則惡意留言可能讓你難過好幾天，甚至開始懷疑自己，想乾脆停更。"}],"practice":[{"title":"先為自己創作","text":"先拍你真心喜歡的東西，再看數據。你的熱情是內容最大的吸引力，別為了演算法把它磨掉。"},{"title":"訂一個「夠好就發」的標準","text":"先寫下這支影片最重要的三個畫面，那三個做到位就發，其他小地方留給下一支再進步，讓出片的節奏穩下來。"},{"title":"替留言區裝防護罩","text":"設定關鍵字過濾，或請朋友先幫你看留言，把有限的心力，留給真正喜歡你、願意跟你互動的人。"}]},"career":{"shine":"你適合讓人「有感覺」才會成交的工作：品牌行銷、視覺設計、文案、活動企劃、餐飲、美容、婚禮產業、客戶關係經營，或經營自己的生活風格品牌。你賺錢不是靠最便宜，而是靠讓人被打動：客人因為一張手寫卡片記住你，也因為被好好對待而一直回來。","shadows":[{"title":"被辦公室氣氛綁住","text":"辦公室氣氛一僵，你可能很難專心，甚至因為一個合不來的同事就想離職。"},{"title":"不好意思收熟人的錢","text":"朋友來找你幫忙設計或布置，你常常不好意思報價，最後做了很多，卻沒有收入。"}],"practice":[{"title":"把作品整理成作品集","text":"把你做過最滿意的作品整理成作品集或 IG 版面，讓人一看就知道你的品味。"},{"title":"先談錢再談感情","text":"接案時先講清楚價格和範圍，醜話說在前面，關係反而能維持得更久。"},{"title":"挑重視人的團隊","text":"面試時多問一句「團隊平常怎麼溝通」，選重視人也重視美感的地方。"}]},"partners":["探險家","統治者"],"items":["東西好看，就算比較貴我也會買。","朋友提過的小事，我常常會記得很久。","我做事常常是因為心動，而不是因為划算。","對方回覆變冷淡時，我會擔心是不是自己做錯了什麼。","為了讓重要的人開心，我常常委屈自己。","吃飯、送禮這些小事，我會花心思弄得有氣氛。"],"as_second":"你做事很在意「感覺對不對」：環境、氣氛、跟誰一起。它讓你的生活有質感，也讓你容易為了在乎的人委屈自己。"},"創造者":{"name":"創造者","en":"Creator","keywords":["原創","美感","想像","專注","細節","表達"],"people":["宮崎駿","草間彌生","李安","周杰倫","吳季剛"],"brands":["LEGO 樂高","Adobe","Canva","Pinkoi","琉璃工房"],"manifesto":"我想把腦中的畫面變成真的，做出一件就算過了很多年，還有人記得的東西。","portrait":{"text":"你一直想做東西，不是為了證明自己很厲害，而是腦中的畫面不做出來，你會一直放不下。走在街上看到一個招牌，你會想字體可以怎麼改；用一個 App，你會想流程哪裡卡卡的。你的資料夾裡可能同時躺著「最終版」「最終版2」「真的最終版」。別人說「差不多就好」，你不是聽不懂，只是你看得見還差的那一點。對你來說，做東西是你跟世界說話的方式。","questions":"你常常問自己：「這個還能不能更好？」看到別人的作品，你第一個念頭是：「如果是我，會怎麼做？」改到第十版的深夜，你偶爾也會懷疑：「我做的東西真的有人需要嗎？還是只有我自己在乎？」","lesson":"你正在練習的，是在完美和完成之間找到平衡。你的高標準是天賦，但作品要被看見才有機會打動人。你不需要降低標準，而是學會在八十分時先放出去，再從別人的反應裡繼續修，讓你的創造力真的走進別人的生活。"},"mechanism":{"pursuit":"你追求的是做出有自己印記的東西。比起很快被很多人看見，你更想要一件多年後回頭看，還會覺得「這是我做的，我很驕傲」的作品。你不是不在乎被喜歡，只是比起被喜歡，你更在乎它像不像你。","drive":"推著你的，是腦中那個還沒被做出來的畫面。它會在洗澡時、搭捷運時一直冒出來，直到你動手為止。當作品終於成形，有人看了眼睛一亮，你會忘記熬過的那幾個晚上。","fear":"你最怕的，是做出來的東西很普通，或被一句「這個早就有人做過了」打回原形。你也怕靈感哪天用完。所以有時你不是懶，而是太怕不夠好，乾脆一直不開始。","belief":"「值得做的東西，就值得做到最好。」你相信觀眾說不出差別在哪，但一定感受得到用心。"},"strengths":[{"title":"總能想到別人沒想到的角度","text":"你受不了跟別人一樣，所以拿到題目，會先想「大家都會怎麼做」，再故意繞開。一份普通的年終簡報，你可能用一張手繪地圖講完。這份想像力，讓你的作品在一堆相似的東西裡被記住。"},{"title":"對細節有極高的敏感度","text":"你看得見細節，是因為你在乎整體的感覺對不對。字距差一點、配色不太合、轉場慢了半秒，你都會卡住。很多人說不出為什麼喜歡你做的東西，其實就是這些沒人注意的地方在發揮作用。"},{"title":"能長時間沉浸在創作裡","text":"只要題目讓你有感覺，你可以從下午做到天黑，連外送放在門口都忘了拿。你不是在硬撐，而是在那個狀態裡你最像自己。這種投入讓你做得出別人嫌麻煩的作品，技術也一次次累積。"},{"title":"把抽象的想法變得具體","text":"討論卡住時，你常是那個說「我先做個樣子給大家看」的人。別人腦中模糊的概念，你能畫出來、做出草圖，讓大家一看就懂。你不是比較會說，而是習慣用做出來的東西說服人。"}],"best_scenes":"從零開始的專案最適合你：替一個還沒有樣子的品牌想樣子、把一份枯燥的報告變好看、做出產品的第一版，或任何對方說「隨便你發揮」的時刻。","value":"你帶給團隊的，是讓作品被記住的那一點不一樣。大家只想把事情做完時，你會提醒「這裡可以更好」；你不是在挑毛病，而是讓夥伴發現，原來自己做的東西也可以讓人驕傲。","weaknesses":[{"title":"想法比做完的多","text":"新點子對你太有吸引力，上一個還沒收尾，你可能已經開了下一個資料夾，例行的維護和後續就被冷落。"},{"title":"改到錯過時機","text":"你看得到每個還不夠好的地方，所以改了又改，結果錯過最好的發布時間，或乾脆沒發出去。"},{"title":"批評聽起來像在說你","text":"你把自己整個放進作品裡，所以別人一句「這裡怪怪的」，你可能聽成「你不夠好」，難過好幾天。"},{"title":"先做了，才發現沒問清楚","text":"你很快就能把想法做出來，但可能做完才發現，客戶要的其實不是這個；先動手，有時會跳過先問。"}],"risks":[{"title":"一個人做到孤立","text":"你習慣自己把東西做到好才給人看，久了身邊沒有人能一起討論，卡關時只能一個人悶著，越悶越懷疑自己，想法也越收越窄。"},{"title":"陷入比較的焦慮","text":"滑社群看到同齡的人作品又快又好，你可能開始懷疑自己的才華和速度，甚至因此停下手，把原本的熱情一點一點耗掉。"},{"title":"被修改磨掉熱情","text":"接案久了，作品一再被改成你不認同的樣子，你可能慢慢只做「客戶會過的版本」，某天發現自己已經不太想動手了。"}],"growth":["替每個作品先訂好發布日，時間到就放出去，剩下想改的寫在清單裡，留到下一版。","把重複的工作做成範本，把省下來的力氣留給真正需要你的那一塊。","動手之前先寫一句「這是做給誰、想讓他感覺到什麼」，再開始畫第一筆。"],"evolution":{"from":"追求完美的藝術家","to":"讓作品被看見的人","text":"成熟的創造者不只會做，也懂得讓作品走出去。你不需要少一點堅持，而是把堅持用在對的地方，讓更多人看見你，也撐得起你想要的生活。"},"relationship":{"shine":"你表達在乎的方式，常常是親手做點什麼。朋友生日，你可能花一個晚上做一張別人買不到的卡片。和你聊天很有趣，因為你總有新的角度。你也很懂得欣賞，看到別人的好作品會真心稱讚，而且說得出好在哪裡，讓人覺得自己的努力真的被看見。","shadows":[{"title":"一投入就消失","text":"一進入創作狀態，你可能兩天不回訊息，朋友或另一半還以為你在生氣。"},{"title":"把標準套到別人身上","text":"你對作品的高要求，可能不自覺用在朋友身上，一句「這個字型有點醜」就讓人覺得被挑剔。"},{"title":"心情跟著作品起伏","text":"作品順的時候你很好聊，卡關時就悶悶的，身邊的人不太知道該靠近還是走開。"}],"practice":[{"title":"消失前先說一聲","text":"要趕作品前，先傳一句「我這兩天會很難找，不是不理你」，讓重要的人安心。"},{"title":"先欣賞再給意見","text":"看別人的東西時，先說一個你真的喜歡的地方，再說你的建議，對方比較聽得進去。"},{"title":"讓人看一眼半成品","text":"卡關時把做到一半的東西給信任的人看，他不一定懂，但陪你看一下就會鬆一點。"}]},"energy":{"charge":["逛展覽、書店或一間很有風格的小店","一整個下午不被打擾，專心做東西","學會一個新技巧，馬上就想拿來試","看到有人因為你的作品眼睛一亮"],"drain":["被要求照著別人的作品做一個一樣的","一直做重複、沒有變化的工作","作品被不懂的人改得面目全非","一天被會議切成好幾段，沒辦法專心","只看數字、不在乎品質的環境"],"message":"你的作品不用等到完美才有資格被看見。每一次拿出來，都是你和世界的一次對話，也是下一件更好作品的起點。別讓「還不夠好」偷走你的熱情。你心裡那些畫面值得被做出來，而且只有你做得出那個樣子。"},"ip":{"positioning":"讓人眼睛一亮的作品型創作者／公開製作過程的美感職人","core":"你的內容核心是「從零到成品」的過程和獨特的美感。適合做製作過程、作品拆解、設計和剪輯技巧、靈感來源分享。可以賣原創作品、設計模板、素材包、創作課程、客製化服務，或和重視質感的品牌合作。觀眾追蹤你，是因為想看你又做出什麼。","shadows":[{"title":"產出太慢","text":"每支都想做到滿分，更新頻率太低，觀眾還沒記住你，就被別人的內容蓋過去。"},{"title":"太在意數據","text":"用心做的作品觀看數不如預期，你可能開始懷疑自己，甚至想刪掉重來。"},{"title":"只秀成果不給價值","text":"作品很美，但觀眾不知道能從中學到什麼，看完按讚卻不會追蹤或購買。"}],"practice":[{"title":"分成作品和日常兩種內容","text":"精心製作的作品一個月發一兩支，其他時間分享製作過程和小技巧，讓更新穩定，也讓觀眾看見你的用心。"},{"title":"把技巧整理成可以賣的東西","text":"把你常用的配色、模板、剪輯流程整理成素材包或小課程，讓喜歡你作品的人有機會把你的美感帶回家。"}]},"career":{"shine":"你最有動力的時候，是作品上看得見自己的痕跡。所以設計、影像創作、內容企劃、產品開發、空間規劃這類工作很適合你。你也可以經營個人工作室，靠接案、授權、販售作品和教學累積收入。你不是靠價格搶客人，而是風格一旦被認出來，客戶會指名找你。","shadows":[{"title":"不擅長談錢和合約","text":"你只想專心做作品，報價隨便開、合約沒細看，結果改了十次只收到一次的錢。"},{"title":"收入忽高忽低","text":"你靠口碑接案，忙的時候接不完，空的時候兩個月沒有案子，很難好好規劃生活。"}],"practice":[{"title":"作品集配一張報價單","text":"把代表作整理成作品集，附上清楚的價格和修改次數，客戶一看就懂你的價值。"},{"title":"找一個管營運的夥伴","text":"和擅長業務或管理的人合作，你專心做東西，對方負責把作品變成穩定收入。"},{"title":"每季做一件只為自己的作品","text":"接案之外，每季留一件不給客戶改的東西，讓你記得當初為什麼喜歡做。"}]},"partners":["統治者","凡人"],"items":["看到一個東西，我常會想「換作是我，會怎麼改得更好」。","我願意花很多時間在別人不太會注意到的細節上。","我最開心的，是做出別人做不出來的東西。","我很怕自己做出來的東西，跟別人的都差不多。","東西沒做到我滿意，我就不想拿給別人看。","照著範本做，我會覺得很沒意思。"],"as_second":"你很難接受「差不多就好」，總想做出一點自己的樣子。它讓你做的東西有辨識度，也讓你常卡在「還不夠好」，遲遲不敢拿出來。"},"弄臣":{"name":"弄臣","en":"Jester","keywords":["幽默","好玩","輕鬆","反應快","活在當下","愛玩梗"],"people":["金・凱瑞","羅温・艾金森（豆豆先生）","吉米・法倫","邰智源","阿翰"],"brands":["Duolingo","M&M's","Old Spice","這群人 TGOP","乖乖"],"manifesto":"人生已經夠累了，我想讓每一天都有一點好笑的事，讓身邊的人一起笑出來。","portrait":{"text":"你想讓日子好過一點，所以總在找事情好笑的那一面。會議開到大家快睡著，你一句吐槽讓全場笑出來；朋友傳來一長串抱怨，你回一張剛剛好的梗圖，他就回了「哈哈哈哈」。你不是不認真，而是知道人笑過之後，才有力氣面對麻煩。與其先擔心明天，你更想把今天過得有趣一點。你看起來很隨興，其實很會讀空氣：什麼時候該接梗、什麼時候該閉嘴，你比誰都清楚。","questions":"這件事可以怎麼變得好玩一點？大家現在開心嗎？如果我不搞笑，大家還會找我嗎？你常在大家聊天時一邊聽一邊想梗，等到全場笑出來，才偷偷鬆一口氣，好像剛完成一件很重要的任務。","lesson":"你正在練習的不是變得不好笑，而是讓人也看見認真的你。幽默是你的天賦，卻不是你唯一的價值。當你願意在信任的人面前放下玩笑，說出真正的煩惱，你會發現，被喜歡不需要一直表演，安靜的你一樣有人想陪。"},"mechanism":{"pursuit":"你要的不是很多錢或很高的位子，而是每一天都有一點樂趣。不被太多規矩綁住、跟喜歡的人笑到肚子痛、週五下班一群人在超商門口聊到忘記時間，這種輕盈的感覺，對你來說就是幸福。","drive":"只要一件事好玩，你就有用不完的力氣；如果它很無聊，你會先想辦法把它變好玩。月報第一頁放一張梗圖、週會開場加一個猜謎，你不是在混，而是在替自己和大家找撐下去的理由。","fear":"你最怕的不是失敗，而是冷場。講完一句話沒人笑、聚會突然安靜下來，都會讓你坐立難安。你心裡也藏著一個小小的擔心：如果哪天我不好笑了，大家是不是就不需要我了。","belief":"「笑一笑，再難的事也比較撐得過去。」你相信幽默不是逃避，而是讓人重新有力氣面對問題的方法。"},"strengths":[{"title":"瞬間救場的反應力","text":"你不是準備好笑話才上場，而是反應快到話自己跑出來。簡報投影突然當機，你一句「看來電腦也需要休息」，全場笑了，你也爭取到重開機的時間。場面一僵，大家會下意識看向你。"},{"title":"讓壓力變輕的轉換力","text":"別人覺得天快塌下來的事，你能換個好笑的角度再說一遍，讓大家覺得「好像也沒那麼糟」。結案前一晚整組人臉都很臭，你一句吐槽，大家笑完就回去把事情做完了。"},{"title":"不怕看起來傻的創意","text":"你不怕出糗，所以敢提別人不敢說的點子。很多讓人想轉傳的活動和文案，都是從你一句「如果這樣會不會很好笑」開始的；大家笑完才發現，這個瘋點子其實可行。"},{"title":"把無聊變好玩的本事","text":"再無聊的事，你都找得到玩法。整理倉庫變成計時比賽，新人要背的流程被你編成順口溜，大家不知不覺就做完了，還覺得其實滿好玩的。"}],"best_scenes":"需要讓人放鬆、讓事情變好看的地方最適合你：社群經營、活動主持、品牌行銷、腦力激盪、團隊破冰。尤其是知識很硬、大家看兩行就想滑走的時候，你能把它變成讓人笑著看完的東西。","value":"你帶給團隊的是喘口氣的空間。專案卡關、大家盯著螢幕不說話的時候，你一句話讓辦公室重新有笑聲。你不是在打混，而是讓緊繃的人鬆開肩膀，笑完更有力氣繼續往前走。","weaknesses":[{"title":"用玩笑閃過該談的事","text":"遇到嚴肅或尷尬的話題，你的第一反應是先開個玩笑，問題卻沒有真的被處理。"},{"title":"把別人的煩惱講輕了","text":"你想讓對方輕鬆一點，但對方正難過時，一句「沒那麼嚴重啦」可能讓他覺得不被理解。"},{"title":"玩笑沒拿捏好","text":"太想逗笑大家時，可能不小心踩到別人在意的點，笑完才發現對方臉色不對。"},{"title":"不好玩的事一直拖","text":"報帳、對帳、長期計畫這種怎麼包裝都不好玩的事，你常常拖到最後一天才做。"}],"risks":[{"title":"笑聲變成面具","text":"你可能習慣用好笑蓋住疲累和難過，讓大家以為你永遠沒事。久了，身邊的人不知道怎麼關心你，你也越來越難說出真心話。"},{"title":"被定型成搞笑擔當","text":"大家習慣你負責搞笑，久了開會時沒人問你的專業意見，有重要任務也比較少想到你。你明明很有想法，卻被困在「那個好笑的人」的位置。"},{"title":"只顧眼前的快樂","text":"活在當下是你的優點，但如果從不想以後，學新技能、想清楚職涯方向這些事都可能一延再延，等到想轉換跑道時，才發現手上沒有準備。"}],"growth":["每週找一個信任的人，說一件最近真正煩惱的事，整段不加任何玩笑。","把一件無聊但重要的事設成計時挑戰，例如二十分鐘內把發票全部對完。","開玩笑前先看一眼在場的人：這個梗，會不會剛好戳到誰在意的事？"],"evolution":{"from":"帶來笑聲的開心果","to":"讓人笑著想通的人","text":"你會從「讓大家笑」走到「讓大家笑完想通一件事」。幽默不再只是炒熱氣氛，而是你說出真話、陪人走過低潮的方式，大家記住的不只是笑點，還有你說的道理。"},"relationship":{"shine":"你不是只會逗人笑，而是用笑讓兩個人的日子變輕。一起追劇時你的吐槽比劇情還好看；對方加班到很晚，回家會看到你在冰箱貼了一張畫得很醜的加油圖。和你在一起，平凡的日子也有笑聲，低潮時對方知道，身邊有個一定能讓他笑出來的人。","shadows":[{"title":"吵架時想笑場帶過","text":"吵到一半你做個鬼臉想化解，對方卻覺得你根本沒把這次爭執當一回事。"},{"title":"說好的事臨時變卦","text":"約好的計畫你常常臨時想改，對方會不確定，遇到大事時能不能依賴你。"},{"title":"日子一平淡就悶","text":"生活一進入固定節奏你就覺得悶，對方可能誤以為，是自己變得無聊了。"}],"practice":[{"title":"替重要的話題留時間","text":"當對方說「我想認真聊一下」，先把手機翻面，聽完再回應，玩笑留到最後。"},{"title":"守住幾個小承諾","text":"選一兩件固定的事一定做到，例如每週三一起吃晚餐，讓對方知道你玩歸玩，是靠得住的。"},{"title":"平淡的日子也找玩法","text":"把週末散步變成一起找附近最好吃的蛋餅，讓新鮮感不必靠大活動才有。"}]},"energy":{"charge":["跟一群好朋友瞎聊、互相吐槽到半夜","想到一個好梗，群組一片哈哈哈","在路邊發現一塊怪招牌，拍下來分享","做一件沒有標準答案、可以亂玩的事"],"drain":["整天開沒有重點、又很嚴肅的會","被要求照表操課，不能有一點自己的發揮","待在大家都不苟言笑的辦公室","講了笑話，換來一片沉默","一直被提醒「成熟一點」"],"message":"你的幽默是一種天賦，也是一種溫柔：你讓很多人在很累的日子裡，想起笑是什麼感覺。不過，你不需要一直當那個帶來快樂的人。今天累了，就允許自己不接梗，換別人逗你笑一次。認真的你、安靜的你，一樣有人想留在身邊。"},"ip":{"positioning":"讓人笑著學會東西的「知識系搞笑咖」或「辦公室吐槽王」","core":"你的內容核心是「好笑又有用」：用短劇、吐槽、反差和自嘲，把枯燥的知識、上班的崩潰日常、新工具的實測變得好看。觀眾因為好笑點進來，因為學到東西留下來。適合賣的是品牌合作、活動主持、品牌短影音企劃、周邊商品，或輕鬆好上手的入門課程。","shadows":[{"title":"笑點蓋過內容","text":"影片很好笑，觀眾看完卻不記得你在講什麼，很難轉成信任和收入。"},{"title":"為了流量誇大","text":"為了效果把事情講得比實際更誇張，被拆穿時，會一次傷到好不容易累積的信譽。"},{"title":"很難穩定更新","text":"靈感來時一天拍三支，沒靈感時消失一個月，觀眾和演算法都抓不住你。"}],"practice":[{"title":"每支影片留一個重點","text":"先決定觀眾看完要記住哪一件事，再把梗包在它外面，讓笑點替知識服務，而不是搶走它。"},{"title":"建立梗的素材庫","text":"平常在手機記下生活中好笑的瞬間和留言，沒靈感時就有東西可以拍，更新會穩定很多，也不用每次從零開始想。"},{"title":"笑點不碰事實","text":"表情和劇情可以誇張，但數據和實測結果照實說，讓觀眾笑完還能信任你，這是好笑和亂講的差別。"}]},"career":{"shine":"你適合靠創意和人緣吃飯的工作：社群小編、廣告創意、主持人、活動企劃、業務，或任何要跟人打成一片的職位。你不是靠埋頭苦幹被看見，而是靠「被記住」：一篇好笑的貼文帶來品牌合作，一場熱鬧的尾牙帶來下一個主持邀約，人緣就是你的資產。","shadows":[{"title":"撐不過無聊期","text":"事業進入要重複累積的階段時，你可能覺得沒意思，做不到一年就想換方向。"},{"title":"收入跟著心情起伏","text":"有案子時先享受再說，淡季一來才發現存款不夠，只好什麼案子都接。"}],"practice":[{"title":"枯燥的事排固定時段","text":"報帳、合約每週固定排一小時一次處理完，或交給擅長的人，別讓它卡著。"},{"title":"設定自動存錢","text":"收入一進來，先自動轉一部分到另一個帳戶，不靠意志力，也不用每個月重新下決定。"},{"title":"選定一個主力題材","text":"好玩之餘選定一個你最拿手的主題，讓人一想到那個主題就想到你。"}]},"partners":["智者","統治者"],"items":["聚會冷場時，我通常是先開口炒熱氣氛的人。","我很容易在無聊的事情裡找到好笑的地方。","做一件事，我最在意的是好不好玩。","我很在意自己說的話會不會讓場面變冷。","遇到不想面對的話題，我常會開個玩笑帶過。","為了今天玩得開心，我願意把明天的事往後放。"],"as_second":"再嚴肅的場合，你都找得到一點好笑的地方。它讓身邊的人覺得輕鬆，也讓你習慣用玩笑帶過那些其實很在意的事。"},"智者":{"name":"智者","en":"Sage","keywords":["求知","洞察","理性","真相","思考","深度"],"people":["卡爾．薩根（Carl Sagan）","珍．古德（Jane Goodall）","愛因斯坦（Albert Einstein）","蔣勳","李開復"],"brands":["Google","TED","Notion","Barnes & Noble","泛科學 PanSci"],"manifesto":"我想看清事情真正的樣子，再把我懂的，說成你也聽得懂的話。","portrait":{"text":"你想看清事情真正的樣子，因為搞懂了，心裡才會踏實。所以看到一則說法，你的第一個反應不是轉傳，而是「根據是什麼？」。朋友要買冷氣，你會丟給他一張自己整理的比較表；聚餐有人說「聽說那個新聞是真的」，你已經在桌下默默找到原始出處。你不是愛挑毛病，而是受不了自己相信一件沒弄懂的事。一本好書、一個終於想通的問題，能讓你開心好幾天。","questions":"你常問自己：「這件事背後真正的原因是什麼？」「我是不是只看到了一部分？」還有一個不太說出口的：「我都查了這麼多，為什麼還遲遲不開始？」你不是缺資料，而是在等一個百分之百確定的時刻，而那個時刻通常不會來。","lesson":"你相信想清楚才不會白忙，所以你正在練習的是讓「知道」變成「做到」。你並不是不敢動，而是總覺得再查一輪就好。成熟的智者明白，很多答案只有動手之後才會出現：在只有七成把握時先做決定，並且願意說「我可能錯了，我們再調整」。"},"mechanism":{"pursuit":"你追求的是理解：一件事怎麼運作、一個人為什麼這樣想。你要的不是贏過別人的知識量，而是想通那一刻的踏實感，像拼圖最後一片「喀」地放進去，比任何獎勵都讓你滿足。","drive":"推動你的是想做出好判斷的渴望。你不只是愛讀書，而是相信想清楚能讓人少走冤枉路。所以買一支手機，你也會開十幾個分頁、看完三篇評測和一整串留言，直到心裡有一個站得住的答案。","fear":"你最怕被騙、被誤導，或在大家面前顯得無知。你怕的不只是不懂，而是懂錯了還不知道。發現自己在群組裡分享過的消息是假的，你可能會在心裡反覆檢討好幾天。","belief":"「先想清楚，才不會白忙一場。」你不是慢，而是相信先看懂問題、找到關鍵，才是對自己和別人負責。"},"strengths":[{"title":"能把複雜的事講清楚","text":"你自己要先懂才安心，所以一團亂的資訊到你手上，會變成三個重點。同事看了二十頁合約還一頭霧水，你一句「其實就是誰付錢、誰負責、什麼時候能退」，大家就懂了。你不是話多，而是說得準。"},{"title":"冷靜判斷，不容易被帶風向","text":"你在乎的是真相，不是熱度。群組裡大家瘋傳一則消息時，你會先點開原始來源，看是誰說的、哪一年的。你的判斷不一定最快，但通常最穩，常替團隊擋掉一時衝動的決定。"},{"title":"看得到別人沒注意的關鍵","text":"你習慣多想一層：這個數字怎麼算的？這樣做有什麼副作用？大家準備拍板時，你舉手問「退貨的成本算進去了嗎」，會議室安靜三秒，有人說「啊，對耶」。你不是想拖延，而是在替團隊省下重來的錢。"},{"title":"願意推翻自己的舊想法","text":"你忠於的是事實，不是面子。讀到一篇新研究跟你上個月說的相反，你會回頭跟朋友說「我之前講錯了」。你並不是沒主見，正是這種願意更新的誠實，讓你的知識不會過期，也讓別人更信你。"}],"best_scenes":"你要想得夠深才安心，所以研究、分析、做決策的場合最能讓你發光。你不是只適合待在書房，把專業翻成白話、替方案做評估、寫一份讓老闆看完就能拍板的報告，都是你的主場。","value":"你在乎事實，所以你是團隊裡的清醒劑。大家被一個熱門趨勢沖昏頭時，你會問「去年做這個的人，後來怎麼了？」。你不是在潑冷水，而是讓團隊做出更有根據、更不容易後悔的決定。","weaknesses":[{"title":"太想講對，反而講太細","text":"你怕別人誤會，所以常從背景開始講。對方只想知道要選 A 還是 B，你已經講到第五分鐘。"},{"title":"冷靜到讓人覺得有距離","text":"你習慣先查證再反應。大家正為好消息歡呼時，你那句「先看看來源」聽起來有點掃興。"},{"title":"想太多，做太少","text":"你總能多想一層，也就總能再找到一個沒考慮到的地方，資料夾越來越滿，真正的行動一直往後延。"},{"title":"不太敢說「我不知道」","text":"你太在意說得對，所以到了不熟的領域，寧可整場不開口，也不想冒險說錯一句。"}],"risks":[{"title":"只在台下當評審","text":"你很會看出別人哪裡沒做好，時間一久，可能變成永遠在台下打分數的人：別人的作品你挑得出十個問題，自己的作品卻一件都還沒公開。"},{"title":"只活在腦袋裡","text":"你想得多、感受得少，可能沒發現自己已經累了好幾週。理性能幫你做決定，卻不能代替好好休息，也不能代替有人陪在身邊。"},{"title":"用知識築一道牆","text":"你不是驕傲，而是不安的時候會躲進專業裡：多講幾個術語、多一句「其實不是這樣」，讓本來想靠近你的人覺得被比了下去。"}],"growth":["替每次研究訂一個截止日，時間到就先做出一個小版本，再用結果繼續學。","朋友來找你訴苦時，先問一句「你想聽建議，還是想有人聽？」再決定要不要分析。","在不熟的場合練習說「這個我不懂，你可以多講一點嗎」，你會發現對方反而更信任你。"],"evolution":{"from":"埋頭研究的思考者","to":"讓人看清方向的引路人","text":"你不再等到全懂才開口，而是把七成的把握也拿出來分享、拿去試。你不是變得不嚴謹，而是發現行動帶回來的答案，常常比書上寫的更準。"},"relationship":{"shine":"你想真正弄懂一個人，所以會把對方的處境聽完、問清楚才開口。你不是冷淡，而是不想隨便給答案。朋友半夜傳來一長串煩惱，你隔天回的可能是一段把來龍去脈理順的訊息，他看完第一次覺得事情有解。吵架時你也很少失控，能把話慢慢談開。","shadows":[{"title":"把談心變成解題","text":"對方只是想抱怨主管，你卻開始分析原因、列出三個方案，他反而覺得沒被理解。"},{"title":"忍不住當場更正","text":"聚會上有人把年份講錯，你很難不出聲，場面就這樣冷了一下，對方也有點下不了台。"},{"title":"情緒藏得很深","text":"你習慣自己默默消化，親近的人常常不知道，你其實也會難過、也會累。"}],"practice":[{"title":"先接住，再分析","text":"先說一句「聽起來真的很煩」，等對方氣消了，再問他要不要聽聽你的看法。"},{"title":"挑值得更正的時機","text":"不影響決定的小錯就放過，真正重要的事，再私下、溫和地提出來。"},{"title":"用「我覺得」開頭","text":"練習說「我覺得有點失落」，而不只是「我認為原因是」，讓別人走得進你心裡。"}]},"energy":{"charge":["一整段沒人打擾、可以專心讀書或思考的時間","跟聊得來的人進行一場深度對談","終於想通一個卡了很久的問題","學到一個能推翻自己舊想法的新觀點"],"drain":["一直被要求「先做再說，不用想那麼多」","充滿空話、講了很久卻沒有重點的會議","被迫在資訊不足的情況下馬上拍板","身邊的人不斷轉傳沒查證過的消息","需要長時間社交、一直講場面話的場合"],"message":"你的認真和好奇，讓很多人因為你少走了彎路，這件事真的很珍貴。你不需要什麼都懂才有資格開口，也不需要準備到完美才出發。你不是不夠好，你只是太習慣再確認一次。有些答案，要先走一步才看得見；你已經知道的，夠你邁出下一步了。"},"ip":{"positioning":"「把複雜講簡單的人」：幫觀眾查清楚、想明白的知識整理者，或值得信任的懶人包作者。","core":"你的內容核心是「我幫你查過、想過了，這是重點」。拆解新聞、比較工具、整理好書和研究、破解常見迷思，都很適合你。可以賣的東西有：深度電子報或會員專欄、知識型線上課程、讀書會或顧問諮詢、整理好的模板和資料庫，以及企業內訓和講座。","shadows":[{"title":"內容太長太硬","text":"想講得完整，結果開頭三秒還在鋪陳背景，觀眾早就已經滑到下一支了。"},{"title":"一直準備，遲遲不發","text":"腳本改了五版還是不滿意，帳號開了半年，到現在只發了兩支影片。"},{"title":"少了你這個人","text":"只有知識，沒有個人觀點和故事，觀眾學到東西，卻記不住是誰教的。"}],"practice":[{"title":"結論放在第一句","text":"先講「答案是什麼」，再補為什麼。觀眾先拿到價值，才會留下來聽你的分析，這也是最能展現你專業的方式。"},{"title":"每支內容都附一個行動","text":"結尾給觀眾「你今天就可以做的一件事」，讓知識變成用得上的東西，也順便幫你自己練習從想到做。"}]},"career":{"shine":"你想把事情搞懂，而很多人願意為「有人已經搞懂了」付錢，所以研究員、分析師、顧問、老師、編輯、產品企劃、工程師都適合你。你不是只能領薪水，你花時間弄懂的東西本身就是資產：顧問、開課、寫專欄、經營付費社群，都是把它變成別人捷徑的方式。","shadows":[{"title":"低估自己的價值","text":"你覺得自己懂的「大家應該都知道」，報價時一直往下砍，最後收的錢跟花的時間不成比例。"},{"title":"只想當專家，不想推銷","text":"你很排斥介紹自己、談價錢，好的知識就這樣沒被真正需要的人看到。"}],"practice":[{"title":"從最常被問的問題開始","text":"列出朋友最常問你的三個問題，把答案整理成一份指南或一堂小課，就是第一個產品。"},{"title":"練習一分鐘介紹自己","text":"用一句話說清楚你幫誰、解決什麼問題，讓機會知道該怎麼找上你。"},{"title":"和敢推的人合作","text":"找一個敢推、敢賣的夥伴，你負責內容的深度，對方負責把它推出去。"}]},"partners":["英雄","弄臣"],"items":["聽到一個說法，我會忍不住去查它到底對不對。","我能把一件複雜的事，整理成幾句話講清楚。","做一件事之前，我會想先把原理弄懂。","發現自己相信過的消息是錯的，我會在意很久。","一件事我常常研究很久，卻遲遲沒有真正開始做。","我寧願聽一個讓人不舒服的事實，也不要好聽的假話。"],"as_second":"你做決定前，總會先問一句「這是真的嗎？」。它讓你不容易被唬弄，也讓你有時候想太久，明明可以先做，卻還在查資料。"},"魔法師":{"name":"魔法師","en":"Magician","keywords":["轉變","遠見","點子王","化繁為簡","驚喜感","可能性"],"people":["華特・迪士尼","劉謙","黃仁勳"],"brands":["Disney","Dyson","太陽劇團","teamLab","Gogoro"],"manifesto":"我相信每件事都還有另一種做法，我想讓看似不可能的事，在你眼前真的發生。","portrait":{"text":"你腦中一直在問「如果換個做法會怎樣」，因為你受不了一件事明明可以更好，卻被放著不動。所以同事還在抱怨報帳流程很卡，你已經在白板上畫出新的流程圖；朋友說想開店，你三分鐘內丟出五種玩法。你不是愛唱反調，而是真心相信每個卡住的地方都有解法。你身上有一種讓人覺得「這好像真的做得到」的力量，很多改變是從你一句「我們先試一次」開始的。只是你腦中的版本，常常跑得比身邊的人快好幾步。","questions":"這件事有沒有更聰明的做法？如果把規則整個換掉，會發生什麼事？我做的改變，是真的讓人變好，還是只是看起來很厲害？你不是在通勤時發呆，而是在腦中拆解一個流程；常常洗澡洗到一半想通了，頭髮還在滴水就跑去開電腦。","lesson":"你正在練習的不是想出更多點子，而是讓點子走出你的腦袋。你看得到終點，別人卻還站在起點，所以你要練習把願景拆成一步一步、別人跟得上的做法。也要願意承認：不是每件事都需要被你改，有些流程維持原樣，反而讓大家最安心。"},"mechanism":{"pursuit":"你要的不是掌聲，而是「事情因為我而不一樣了」的那一刻。看到同事用你教的方法少加兩小時班、聽到老客人說「你們這次改得真好」，那種親眼看見轉變發生的感覺，比任何獎金都讓你滿足。","drive":"你不是單純喜歡新東西，而是忍不住想知道它怎麼運作。一個新工具到手，你先拆開看原理，摸懂了就想把它跟手上的東西重新組合。別人在看說明書，你已經在想它還能拿來做什麼。","fear":"你看起來很敢改，其實比誰都怕好心辦壞事：推了一個新流程，卻讓團隊更亂；教了一個方法，卻害別人踩雷。你也怕自己變成只會講、拿不出成果的人，所以上線前一晚，你常常偷偷再測一遍。","belief":"「現在卡住的地方，一定還有沒被發現的解法。」你不覺得「以前都這樣」是理由，對你來說，現狀只是還沒被改好的版本。"},"strengths":[{"title":"看得見還沒出現的路","text":"你不是比較樂觀，而是習慣把問題當成線索。業績掉了，你想的是「客人是不是換地方買了」；預算被砍一半，你反而想出更省又更好玩的做法。別人還在開會討論原因，你的筆記本已經寫了三個方案。"},{"title":"把複雜講簡單的翻譯力","text":"你不是特別會講話，而是真的把原理想通了，才講得簡單。工程師講了二十分鐘主管還在皺眉，你畫一張圖、說一個比喻，大家就點頭。新手看不懂的軟體，你示範一次，對方就敢自己按下去。"},{"title":"讓人看見畫面的感染力","text":"你說服人不是靠數據，而是先讓人看到畫面：「想像一下，下個月這張報表會自己跑出來。」你講到一半眼睛會發亮，聽的人也跟著坐直。很多人第一次願意試新做法，是因為你先讓他們相信了。"},{"title":"第一個下場試新工具","text":"新的 AI 工具一出來，你通常是辦公室裡第一個註冊的人。你不怕按錯，也不怕摸索一整晚，試成功了就整理成一頁筆記丟到群組。不知不覺，大家遇到工具問題都先來問你。"}],"best_scenes":"當大家說「這已經沒救了」，就是你上場的時候：產品改版、品牌重新包裝、舊流程大翻修、公司導入新系統。還有需要讓台下「哇」一聲的提案和發表會，越是被期待，你越想變出別人沒想到的東西。","value":"你帶給團隊的不只是點子，而是「原來還可以這樣」的那口氣。當大家累到只想照舊、覺得多做多錯的時候，你會說「我們先試一個小版本看看」，讓人重新願意動手，也讓改變從不可能，變成下週就能開始的事。","weaknesses":[{"title":"路太多，收尾太少","text":"因為你看得到太多條路，很容易每條都想走一點，最後抽屜裡留下一疊做到一半的計畫。"},{"title":"把難事想得太簡單","text":"你一下就想通原理，容易以為做起來也很快，結果別人估三週的事，你只排了三天。"},{"title":"興奮時把話說滿","text":"畫面講得太生動時，你可能把效果說得比實際更好，讓大家的期待高到很難兌現。"},{"title":"新鮮感一過就沒勁","text":"工具一玩熟，維護、檢查、追進度這些事就讓你提不起勁，常常拖到有人來催。"}],"risks":[{"title":"為了改而改","text":"你可能明明舊方法運作得好好的，還是忍不住翻新。身邊的人才剛學會上一套流程，又要重學一次，久了，大家聽到你說「我有個新想法」，會先皺眉再聽。"},{"title":"推著別人往前走","text":"你看得到更好的版本，就容易急著讓大家照你的方向走，忘了問對方準備好了沒。你以為是在幫忙，對方感受到的卻是壓力，反而往後退。"},{"title":"只有你會的魔法","text":"你習慣自己想、自己試、自己搞定，別人還沒看懂，你已經做完了。久了團隊什麼都靠你，卻沒人學得會，你一請假事情就停擺，你也越來越累。"}],"growth":["每個新點子先寫下「這週就能試的最小一步」，做完那一步，再決定要不要繼續。","跟別人說效果之前，先自己實測一次，把真實花掉的時間也一起講出來。","每推一個新做法，就留一頁步驟給別人，讓它在你不在時也跑得動。"],"evolution":{"from":"點子不斷的造夢者","to":"讓改變成真的引路人","text":"你會從「我想到了」走到「你也做得到」。魔法不再是只有你會的表演，而是一份別人照著做也會成功的步驟，你不在現場，改變照樣發生。"},"relationship":{"shine":"你在關係裡給的不是甜言蜜語，而是「我們可以讓生活更好」的行動。朋友隨口說想學做麵包，下次見面你已經找好教室；伴侶抱怨每天通勤好累，你研究出一條少十分鐘的路線。和你在一起的人，常覺得自己的日子被打開了一點，好像什麼都還有辦法。","shadows":[{"title":"急著給解法","text":"你不是不在乎感受，而是太想幫忙。對方才說到一半，你已經在列方案，讓人覺得沒被聽完。"},{"title":"期待對方跟上你","text":"你一下就想到第三步，對方還在消化第一步，你不自覺嘆的那口氣，會讓對方覺得自己很慢。"},{"title":"用驚喜代替陪伴","text":"你很會安排特別的一天，但對方更需要的，可能是平常日子裡你準時回的那封訊息。"}],"practice":[{"title":"先問再出主意","text":"對方說完後先問一句：「你想要我給建議，還是陪你聊就好？」再決定怎麼回。"},{"title":"把改變變成邀請","text":"想讓對方試新東西時，說「要不要一起試一次」，不說「你應該這樣做」。"},{"title":"留一個固定的小習慣","text":"除了驚喜，也約一件每週固定的事，例如週日一起吃早餐，讓對方知道你一直都在。"}]},"energy":{"charge":["研究一個新工具到半夜，第一次就跑出結果","跟聽得懂的人站在白板前亂畫點子","有人跑來說「照你那招做，真的變快了」","看完一場展，腦中冒出三個新想法"],"drain":["每天重複同一套流程，連改一個步驟都不行","提了新做法，只換來一句「以前都這樣」","被要求照做就好，不能問為什麼","整個下午都在填報表、對發票","點子被當成空想，沒人願意先試一次"],"message":"你不是想太多，你只是比別人早一步看到可能。那些讓你睡前還在想的點子，也許正是身邊的人在等的解法。只是記得，魔法最動人的時刻，不是你一個人變出來的那一下，而是別人照著你的步驟，也變出來的那一下。慢一點沒關係，先讓一個人學會就好。"},"ip":{"positioning":"把不可能變日常的「效率魔法師」或「新工具翻譯官」","core":"你的內容核心是「轉變」：用前後對比、幕後拆解、三步驟教學，讓觀眾看到原本要很久的事，現在可以怎麼變快、變簡單。適合賣的是能帶來明顯改變的東西，例如工具教學課程、工作流程模板、一對一導入顧問，或幫小品牌做改造的服務。","shadows":[{"title":"效果講太滿","text":"標題寫「三秒搞定」，觀眾自己試卻要三十分鐘，信任感會一次掉光。"},{"title":"只秀成果不教方法","text":"一直展示很神的成果，觀眾覺得厲害卻學不到東西，久了就只是看熱鬧。"},{"title":"主題換太快","text":"這週講剪輯、下週講投資，追蹤的人搞不清楚你到底能幫他解決什麼問題。"}],"practice":[{"title":"每支影片都附實測","text":"把真實花的時間、失敗的地方一起拍出來。觀眾看到你也會卡關，反而更相信最後的成果是真的。"},{"title":"把魔法拆成步驟","text":"每次展示一個驚人的成果，就附上觀眾今天就能照著做的一步，讓「哇」變成「我也可以」。"},{"title":"選定一個轉變主題","text":"先鎖定一種你最想幫人完成的改變，例如「讓上班族每天少加班一小時」，做深了再往外延伸。"}]},"career":{"shine":"你適合工作裡有「改造」兩個字的位置：產品企劃、行銷創意、數位轉型、教育訓練、科技產品推廣，或自己接案當顧問。你不是靠時數賺錢，而是靠「改完之後的差別」：替公司把三天的流程縮成半天，替老品牌找回年輕客人，客人付錢買的是那個前後對比。","shadows":[{"title":"熱情跑在計畫前面","text":"你可能因為一個點子太興奮，就先辭職或先投錢，做到第三個月才發現從沒算過成本。"},{"title":"例行公事待不久","text":"工作一旦變成每天一樣，你可能半年就想換，履歷看起來很跳，別人不確定你能不能待住。"}],"practice":[{"title":"先用一個月試水溫","text":"新點子先用最低成本試一個月，看到真實的客人反應和數字，再決定要不要加碼。"},{"title":"每個計畫先算帳","text":"開始前寫下要花多少時間和錢、多久能回本，讓創意有底氣，不只靠熱情。"},{"title":"把做法寫成模板","text":"把你改造的方法整理成流程或模板，讓收入不必每次都靠你本人到場。"}]},"partners":["智者","照顧者"],"items":["就算原本的做法沒問題，我還是會想換個方式試試。","別人說做不到的事，我會想試試看有沒有辦法。","如果一件事做完什麼都沒改變，我會覺得白做了。","我擔心自己推動的改變，最後反而讓事情更糟。","我開始的計畫，常常比我完成的多很多。","能讓人「哇」一聲的新技術或新方法，特別容易吸引我。"],"as_second":"你不太滿足於「照原本的做」，總想讓事情因為你而變得不一樣。它讓你點子很多，也讓你開了很多頭，收尾卻常常拖著。"},"統治者":{"name":"統治者","en":"Ruler","keywords":["秩序","負責","標準","決斷","穩健","格局"],"people":["安娜・溫圖","戈登・拉姆齊","張忠謀","王永慶","徐重仁"],"brands":["Rolex","Mercedes-Benz","American Express","台積電","鼎泰豐"],"manifesto":"我願意扛起責任，把混亂整理成秩序，讓大家知道往哪裡走、可以放心跟上。","portrait":{"text":"你一看到混亂就想把它排好，不是因為你愛管，而是你沒辦法看著事情沒人負責。朋友群組裡大家還在問「那誰要訂餐廳」，你已經做好表單、分好誰出多少錢。開會開到最後，常常是你說「所以結論是：小陳負責這個，週五交」。你習慣想得很遠：這樣做三個月後還撐得住嗎？你不一定愛出風頭，但遇到大事，大家會自然看向你，等你說下一步。","questions":"你常在心裡問：「這件事到底誰在負責？」做決定時，你會想：「一年後回頭看，這樣做還站得住嗎？」把工作交出去的那個晚上，你也可能偷偷問自己：「如果我不盯著，事情還會照我想的樣子走嗎？」","lesson":"你正在練習的，是從掌控走向信任。你扛得住很多事，但真正厲害的帶領，是建好一套不需要你盯著也能運作的方式。你不是要放下標準，而是讓別人有機會照著標準做，甚至做錯一次，你的格局才會越來越大。"},"mechanism":{"pursuit":"你追求的是建立一個能長久運作的東西：一個團隊、一家店，或一套做事的標準。你並不是想站在最高處，而是希望自己負責的地方井井有條，跟著你的人因此過得安心、不用天天救火。","drive":"推著你的，是把一件事從亂到穩、從小做大的成就感。看到自己排的流程順順運作，團隊照計畫交出成果，你會覺得前面的壓力都值得。被託付一件重要的事，對你來說比被稱讚更有分量。","fear":"你最怕局面失控：事情一團亂卻沒人負責，或辛苦建好的東西被一夕推翻。所以你常想把每個環節握在手裡；不是不信任人，而是你知道真的出事時，最後要收拾的是你。","belief":"「好的制度和標準，比一時的熱情更能讓事情長久。」你相信清楚的規矩，其實是在保護團隊裡的每一個人。"},"strengths":[{"title":"在混亂裡很快排出順序","text":"你受不了沒有方向的空轉，所以大家七嘴八舌時，你已經在白板上寫出一、二、三。你會把一件大事拆成步驟和分工，讓每個人知道自己今天要做什麼，整個團隊的心就定下來。"},{"title":"敢拍板，也敢扛結果","text":"你覺得一直不決定，比決定錯更傷，所以討論半天沒結論時，你願意站出來說「就這樣做，出事我負責」。你不是比較愛當老大，而是寧可自己扛，也不想看大家卡在原地。"},{"title":"把經驗變成標準和流程","text":"你做好一次，就會想「下次怎麼讓別人也做得一樣好」。所以你會把做法整理成清單和範本，讓新人照著做也有八成水準。一個人的努力，因此變成整個團隊都交得出的成果。"},{"title":"看得遠，也想得長","text":"你在意的是能不能撐得久，所以做決定時會想半年、一年後的影響。別人只想先過這關，你會問「這樣明年還能用嗎？」這讓你比較少踩大雷，建立的東西也經得起時間考驗。"}],"best_scenes":"一團亂、需要有人拍板的時候最適合你：接手一個延宕的專案、把小店的流程從頭整理一遍、帶一群新人上軌道，或任何大家在問「現在到底誰負責」的時刻。","value":"你帶給團隊的是方向感：大家知道目標是什麼、標準在哪裡、出事有人扛。你不是靠聲音大讓人跟，而是靠說到做到；有你在，一群人從各做各的，變成交得出成果的團隊。","weaknesses":[{"title":"話一出口就是結論","text":"你太快看見該怎麼排，一開口就是結論，別人還沒說完想法，就覺得自己的意見被跳過了。"},{"title":"什麼都想自己扛","text":"你習慣把結果扛在身上，就覺得自己做最保險，結果事情越攬越多，團隊也少了練習的機會。"},{"title":"把流程看得比人重","text":"你太相信流程，可能忽略了執行的人當下的狀況，或錯過一個不照規矩來、其實更好的點子。"},{"title":"計畫被打亂會很焦躁","text":"你把路都想好了，所以臨時有變卦時，你會比別人更不舒服，需要即興應變的場合容易讓你繃緊。"}],"risks":[{"title":"身邊只剩附和聲","text":"當你的意見越來越有分量，大家可能不敢提出不同看法，只說你想聽的話。少了真實的回饋，你可能在不知不覺中做出錯的判斷。"},{"title":"被變化甩在後面","text":"你建立的做法曾經很成功，但環境一直在變。如果常說「以前這樣做都沒問題」，你可能錯過新的機會，讓穩固的東西慢慢失去競爭力。"},{"title":"被當成冷硬的人","text":"你忙著把事情做好，常常省略了噓寒問暖。久了大家敬重你，卻不太敢靠近你，有心事或壞消息也不會先來找你。"}],"growth":["挑一件你原本會自己做的事，完整交給一個人，約好只在週五看結果，中間不追問。","開會時先請別人發言，你最後才說，讓不同的聲音真正有機會被聽見。","每年找一天把自己的規則和流程翻出來，逐條問「這在今天還需要嗎」。"],"evolution":{"from":"事事親力親為的管理者","to":"能讓團隊自轉的領袖","text":"成熟的統治者不是什麼都管，而是定好方向和標準後，放心讓別人發揮。你不是失去掌控，而是把掌控變成一套別人也會用的方法，影響的範圍會遠遠超過你一個人。"},"relationship":{"shine":"你照顧人的方式，常常藏在事先安排好的一切裡。家人出遊，你早就訂好車、查好哪裡好停車；朋友遇到大事拿不定主意，會想先聽你的看法，因為你冷靜、建議很實際。你不太說好聽話，但守時守信，跟你相處的人知道，有事找你就對了。","shadows":[{"title":"習慣替別人做決定","text":"你很快看出怎麼做最好，可能直接幫對方安排好，讓人覺得自己的意見不重要。"},{"title":"很少說自己累","text":"你習慣當撐住大家的人，很少說自己累或怕，身邊的人也就不知道怎麼支持你。"},{"title":"把相處當專案管","text":"朋友只是想抱怨一下，你已經開始列解決步驟，忘了對方要的是陪伴，而不是被解決。"}],"practice":[{"title":"先問對方想要什麼","text":"給建議之前，先問一句「你想聽我的意見，還是只想說說」，對方會舒服很多。"},{"title":"說一次「我也很累」","text":"偶爾跟信任的人說「我最近壓力很大」，讓別人也有機會照顧你一次。"},{"title":"留一個不排行程的週末","text":"和重要的人相處時，試著不排行程、不談正事，走到哪算到哪，讓對方看見放鬆的你。"}]},"energy":{"charge":["把一個複雜的專案漂亮收尾","週日晚上把下週的計畫排好","和有能力的人一起討論大方向","被重要的人真心信任、託付一件大事"],"drain":["一團亂又沒有人負責的場面","權責不清，事情一直被推來推去","被迫照著自己不認同的決定做","同樣的錯講了三次還是沒改","計畫一再被臨時打亂"],"message":"你不需要一個人撐起所有事。你已經證明了自己可靠，現在可以試著相信身邊的人，也相信你自己建好的制度。放手不是失去掌控，而是讓你有餘力看得更遠。今天早點下班，世界不會因此崩塌。"},"ip":{"positioning":"值得信賴的業界權威／帶人上軌道的經營顧問","core":"你的內容核心是「把事情做對、做穩的方法」。適合做完整指南、標準流程拆解、評比整理、管理和經營心得。可以賣系統化課程、顧問服務、企業內訓、範本和工具包、高價會員社群。觀眾找你，是因為想得到一套經過驗證、照著做就不會亂的方法。","shadows":[{"title":"太嚴肅有距離","text":"內容很專業，但語氣太像上對下講課，觀眾覺得有壓力，不容易產生親近感。"},{"title":"不肯露出不完美","text":"你只想展示成功和權威，觀眾看不到真實的你，很難和你建立情感連結。"},{"title":"內容太完整太長","text":"你想把每個細節都講清楚，結果影片太長，觀眾還沒看到重點就滑走了。"}],"practice":[{"title":"權威裡加入真實故事","text":"分享你曾經做錯的決定和學到的教訓，讓專業背後多一點人味，觀眾會更信任你，也更願意跟著你。"},{"title":"先給重點再展開","text":"短影音只講一個關鍵觀念，結論放在開頭，完整的方法留給長影片、課程或電子報，形成清楚的內容層次。"}]},"career":{"shine":"你最有成就感的時候，是看著自己建好的東西穩穩運作。所以主管、專案經理、營運、品質管理、管理顧問、創業經營都很適合你。你擅長把一家小店做成有制度的公司，靠可複製的流程擴大。賺錢上，你適合高單價的顧問服務、企業合作，或需要長期經營的事業。","shadows":[{"title":"成長卡在自己身上","text":"事業變大後，如果每張報價單都要你親自看過，公司的成長就會被你一個人的時間卡住。"},{"title":"好人才留不久","text":"標準高又很少稱讚，有能力的夥伴可能覺得被管太多、沒有發揮空間而離開。"}],"practice":[{"title":"列一張授權清單","text":"寫下哪些決定團隊可以自己做、哪些才需要你，把你的時間留給最重要的事。"},{"title":"每週具體稱讚一次","text":"看到夥伴做得好，具體說出好在哪裡，讓大家知道你的標準也看得見努力。"},{"title":"留一筆試錯的預算","text":"每季撥一點錢和時間給新想法，就算失敗也沒關係，讓事業保持彈性。"}]},"partners":["創造者","弄臣"],"items":["一群人討論半天沒結論時，我通常會出來收斂、做決定。","接手一件事，我習慣先把流程和分工排清楚。","我喜歡規則和分工都很清楚的環境。","事情脫離我的掌握時，我會比一般人更不安。","把工作交給別人後，我常忍不住一直確認進度。","我覺得要讓事情長久，靠的是規矩，不是熱情。"],"as_second":"事情一亂，你就會忍不住出來排好順序、分好工。它讓你在混亂裡靠得住，也讓你不太放心把事情交給別人。"}}/*END*/;

// ---------- 計分 ----------
function scoreBigFive(ans) {
  const raw = { O: 0, C: 0, E: 0, A: 0, N: 0 }, k = IPIP_USED.length / 5;
  IPIP_USED.forEach(q => { const v = ans[q.n]; raw[q.trait] += q.rev ? 6 - v : v; });
  const s = {}; for (const t in raw) s[t] = (raw[t] - k) / (k * 4) * 100;
  s.S = 100 - s.N; return s;
}
// 原型分數：每型 4 題，從不 1 分～總是 5 分，加總 4–20 分。
function scoreArchetypes(ans) {
  const raw = Object.fromEntries(ARCH_ORDER.map(a => [a, 0]));
  ITEMS.forEach(q => { raw[q.arch] += ans[q.id] || 0; });
  const total = Object.values(raw).reduce((x, y) => x + y, 0) || 1;
  const pct = Object.fromEntries(ARCH_ORDER.map(a => [a, raw[a] / total * 100]));
  // 同分時先比選「總是」的題數，再比選「經常」以上的題數。
  const count = (a, min) => ITEMS.filter(q => q.arch === a && (ans[q.id] || 0) >= min).length;
  const ranked = [...ARCH_ORDER].sort((x, y) => raw[y] - raw[x] || count(y, 5) - count(x, 5) || count(y, 4) - count(x, 4));
  return { raw, pct, ranked };
}

    let stars = chart.palace("命宮").majorStars.map(s => s.name);
    out.borrowed = stars.length === 0;
    if (out.borrowed) stars = chart.palace("遷移").majorStars.map(s => s.name);
    out.stars = stars;
    const { lunarMonth, lunarDay } = chart.rawDates.lunarDate;
    const yb = BR.indexOf(chart.rawDates.chineseDate.yearly[1]) + 1;
    const hb = (timeIndex === 12 ? 0 : timeIndex) + 1;
    const up = TRI[md(yb + lunarMonth + lunarDay, 8)], lo = TRI[md(yb + lunarMonth + lunarDay + hb, 8)];
    out.hex = HEX[up + lo];
  } catch (e) { console.warn("紫微／易經計算失敗", e); }
  return out;
}

function cultureLine(kind, name, top3, extra = "") {

  const hit = entry.arch.find(a => top3.includes(a));
  if (hit) return `${label}，傳統說法形容${entry.kw}，跟你的${hit}型很像。`;
  return {

  }[kind];

function buildSteps() {

// ---------- 匿名統計：只在公開網站上、有勾同意、不是隨機作答時，送出一筆 ----------
// 不送姓氏、生日、時辰；只送作答、算出來的分數和文化層結果。
const CAN_SAVE = location.protocol === "https:" && !location.hostname.includes("claude");
const SUPABASE_URL = "https://wgizjbhynofqcldsjswr.supabase.co";
const SUPABASE_KEY = "sb_publishable_J03tKmAmn0XNJPPitp_U9Q_Fj-NS-lI";
function ageBand(birth) {
  const y = +String(birth).slice(0, 4); if (!y) return "";
  const age = new Date().getFullYear() - y;
  return age < 20 ? "<20" : age >= 60 ? "60+" : `${Math.floor(age / 10) * 10}-${Math.floor(age / 10) * 10 + 9}`;
}
async function saveResult({ b5, raw, top3, c, attnOk, highShare }) {
  const note = document.getElementById("saveNote");
  if (!CAN_SAVE || S.saved || S.demo) return;
  if (!S.profile.consent) { if (note) note.textContent = "這次沒有存進統計（沒有勾選同意）。"; return; }
  S.saved = true;
  const payload = {
    v: VERSION, top3, raw,
    arch: Object.fromEntries(ITEMS.map(q => [q.id, S.arch[q.id] || 0])),
    b5: Object.fromEntries(IPIP_USED.map(q => [q.n, S.b5[q.n] || 0])),
    b5s: Object.fromEntries(Object.entries(b5).map(([k, v]) => [k, Math.round(v)])),
    attnOk, highShare: Math.round(highShare * 100) / 100,
    age: ageBand(S.profile.birth), title: S.profile.title || "",
    sign: c?.sign || "", life: c?.life || null, star: c?.stars?.[0] || "", hex: c?.hex || "",
  };
  try {
    // Supabase quiz_results：公開金鑰只能新增，不能讀（見 RLS 設定）
    const r = await fetch(`${SUPABASE_URL}/rest/v1/quiz_results`, {
      method: "POST",
      headers: { "content-type": "application/json", apikey: SUPABASE_KEY, Prefer: "return=minimal" },
      body: JSON.stringify({ version: VERSION, top1: top3[0], attn_ok: attnOk, high_share: payload.highShare, payload }),
    });
    if (!r.ok) throw new Error(r.status);
    if (note) note.textContent = "已匿名存進統計，謝謝你幫忙。";
  } catch (e) {
    S.saved = false;
    if (note) note.textContent = "這次沒能存進統計，結果不受影響。";
  }
}

const start = () => render();
window.claude?.hot?.ready ? window.claude.hot.ready(start) : start();
