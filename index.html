const COMBO = /*COMBO*/{"天真者":{"凡人":{"name":"講話實在的鄰家好人","portrait":"天真者那一面相信事情可以很簡單，凡人那一面讓你相信的方式很接地氣。你不講大道理，只會在同事抱怨老闆時說「也許他只是還沒想到，我們明天直接問好了」，然後隔天真的去問。你不是不懂辦公室的眉角，而是覺得繞來繞去比直接問還累。兩邊打架時，你會怕顯得天真，跟著大家一起嘆氣；所以你可以把「我去問」變成固定動作，讓你的單純變成大家的捷徑。","jobs":["新手教學頻道主","社區早餐店老闆","志工團隊協調人"],"jobs_why":"這三個位置天天面對一般人，最需要說話不繞、讓人放心的人。你相信人，也懂大家的生活，客人和夥伴很快就會把你當自己人。","ip":"做「直接問就好了」系列：把大家不敢問的問題，真的拿去問店家、客服或專業的人，把回答原原本本拍下來。標題範例：「我直接打去問客服，原來退費這麼簡單」。","next":"這個月挑一個團隊裡大家私下猜來猜去的問題，直接去問負責的人，把答案整理成三句話分享給大家。"},"探險家":{"name":"帶著好心情出發的人","portrait":"天真者相信事情會順，探險家想往沒去過的地方走，兩個加起來，你是那種行程出包還笑得出來的人。高鐵誤點，你已經在查車站附近有什麼小吃；民宿跟照片差很多，你說「至少窗外看得到山」。你不是神經大條，而是相信每段意外都會變成好故事。兩邊打架時，你會出發得太快、忘了看細節；所以你可以替自己準備一張五項的出發前清單，勾完就放心走。","jobs":["親子旅遊企劃","戶外營隊領隊","在地小旅行規劃師"],"jobs_why":"這些工作常遇到計畫外的狀況，需要一個不慌、又願意帶大家試新東西的人。你樂觀，團員就安心；你好奇，行程就有驚喜。","ip":"做「出包也很好玩」旅行紀錄：把每趟的意外和臨時改的行程完整拍出來，最後整理成一份給別人的備案清單。標題範例：「颱風天去花蓮，我們的備案反而比原計畫好玩」。","next":"這個月安排一次半天的在地小旅行，只訂目的地不排行程，回來寫一份「下次可以這樣玩」的清單，分享給三個朋友。"},"智者":{"name":"相信但會先查清楚的人","portrait":"天真者那一面想先相信，智者那一面又想弄清楚真相，所以你是很少見的組合：願意相信，但不盲信。朋友推薦你一款保養品，你不潑冷水，只笑著說「好啊，我先查一下成分再買」。你不是在懷疑朋友，而是想讓自己的相信有個站得住的理由。兩邊打架時，你會為了查清楚拖很久才決定；所以你可以先訂好「查到三個可靠來源就決定」，查完就放手相信。","jobs":["兒童科普作家","事實查核編輯","食品安全宣導講師"],"jobs_why":"這些工作要把正確的知識，用不嚇人的方式交給大家。你查得仔細，說出來的語氣又溫和，讀的人不會覺得被教訓。","ip":"做「好消息查證」：專門查那些讓人心動的說法，查完告訴大家哪一部分是真的、可以放心照做。標題範例：「網路說這招能省一半電費，我查完：有一半是真的」。","next":"這個月挑三則你很想相信的說法，各花半小時查原始來源，寫成一則「可以信的部分」貼文分享出去。"},"英雄":{"name":"相信做得到就真的去做","portrait":"天真者那一面相信好事會發生，英雄那一面不只相信，還會捲起袖子去做。朋友說「這個比賽我們應該沒機會吧」，你回「先報名再說」，然後真的每天下班練一小時。你不是盲目樂觀，而是用行動替自己的相信找證據。兩邊打架時，你會把所有事都扛在自己身上，覺得只要夠努力就能解決；所以你可以每週問自己一次：這週哪一件可以請別人幫忙？","jobs":["兒童運動教練","公益路跑企劃","青少年營隊輔導員"],"jobs_why":"這些工作需要一個讓人相信「我也可以」的大人。你自己願意拚，又真心相信每個人都會進步，孩子和學員會跟著你一起堅持。","ip":"做「從零開始挑戰」：選一件你完全不會的事，公開從第一天練到做到，連失敗的那幾天也照實拍。標題範例：「完全不會游泳的我，給自己 60 天游完 500 公尺」。","next":"這個月報名一個兩到三個月後舉辦的小比賽或檢定，把練習計畫寫下來，每週日在社群回報一次進度。"},"叛逆者":{"name":"說出國王沒穿衣服的人","portrait":"天真者說話不繞，叛逆者看不慣虛偽，兩個加起來，你常是那個不小心說出真相的人。大家都在稱讚新包裝很高級，你直接問「可是打不開耶，客人要拿剪刀嗎？」，全場愣住，然後才有人說「對欸」。你不是故意唱反調，而是真的沒看到大家在顧慮什麼。兩邊打架時，你會在不對的場合說得太直；所以你可以先私下跟一個人講，再決定要不要在會議上提。","jobs":["社會企業企劃","友善小農品牌主理人","產品使用體驗評測"],"jobs_why":"這些工作需要有人相信更好的做法存在，也敢指出現在哪裡不對。你的直接帶著善意，聽的人比較不會覺得被攻擊。","ip":"做「天真提問」：挑一個產業的慣例，用最單純的角度問「為什麼一定要這樣」，再實際試試另一種做法。標題範例：「為什麼果汁一定要加糖？我自己榨了一週來比較」。","next":"這個月挑一個你一直覺得怪怪的工作慣例，寫下「如果改成這樣會怎樣」，找一位同事一起試做一週。"},"魔法師":{"name":"相信新工具能讓日子變好","portrait":"天真者相信事情可以變簡單，魔法師相信改變做得到，兩個加起來，你看到新工具就眼睛發亮，而且真心覺得「我媽也能用」。你會花一整個週末下午，替爸媽的手機設好語音助理，教他們說一句話就能打電話給你。你不是天真到忽略難度，而是相信難度可以被設計掉。兩邊打架時，你會以為大家都跟你一樣有興趣；所以你可以先問對方最煩的一件事，只解決那一件。","jobs":["兒童程式教育講師","繪本動畫企劃","新手友善 App 企劃"],"jobs_why":"這些工作要把新技術做得讓人不怕。你有想改變的點子，又真心站在完全不懂的人那邊想，做出來的東西特別友善。","ip":"做「給爸媽的新工具」：每集挑一個新工具，示範怎麼把它設定成長輩一句話就能用的樣子。標題範例：「我幫爸媽設了這個，他們再也不用打給我問了」。","next":"這個月挑一位家人或長輩，找出他最常卡住的一個手機操作，替他設好更簡單的做法，兩週後問他用了幾次。"},"照顧者":{"name":"讓人放心說出委屈的人","portrait":"天真者先相信別人，照顧者想把人接住，兩個加起來，你是大家受委屈時第一個想到的人。你不會急著分析誰對誰錯，只會說「先吃點東西，明天再想」，然後真的遞上一個便當。你不是不會判斷，而是覺得人先被接住，才有力氣想清楚。兩邊打架時，你會一直借出時間和錢，相信對方會還；所以你可以先決定一個「借出去也不心疼」的上限，超過就說下次。","jobs":["幼教老師","寵物保母","售後關懷客服"],"jobs_why":"這些工作面對的都是需要被溫柔對待的對象。你不設防，又真心想照顧好對方，孩子、毛孩和客人都感覺得到。","ip":"做「暖暖的日常」紀錄：拍你照顧孩子、毛孩或客人的真實小片段，每支配上一句你從中學到的事。標題範例：「我照顧過 30 隻狗，牠們教我的 3 件事」。","next":"這個月寫下三個常找你訴苦的人，替每個人做一件不花錢的小事，例如寫一張卡片，同時排一段只屬於你的休息時間。"},"創造者":{"name":"把美好畫給大家看的人","portrait":"天真者相信世界有好的一面，創造者想把腦中的畫面做出來，所以你的作品常帶著一種讓人鬆口氣的溫柔。別人畫城市會畫塞車和灰色天空，你畫的是騎樓下的貓和早餐店阿姨的笑臉。你不是看不見現實的壞，而是想用作品提醒大家還有好的。兩邊打架時，你會怕作品被說太甜就不敢發；所以你可以先給三個信任的人看，聽他們最喜歡哪一張。","jobs":["繪本作家","療癒系插畫家","手作課老師"],"jobs_why":"這些工作賣的是讓人心情變好的作品和時光。你相信美好，又做得出來，大家在你的作品或課堂裡會慢慢放鬆下來。","ip":"做「每天一個好事」：每天畫或做一個今天看到的小美好，連續發一個月，邀觀眾也分享自己的。標題範例：「我連續 30 天只畫好事，第 30 天的我變了」。","next":"這個月每週完成一件小作品，主題都是當週遇到的一件好事，月底把四件放在一起，發成一則貼文。"},"統治者":{"name":"把對的事做成規矩的人","portrait":"天真者在意對不對，統治者在意有沒有秩序，兩個加起來，你會把「做對的事」寫成大家都能照做的規則。接手家裡的小店，你第一件事不是漲價，而是把每樣食材的進貨來源寫在牆上給客人看。你不是愛管，而是相信清清楚楚的規矩能保護好人。兩邊打架時，你會把規則訂得太理想、沒留彈性；所以你可以讓每條規則先試行一個月，再跟大家一起修。","jobs":["品保專員","非營利組織主任","老店接班經營者"],"jobs_why":"這些位置要有人守住原則，也要把原則變成每天的流程。你有誠實的底線，又排得出順序，大家照你的規矩做事會覺得安心。","ip":"做「透明經營日記」：公開你的小店或團隊怎麼訂價、怎麼選材料、怎麼處理客訴，能給的真實數字就給。標題範例：「一杯 60 元的豆漿，我把成本全部攤開給你看」。","next":"這個月把你負責的一件事寫成一頁做法，標出「這裡不能偷懶」的兩個步驟，交給一位同事試做並請他給回饋。"},"弄臣":{"name":"笑起來讓人卸下心防的人","portrait":"天真者真誠，弄臣愛玩，兩個加起來，你的幽默乾淨得像小孩。你不太講酸別人的笑話，最好笑的是你對世界的單純反應：第一次喝到很苦的黑咖啡，你的表情讓整桌笑了五分鐘。你不是在裝可愛，而是本來就這麼直接地感受每件事。兩邊打架時，你會被說「都不認真」；所以你可以在玩完之後，分享一句你真的學到的事，大家就看得見你的認真。","jobs":["兒童劇演員","親子節目主持","療癒系短影音創作者"],"jobs_why":"這些工作需要讓人卸下防備的笑。你的好笑不傷人、反應又真，大人小孩都喜歡，看完心情會變好。","ip":"做「第一次體驗」反應影片：每集試一件你從來沒做過的事，把最真實的反應拍下來，最後給一句真心評價。標題範例：「第一次吃榴槤，我的表情比味道還精彩」。","next":"這個月拍三支你第一次嘗試某件事的短片，每支不超過一分鐘，發出去後看哪一支最多人留言分享自己的第一次。"},"戀人":{"name":"把真心收成儀式的人","portrait":"天真者相信真心會有好結果，戀人想讓在乎的人覺得被珍惜，所以你的浪漫一點都不做作。朋友升職，你送的不是名牌，而是一張寫滿他這三年努力的手寫卡，他讀到一半就紅了眼眶。你不是愛搞驚喜，而是真心覺得重要的時刻值得被好好記住。兩邊打架時，你會付出很多卻不說自己也想被在乎；所以你可以直接說「這次換你陪我」，對方通常很樂意。","jobs":["婚禮顧問","花藝課老師","手寫信件代筆服務"],"jobs_why":"這些工作幫人把重要的心意好好送出去。你真誠又有美感，客人相信你，也會被你做出來的東西打動。","ip":"做「替人說出口」系列：幫觀眾把一直沒說出口的心意，做成一張卡片、一束花或一段影片，拍下送出的那一刻。標題範例：「他想謝謝媽媽卻說不出口，我們一起寫了這封信」。","next":"這個月挑三個你很感謝的人，各寫一張手寫卡寄出去，記下哪一句讓對方最有感，下次就從那種句子開始寫。"}},"凡人":{"天真者":{"name":"替大家先試的安心朋友","portrait":"你想跟大家站在同一邊，天真者那一面又讓你相信事情沒那麼糟。茶水間大家一起抱怨新系統，你跟著點頭，回座位卻默默把它點過一遍，下午在群組傳一句「其實三步就好，我截圖給你們」。你不是愛唱反調的樂觀派，而是想陪大家從「好可怕」走到「好像還行」。兩邊打架時，你常先附和再補一句好消息；所以你可以試著把那句好消息放在前面講。","jobs":["樂齡數位課程講師","客服知識庫編輯","社區媒體小編"],"jobs_why":"這三個位置都要面對很怕出錯的人。你講話像鄰居，又真心相信對方學得會，對方才敢把笨問題問出口，問完也不覺得丟臉。","ip":"做「陪新手第一次」系列：每集挑一件大家覺得很難的小事，你從零開始做一次，最後說出做完的真實感覺。標題範例：「我媽說她學不會，結果我們只花了 8 分鐘」。","next":"這個月挑一件同事最常問你的事，做成一張三步驟圖卡，月底前傳到群組，記下有幾個人回「原來這麼簡單」。"},"探險家":{"name":"替一般人先去踩點的人","portrait":"你想跟大家一樣，探險家那一面卻一直想往外跑，結果你成了「先去看看再回來報告」的人。新開的平價吃到飽，你第一週就去了，回來不是說多驚艷，而是說「停車很難找，平日中午去比較划算」。你不是愛炫耀去過哪裡，而是想把路上的雷收好，讓朋友少花冤枉錢。兩邊打架時，你會怕太跳而少去幾個地方；所以你可以把每趟都當成替大家出差。","jobs":["小資旅遊內容創作者","新品試用評測","在地導覽員"],"jobs_why":"這些工作要有人肯先出發，也要有人回來用一般人聽得懂的話，說清楚到底值不值得。你兩樣都有：腳夠快，話夠白。","ip":"做「一般人預算的實測」：每集設一個花費上限，例如五百元，去試一個新地方或新服務，最後打出真實分數。標題範例：「500 元在台北能玩一整天嗎？我替你試了」。","next":"這個月挑兩個朋友最近在問的新地方或新服務，親自去一次，各寫一篇三百字心得，附上花了多少錢和多少時間。"},"智者":{"name":"把研究翻成人話的鄰居","portrait":"你想把一件事搞懂，但搞懂之後最想做的，是讓隔壁的人也懂。親戚在群組轉傳「這個存股方法保證穩賺」，你不會直接說他錯，而是私訊一句「我查了一下，原文其實是在講……，我們下次一起問問看」。你不是愛糾正人的資料控，而是不想讓身邊的人因為看不懂而吃虧。兩邊打架時，你會為了不讓人難堪，把結論說得太軟；所以你可以先講結論，再溫柔地補理由。","jobs":["消費者權益記者","使用者研究員","財經懶人包編輯"],"jobs_why":"這些工作都要先把資料查到底，再翻成一般人一看就懂的版本。你查得夠細，又記得讀的人是誰，寫出來的東西不會只有專家看得懂。","ip":"做「我替你查過了」：每集挑一個大家都在傳的說法，用三分鐘講原始出處和你的結論，最後給一句能直接照做的建議。標題範例：「大家都在傳的省電妙招，我查完發現只對一半」。","next":"這個月挑一則家人或同事轉傳過的說法，花一個晚上查清楚，整理成五句話以內的說明，私下傳給轉傳的人。"},"英雄":{"name":"普通人也做得到的證明","portrait":"英雄那一面想挑戰，凡人那一面卻不想變成高高在上的強者。所以你挑的目標，常常是一般人也跟得上的：不是全馬破三，而是「下班後每天走一萬步，連走一百天」。你不是在挑簡單的做，而是想讓旁邊的人覺得「他可以，我應該也行」。辦公室說好一起減醣，撐到月底的通常是你，還順手做了一張大家都能打勾的表。所以你可以大方講出自己的數字，那正是別人想跟的理由。","jobs":["素人健身陪跑教練","業務團隊小組長","公司運動社團召集人"],"jobs_why":"這些位置要有人帶頭衝，又不能讓後面的人覺得追不上。你自己撐得住，也記得把門檻放低，讓大家願意跟著你一起跑。","ip":"做「一般人挑戰日記」：公開一個 30 天的小目標，每天用一分鐘回報進度，連偷懶的那天也照實講。標題範例：「上班族每天只練 10 分鐘，第 30 天我變了多少」。","next":"這個月訂一個 30 天能完成的小目標，找兩個同事一起參加，每天在群組打卡，月底公布三個人的結果。"},"叛逆者":{"name":"替大家問出那句為什麼","portrait":"你本來不愛出頭，但叛逆者那一面看到不合理就忍不住。你的反抗很少是拍桌，而是用一般人的語氣問到點上：公司說加班費要先填三張單，你在會議上問「所以大家是不是乾脆不要報？」，全場安靜三秒，下個月表單就少了兩張。你不是想當刺頭，而是替那些不敢問的人開口。兩邊打架時，你會先忍很久；所以你可以早一點用「大家都在問」的方式提出來。","jobs":["消費評論創作者","產品客訴改善專員","員工意見調查企劃"],"jobs_why":"這些工作要有人敢指出哪裡不對，也要講得讓一般人覺得「對，就是這個」。你的直接不刺耳，因為你站的位置跟大家一樣。","ip":"做「消費者的老實話」：每集挑一個讓人不舒服的設計或收費方式，用自己的親身經驗講清楚，再給一個替代做法。標題範例：「取消訂閱為什麼要按七次？我一步一步錄給你看」。","next":"這個月記下三個你覺得不合理的小流程，挑一個寫成一頁建議，附上替代做法，交給真的能改它的人。"},"魔法師":{"name":"把新工具變家常菜的人","portrait":"魔法師那一面一看到新工具就想改造流程，凡人那一面卻一直問：「這個辦公室的大姐會用嗎？」於是你做的改變都長得很樸素：不是一套很炫的系統，而是一個讓會計少按二十次滑鼠的小捷徑。你不是不夠有野心，而是知道沒人用的好點子等於沒有。兩邊打架時，你會把點子藏著，怕太新嚇到人；所以你可以先挑一個人陪他試，成功了再推給大家。","jobs":["中小店家數位導入顧問","辦公室 AI 工具講師","行政流程改善專員"],"jobs_why":"這些工作要的不是最厲害的技術，而是讓不熟電腦的人也願意用。你想得出新做法，又會把它縮到一般人一學就上手的大小。","ip":"做「辦公室偷懶小魔術」：每集只示範一個新工具的最小用法，解決一件上班族天天遇到的麻煩，全程用真實檔案操作。標題範例：「同事以為我加班整理報表，其實我只按了一個鍵」。","next":"這個月找一件部門每週重複做的雜事，用新工具做出更快的做法，教會一位同事，記下前後各花幾分鐘。"},"照顧者":{"name":"大家有事都先找的那位","portrait":"照顧者那一面看到有人卡住就想伸手，凡人那一面讓你伸手的樣子一點都不像在幫忙。新人不敢問問題，你不會走過去說「我教你」，而是說「這個我以前也搞錯過，我們一起看」。你不是在扮演前輩，而是想讓對方覺得自己沒有比較差。兩邊打架時，你會一直接下請託又不好意思說累；所以你可以把常被問的事寫成共用筆記，讓幫忙不用每次都靠你。","jobs":["客戶成功經理","新進人員輔導員","會員社群經營"],"jobs_why":"這些位置每天都在接住卡關的人。你會主動發現誰需要幫忙，又能讓對方覺得是朋友順手拉一把，不是被上對下地指導。","ip":"做「我也搞錯過」：每集講一個你或身邊的人真的犯過的新手錯誤，再一步一步示範正確做法。標題範例：「第一次報帳就被退件三次，這三個坑你不用再踩」。","next":"這個月把同事最常問你的五個問題整理成一份共用文件，月底前分享出去，看下個月被問的次數有沒有變少。"},"創造者":{"name":"把日常小事畫成作品的人","portrait":"創造者那一面想做出自己的東西，凡人那一面讓你挑的題材總是最家常的：捷運上低頭滑手機的人、早餐店的蘿蔔糕、下班前最後五分鐘的辦公室。你畫出來、拍出來，大家第一個反應是「這根本就是我」。你不是沒有想像力，而是你的想像力都長在日常裡。兩邊打架時，你會怕作品太有個性、大家看不懂；所以你可以留一個只有你會放的小細節，當作你的簽名。","jobs":["生活插畫家","日常系貼圖創作者","手作市集攤主"],"jobs_why":"這些工作賣的是「看了會心一笑」的共鳴。你有做出作品的手，又有抓得到大家共同日常的眼睛，作品自然有人想買、想轉傳。","ip":"做「上班族日常圖鑑」：固定畫或拍一個大家都經歷過的小場景，一週一則，再請觀眾留言說自己的版本。標題範例：「每個辦公室都有這 5 種同事，你是哪一種」。","next":"這個月做四件以日常為題材的小作品，每週發一件，記下哪一件被分享最多，下個月照那個方向再做三件。"},"統治者":{"name":"讓大家都跟得上的帶頭人","portrait":"統治者那一面想把事情排好、扛起責任，凡人那一面不想因此變得高高在上。所以你帶團隊的方式很特別：排班表會先問大家哪天不方便，開完會把結論寫成三行貼在群組，讓沒來的人也看得懂。你不是不敢做決定，而是希望每個決定都讓大家覺得有被算進去。兩邊打架時，你會為了不得罪人拖慢拍板；所以你可以先聽完、訂一個期限，時間到就照你的判斷走。","jobs":["門市店長","社區管委會總幹事","行政總務主管"],"jobs_why":"這些位置要有人訂規則，也要讓每天照規則做事的人服氣。你排得出順序，又懂第一線的難處，大家比較願意照你的安排走。","ip":"做「小團隊管理實話」：用一般員工聽得懂的話，分享你排班、分工、處理衝突的真實做法，不講大道理。標題範例：「我當店長第一年，最後悔的一個決定」。","next":"這個月挑一個團隊常卡住的流程，寫成一頁「誰做什麼、幾點前交」的清單，試用兩週後問三位同事哪裡還要改。"},"弄臣":{"name":"用自嘲讓大家放鬆的人","portrait":"弄臣那一面想讓大家笑，凡人那一面讓你的笑點都從自己身上挖。你很少笑別人，最常拿來開玩笑的，是自己月底只剩泡麵、開會時把老闆的名字叫錯。大家笑完，會覺得你跟他們是同一國的。你不是在貶低自己，而是知道拿自己開刀最不會傷到人。兩邊打架時，你會用玩笑把真心話帶過；所以你可以在笑完之後，多補一句「不過我是真的這樣想」。","jobs":["上班族梗圖小編","尾牙春酒主持人","Podcast 節目主持"],"jobs_why":"這些工作要讓一大群不同的人一起笑，又不能讓任何人覺得被冒犯。你的幽默從共同經驗出發，安全又好笑，大家都接得住。","ip":"做「上班族自嘲短劇」：每集演一個大家都遇過的小崩潰，最後一秒給一個真的有用的小撇步，讓人笑完還帶得走東西。標題範例：「週一早上的我 vs. 週五下午的我」。","next":"這個月把你在群組裡最常被笑的三件生活糗事，各拍成一支三十秒短片發出去，看哪一支最多人留言「我也是」。"},"戀人":{"name":"讓平凡日子有溫度的人","portrait":"戀人那一面在意感覺和質感，凡人那一面讓你堅持「好東西不一定要貴」。朋友搬進小套房，你帶著一串三百元的燈串和兩個小盆栽過去，半小時後房間像換了一間。你不是不懂精品，而是想讓每個人都過得起有感覺的生活。兩邊打架時，你會怕品味被說做作，乾脆不講；所以你可以把它說成「我試過，這樣比較舒服」，大家反而會想學。","jobs":["平價居家布置顧問","生活選物小店主","熟客關係經營"],"jobs_why":"這些工作賣的是「我也做得到的美」。你有眼光，又知道一般人的預算和生活，推薦的東西大家買得起、用得到，也願意回來再問你。","ip":"做「小預算質感改造」：每集改造一個空間或生活場景，限制預算，拍出前後對比和每樣東西的價格。標題範例：「1000 元讓租屋處變得想回家，我買了這 6 樣」。","next":"這個月挑自己家裡一個角落，用一千元以內改造，拍前後照片和購物清單發成一則貼文，看有幾個人來問連結。"}},"英雄":{"凡人":{"name":"證明普通人也做得到的人","portrait":"你想證明努力能改變結果，凡人那一面讓你想證明的是「普通人也做得到」。你不是天生條件好的人，而是故意用最普通的條件去挑戰。沒有健身房、沒請教練，你下班後在租屋處用一張瑜伽墊、兩瓶礦泉水練了三個月，拍給同事看。想贏、又不想跟大家拉開距離時，你會把成績講成「我做到了，你也可以」。","jobs":["團體課健身教練","業務團隊組長","社區跑團團長"],"jobs_why":"這三個位置都要帶一群普通人一起變強。你自己拚得下去，又不擺架子，大家會覺得跟著你練不是遙不可及。","ip":"做「普通人挑戰紀錄」：故意用大家都有的條件去做，公開每週的進度和偷懶的日子。觀眾會覺得自己也能跟。標題範例：「沒有健身房，下班後在租屋處練 90 天」。","next":"這個月公開一個小目標，例如每天走 8000 步，每週在社群貼一次進度，並邀 2 個朋友一起。"},"創造者":{"name":"硬是把作品做完的人","portrait":"你想證明努力有用，創造者那一面讓你把力氣花在完成一件作品上。你不是等靈感來才動手，而是靠每天一點點硬做出來。你決定一年畫滿 365 張圖，感冒發燒那天也躺在床上用手機畫一隻火柴人，打卡從沒斷過。想改到完美、又想準時交出去時，你會選擇準時交，把想改的地方留給下一張。","jobs":["動畫製作師","工業設計師","甜點主廚"],"jobs_why":"這三份工作都要長時間重複練同一個手藝，又要做出有自己樣子的東西。你的毅力讓作品做得完，美感讓它被記住。","ip":"做「長期創作挑戰」：每天公開一件小作品，定期把第一天和最近一天並排比較，讓觀眾看見累積的力量。標題範例：「每天做一張海報，第 100 天我變成這樣」。","next":"這個月開一個 30 天創作挑戰，每天做一件小作品，第 30 天把第一件和最後一件放在一起貼出來。"},"叛逆者":{"name":"專挑不合理規則開戰的人","portrait":"你想證明努力有用，叛逆者那一面讓你想挑戰的不是對手，而是不合理的規則。你並不是為了贏而反抗，你是想證明「這件事可以不用這樣」。公司說新人至少三年才能帶專案，你主動提議用一個小案子試做，交出成績後，主管讓規定破了例。想正面硬衝、又想直接翻桌時，你可以先拿出成果，再提改規則。","jobs":["新創創辦人","公益律師","新事業開發經理"],"jobs_why":"這些工作都要在「大家都說不可能」的地方硬做出成績。你敢質疑規則，也撐得住過程，成果出來就是最好的反駁。","ip":"做「大家說不行，我偏要試」的挑戰內容：先講出那條潛規則，再公開你怎麼試、結果如何，失敗也照講。標題範例：「大家都說新手不能接這種案子，我接了」。","next":"這個月挑一條你覺得不合理的潛規則，設計一個一週內做得完的小實驗去試試看，記錄結果。"},"天真者":{"name":"笑著把苦練完的人","portrait":"你想證明努力有用，天真者那一面讓你打從心底相信事情會變好。你不是咬著牙在拚，而是一邊拚一邊覺得很有希望。球隊上半場落後二十分，大家在休息室低著頭，你拍拍手說「下半場只要每分鐘追一分就好」，真的有人笑出來站起身。結果不如預期的時候，你可以把「這次學到什麼」也算進成績裡。","jobs":["青少年運動教練","業務新人訓練講師","復健治療師"],"jobs_why":"這三份工作都要陪人走過一段很慢、很挫折的進步。你自己肯拚，又相信對方一定會好，他們才撐得下去。","ip":"做「從零開始的學習日記」：誠實拍下笨拙的第一天和每週一點點的進步，語氣輕鬆、不說教。標題範例：「學游泳第 1 天到第 30 天，我嗆了幾次水」。","next":"這個月每天睡前寫一行「今天做到的一件事」，連續 21 天，最後挑 3 則分享給朋友。"},"弄臣":{"name":"把挑戰玩成遊戲的人","portrait":"你想證明努力有用，弄臣那一面讓你把苦練變得好玩。你不是不認真，而是知道好玩的事才撐得久。部門要衝季末業績，你在白板畫了一張闖關地圖，每成交一筆，那個人就擲骰子前進，最後一格是你請全部門喝珍奶。想一直拚、又想放鬆一下時，你可以把休息也設計成其中一關。","jobs":["企業內部活動企劃","運動賽事主持人","遊戲化學習設計師"],"jobs_why":"這些工作都要讓一群人自願投入一件很累的事。你有拚勁，又會把它變好玩，大家會笑著跟你衝到最後。","ip":"做搞笑挑戰：給自己一個有點荒謬的限制，記錄過程裡的狼狽和意外。觀眾看得開心，也會想自己試試看。標題範例：「一週只能花 100 元，第三天我開始跟超商店員交朋友」。","next":"這個月把一件你一直拖的事做成遊戲，設 5 關和一個小獎品，找一個朋友比誰先過關。"},"戀人":{"name":"為了在乎的人拚到底","portrait":"你想證明努力有用，戀人那一面讓你拚的理由常常是某一個人。你不是為了獎盃，而是想讓重要的人過得更好，或為你感到驕傲。準備證照的那三個月，你書桌前貼著一張全家福，考完第一件事是帶媽媽去她念了很久的那家餐廳。想全力衝、又想陪在身邊時，你可以每週固定留一個晚上給在乎的人，那晚不排練習。","jobs":["舞台劇演員","餐廳主廚","婚禮攝影師"],"jobs_why":"這三份工作都要高強度的投入，也都要真的放感情進去。你肯苦練，又懂得打動人，做出來的東西會讓人有感覺。","ip":"做帶著感情的挑戰故事：說清楚你為了誰、為了什麼而練，把過程和最後那一刻都拍下來。標題範例：「為了在她婚禮上彈這首歌，我從零學了半年鋼琴」。","next":"這個月寫下你正在努力的事是為了誰，挑一個階段成果，親自跟那個人分享。"},"探險家":{"name":"專挑沒人走過的路的人","portrait":"你想證明努力有用，探險家那一面讓你想在陌生的地方證明。你不是只要贏，而是要在還沒人走過的地方贏。同學都留在台北找工作，你一個人飛去越南開拓市場，第一個月靠翻譯 App 跟廠商比手畫腳，談下第一筆訂單。想專心攻一座山、又想換下一座時，你可以每完成一個里程碑，才換一張新地圖。","jobs":["海外業務開發","登山嚮導","外派駐點主管"],"jobs_why":"這些工作都要在陌生、沒人帶的環境裡交出成績。你想闖新地方，也撐得住過程的辛苦，越難的地方你越有勁。","ip":"做「遠征紀錄」：去一個你完全不熟的地方或領域，從什麼都不會開始，記錄怎麼一步步站穩。標題範例：「一句越南話都不會，我去胡志明市談生意」。","next":"這個月報名一個從沒做過的挑戰，例如一座山或一門短期課，訂好日期，出發前和回來各記錄一次。"},"智者":{"name":"先算好再出手的戰略家","portrait":"你想證明努力有用，智者那一面讓你在用力之前先算清楚。你不是拚蠻力，而是想知道力氣用在哪裡最值得。準備比賽時，別人每天狂練，你先把自己的動作錄下來逐格看，發現是起跑慢了零點三秒，接下來兩週只練那一段。想立刻衝、又想再分析時，你可以邊做邊看數字，一邊練一邊修。","jobs":["電競戰術教練","專案經理","標案企劃"],"jobs_why":"這三份工作都是要贏，但不能只靠蠻幹，得先看懂局勢再出手。你的拚勁加上分析，能把力氣花在真正的關鍵上。","ip":"做「拆解自己的輸贏」：把自己的比賽、業績或作品攤開來分析，找出一個關鍵原因和改法。標題範例：「我分析了自己 50 場比賽，輸的都是同一個原因」。","next":"這個月把一件正在練的事錄影或記數字一週，找出最拖後腿的一點，下一週只練那一點。"},"照顧者":{"name":"拚命也要護住隊友的人","portrait":"你想證明努力有用，照顧者那一面讓你的勝利一定要有人一起。你不是只顧自己衝線，而是會回頭把落後的人拉上來。專案最後一晚，你做完自己的部分沒有先走，反而拉張椅子坐到新人旁邊說「剩下這張圖我們一起趕」。想贏、又怕有人被丟下時，你可以直接把「全隊一起到終點」設成目標。","jobs":["校隊教練","業務團隊主管","新創營運長"],"jobs_why":"這些位置要的不是一個人最強，而是整隊都能交出成績。你自己拚得動，也看得到誰快撐不住，會帶著大家一起贏。","ip":"做「帶人一起挑戰」的內容：找幾個完全新手，陪他們從零完成一個目標，重點放在每個人的轉變。標題範例：「帶 10 個從沒跑過步的同事完成 5 公里」。","next":"這個月找一位正在卡關的同事或朋友，陪他把一件事從開始做到完成，中間約好兩次進度檢查。"},"統治者":{"name":"帶隊打勝仗的指揮官","portrait":"你想證明努力有用，統治者那一面讓你不只想自己贏，而是要整個團隊贏。你不是單打獨鬥的戰士，而是先排好陣型的隊長。門市業績墊底，你接手第一週就重排班表，把最會賣的同事放在週末下午，月底衝到全區第二。想親自上陣、又知道該交給別人時，你可以只在最關鍵的一場出手，其他放手讓隊友打。","jobs":["門市區經理","工地主任","大型活動總監"],"jobs_why":"這三份工作都要在時間壓力下，帶一群人把一件大事做完。你有衝勁，又會排人排事，能讓整隊照著計畫打贏。","ip":"做「接手爛攤子」的實戰紀錄：公開一開始的數字、你改了哪幾件事、每個月的變化，讓觀眾學到帶隊的方法。標題範例：「接手墊底團隊 90 天，我改了這 3 件事」。","next":"這個月替你負責的一件事訂一個數字目標和三個負責人，每週五花 10 分鐘一起看進度。"},"魔法師":{"name":"換個方法打贏硬仗的人","portrait":"你想證明努力有用，魔法師那一面讓你不只硬拚，而是去找一個更好的方法。你不是靠加班贏，而是改了做法，讓結果直接翻倍。大家都說一天剪不完十支短影音，你花一個晚上做好剪輯範本，隔天中午就剪完，下午還多拍了兩支。想靠努力證明、又想走捷徑時，你可以先用新方法做一次，跟舊方法比數字。","jobs":["成長行銷專員","自動化流程工程師","短影音代剪接案"],"jobs_why":"這些工作都看結果、也都有很多重複的苦工。你肯拚，又會找新做法，能把別人做一週的事縮成一天。","ip":"做「挑戰極限效率」的內容：先說一件大家覺得做不到的量，再公開你的方法和實際花的時間。標題範例：「一天剪 10 支短影音，我用了這個方法」。","next":"這個月挑一件每週都要做的苦差事，試一種新做法做一次，記下花的時間，跟舊做法比較。"}},"照顧者":{"凡人":{"name":"大家都敢來問的自己人","portrait":"你想讓身邊的人過得好一點，凡人那一面讓你用「我也是這樣過來的」的姿態去幫。你不是站在台上教人的老師，而是坐在隔壁桌、一轉頭就問得到的人。新人不敢問主管，下班在茶水間小聲問你，你說「我第一個月也搞錯過，來，我畫給你看」。想幫忙又怕被說愛出頭的時候，你會選擇私下幫，功勞讓給別人也沒關係。","jobs":["新人教育訓練專員","社區大學課程助教","連鎖門市店長"],"jobs_why":"這三個位置都需要一個「不會讓人覺得自己很笨」的人。你願意顧人，又沒有架子，新手才敢在你面前承認自己不會。","ip":"做「同事視角」的職場生存筆記：不講大道理，只講你自己踩過的坑和當時怎麼爬出來。觀眾會覺得你是自己人，而不是在上面指導他。標題可以用「第一個月沒人會教你的 5 件事」。","next":"這個月把新人最常問你的 3 個問題寫成一頁小抄，放進團隊共用資料夾，並在群組說一聲。"},"創造者":{"name":"把關心做成作品的人","portrait":"你想讓人少一點慌，創造者那一面讓你用「做出一個東西」來照顧人。你不是只想做漂亮的作品，而是希望用的人拿到就安心。朋友第一次去日本自由行，你做了一本手繪路線小冊，連哪個出口有電梯、哪間超商有座位都標好。作品想再改一輪、對方明天就要出發時，你會先交出能用的版本，好看的版本下次再升級。","jobs":["使用者體驗設計師","兒童教材插畫","衛教圖文設計"],"jobs_why":"這些工作要的不是炫技，而是讓緊張或第一次接觸的人一看就懂。你對人的體貼加上動手做的能力，剛好用在這裡。","ip":"把一件讓人頭痛的事做成一張圖解卡或一份小手冊，用作品本身證明你的用心。每一張都可以存起來、傳給家人。標題範例：「看完這張圖，你阿嬤也會用 LINE 視訊」。","next":"選一件身邊的人常卡住的事，兩週內做成一張圖解，送給 3 個人用，再問他們還卡在哪一步。"},"叛逆者":{"name":"替被忽略的人拍桌的人","portrait":"你在乎每個人有沒有被好好對待，叛逆者那一面讓你看到不公平就忍不住開口。你不是愛吵架，而是溫柔裡有一條不能退的底線。公司新制度讓夜班同事要多填一張表，大家只在私底下抱怨，你卻把大家的心聲整理好，連同改法一起拿去找主管。想維持和氣又想說真話時，你會先問當事人要不要你出面，再決定說得多重。","jobs":["員工關係專員","非營利組織倡議企劃","消費爭議申訴專員"],"jobs_why":"這三個位置都要站在比較弱的那一方說話，又不能只靠情緒。你真心在乎人，也敢把不合理的事講出來，兩邊都用得上。","ip":"做「替一般人把話講白」的內容：拆解合約、規定、退費條款裡對消費者不利的地方，最後一定給一個可以照做的方法。標題範例：「這個合約條款，業務不會主動告訴你」。","next":"這個月挑一個你覺得不合理的小規定，寫一頁「現在怎樣、影響誰、可以怎麼改」，月底前交給能做決定的人。"},"天真者":{"name":"一開口就讓人安心的人","portrait":"你想照顧人，天真者那一面讓你打從心裡相信對方會好起來。你不是沒看到問題，而是知道被相信的人，才長得出力氣。學生考差了縮在教室最後一排，別的老師在算平均，你蹲下來說「這題你上次會耶，我們看看是哪裡卡住」。你看到風險、又想先相信對方時，可以先相信，再跟他約好一個一起檢查的時間點。","jobs":["幼兒園教保員","社區關懷據點專員","寵物美容師"],"jobs_why":"面對小孩、長輩和緊張的動物，最重要的是讓對方先放鬆。你的耐心加上不帶懷疑的語氣，能讓他們很快願意配合。","ip":"做溫和的日常打氣內容：不喊口號，而是陪觀眾把很小的一步當成進步。適合短短一分鐘、像朋友在旁邊說話的影片。標題範例：「今天只做到一件事，也算數」。","next":"這個月每週傳一則具體的稱讚給一位同事或朋友，講出他做了什麼，連續四週不中斷。"},"弄臣":{"name":"用笑聲接住大家的人","portrait":"你想讓人好過一點，弄臣那一面讓你把笑話當成 OK 繃。你不是在耍寶，而是知道有時候人需要的不是建議，是先笑一下。同事被客戶罵完回座位，你不問發生什麼事，先遞上一杯珍奶說「今天的奧客額度用完了，接下來都是好人」。想認真關心又怕氣氛太沉重時，你會先把人逗笑，等他鬆下來，再問一句真心話。","jobs":["親子活動帶領人","醫院紅鼻子醫生","企業破冰課講師"],"jobs_why":"這些工作都要在緊張或生疏的場合，讓人先笑、再打開心。你懂得照顧人的感受，又抓得到笑點，兩者缺一不可。","ip":"做「好笑但有用」的療癒內容：先用一段吐槽讓人笑出來，再給一個今天就能用的小方法。觀眾會因為被逗笑而轉傳。標題範例：「被老闆罵完的三分鐘急救包」。","next":"這個月在團隊群組辦一次「本週最慘小事」分享，你先發第一則，記下有幾個人跟著說。"},"戀人":{"name":"記得每個人小細節的人","portrait":"你想照顧人，戀人那一面讓你的照顧帶著溫度和儀式感。你不是在做表面功夫，而是想讓對方感覺到「原來你一直記得」。朋友升職，大家傳貼圖，你訂了他最愛那家的甜點，卡片上寫的是他三年前說過想當主管的那句話。想把每個細節都做到位、時間卻不夠時，你可以挑一個最有意義的細節做到滿，其他簡單就好。","jobs":["婚禮顧問","精品 VIP 客服專員","客製禮盒品牌主理人"],"jobs_why":"這三份工作賣的都是「被記得、被珍惜」的感覺。你會照顧人，又在意氣氛和美感，客人收到的不只是服務，是心意。","ip":"做送禮和待人細節的內容：用小預算做出讓人難忘的心意，每支都附可以照抄的做法。觀眾會為了下一個節日存起來。標題範例：「預算 500 元，讓同事記你一整年的離職禮」。","next":"這個月建一份「身邊人的小筆記」，寫下 10 個人各一個喜好，下次見面時用上其中一個。"},"探險家":{"name":"替大家先去踩點的人","portrait":"你想照顧人，探險家那一面卻一直想往外跑，看起來像在打架。你不是丟下大家自己去冒險，而是先替大家去試，試完回來帶路。新開的步道你先走一趟，回來在群組貼上停車場位置、哪一段有廁所、能不能推嬰兒車。想出發又放不下留下來的人時，你可以把出發變成「帶一小團一起走」。","jobs":["小團旅行領隊","戶外教育引導員","海外志工帶隊"],"jobs_why":"這些工作都要有人敢先踏出去，又要一路顧好每個人。你喜歡新地方，也放不下身邊的人，剛好就是帶隊的人。","ip":"做「我先替你走一遍」的踩點內容，特別照顧長輩、小孩或第一次去的人：會累嗎、哪裡能休息、要帶什麼。標題範例：「帶長輩去這裡之前，先看我走一遍」。","next":"這個月挑一個身邊有人想去、你也沒去過的地方，先自己走一趟，寫一份 5 點的出發前須知分享出去。"},"智者":{"name":"先查清楚再陪你走的人","portrait":"你想照顧人，智者那一面讓你相信最好的照顧，是給對方對的資訊。你不是丟一堆資料就走，而是查到對方真的看得懂為止。朋友第一次租屋，你整理一頁「簽約前要問房東的 8 件事」，還附上自己當年被扣押金的那一條。對方其實只想被安慰、你卻準備好一整套答案時，可以先問一句：「你現在想聽建議，還是想先講完？」","jobs":["照顧管理專員","圖書館參考館員","育兒講座講師"],"jobs_why":"這三個位置面對的都是很慌、又需要正確資訊的人。你肯花時間查證，也在乎對方聽不聽得懂，兩件事都會被用到。","ip":"做給新手的「查證懶人包」：每支只回答一個大家很慌的問題，附上你查到的出處和一個下一步。觀眾會因為覺得可靠而追蹤。標題範例：「第一次租屋，簽約前一定要問的 8 件事」。","next":"這個月把你幫朋友查過最久的一件事，整理成一頁懶人包，傳給 5 個可能用得到的人。"},"統治者":{"name":"把照顧排成制度的人","portrait":"你想照顧人，統治者那一面讓你不只顧眼前這一個，而是要每個人都被顧到。你不是愛管人，而是不想讓照顧只能靠運氣和誰比較熱心。部門每次有人請產假就手忙腳亂，你做了交接清單和代理人輪值表，從此誰請假都不用半夜回訊息。想體諒每個人的狀況、又想規則一致時，你可以把常見的例外也寫進規則裡。","jobs":["長照機構主任","社工督導","人資制度規劃專員"],"jobs_why":"這些位置要讓一大群人都被照顧到，不能只靠一個人燃燒自己。你的體貼加上排制度的能力，能讓照顧變得長久。","ip":"做「把照顧系統化」的內容：輪班表、交接清單、家人分工表，讓觀眾看完就能套用。對正在一個人硬撐的人特別有用。標題範例：「一個人顧爸媽撐不住？我們家的輪班表長這樣」。","next":"挑一件團隊裡一直只有某個人記得的照顧小事，這個月寫成一張檢查清單，讓兩個人以上都能接手。"},"英雄":{"name":"第一個衝去救援的人","portrait":"你想照顧人，英雄那一面給了你出手的勇氣。你不是只會在旁邊心疼，而是捲起袖子把事情扛下來。颱風天社區淹水，別人還在群組問怎麼辦，你已經穿上雨鞋去敲獨居阿伯的門，順便問隔壁要不要沙包。英雄想一直撐、照顧者又常忘了自己，所以你可以在行動前就排好誰來跟你換班。","jobs":["緊急救護技術員","急診護理師","兒少保護社工"],"jobs_why":"這三份工作都需要在最混亂的時候衝進去，還要記得對方是一個人。你的勇氣和體貼，在第一線會同時被用上。","ip":"做「緊急時刻怎麼辦」的實戰教學：一支只教一個情境，步驟清楚、能馬上照做，你親自示範。觀眾會存起來以防萬一。標題範例：「家裡長輩跌倒，前 5 分鐘你該做的事」。","next":"這個月去上一堂 CPR 或 AED 課，拿到結業證明後，在社群分享你學到的 3 個重點。"},"魔法師":{"name":"替大家省下麻煩的發明家","portrait":"你想照顧人，魔法師那一面讓你想從根本改掉麻煩。你不是一次又一次幫忙收拾，而是想讓同一個問題以後不再發生。阿嬤每次看醫生都要打給你幫忙掛號，你幫她把手機設定好，桌面只剩一個大大的「看醫生」按鈕。新方法做好了、對方卻還不習慣時，你可以陪他用前三次，等他自己會了再放手。","jobs":["長輩 3C 課程講師","客服流程優化專員","無障礙設計顧問"],"jobs_why":"這些工作都在替「被麻煩卡住的人」換一種做法。你看得到誰不方便，也想得出新解法，改完的人會真的鬆一口氣。","ip":"做「改造前後對比」的內容：拍下家人或客人原本卡住的樣子，再展示你改了什麼、現在多簡單。標題範例：「我把爸媽的手機改成這樣，他們再也沒打給我問」。","next":"這個月找一件你每週要幫別人做 3 次以上的事，花一個週末做成捷徑或範本，教對方自己用。"}},"探險家":{"照顧者":{"name":"先去探路再回來接人的人","portrait":"你想去沒去過的地方，但你從不想一個人走完。照顧者那一面讓你出發前會多想一步：誰會跟不上、誰其實很想去卻不敢開口。你不是放不下別人，而是覺得新風景有人一起看才算數。報名登山團時，你會先查好路線，再把多帶的一件雨衣塞進背包，因為你猜會有人忘記。兩邊打架時，你通常先陪大家走完這一段，再替自己排下一次單獨出發。","jobs":["戶外領隊","新進人員導覽培訓","海外遊學顧問"],"jobs_why":"這些工作都要有人先熟悉陌生的地方，再把一群人安心帶進去。你的好奇心負責探路，細心負責讓每個人都跟得上。","ip":"做「新手陪走」系列：你先去試一個陌生的地方或工具，回來用「第一次去的人會卡在哪」的角度帶觀眾走一遍，重點放在別人沒講的貼心細節。標題例如「第一次一個人去京都，這 5 件事我希望有人先告訴我」。","next":"這個月挑一個你最近試過的新東西，寫一份給新手的「出發前清單」，至少 5 點，傳給 3 個正打算試的朋友。"},"天真者":{"name":"相信路上都是好人的旅人","portrait":"你想看更大的世界，而且你出發時帶的不是防備，是期待。天真者那一面讓你相信陌生人多半是善意的，所以你敢在異地搭話、敢接受當地人一句「我帶你去」。你不是不懂風險，而是不想讓擔心先替你決定要不要出門。別人旅行回來講被坑的經驗，你回來講的是早餐店阿姨多送你一顆茶葉蛋。兩邊打架時，你會先信一次，再用一個簡單的底線保護自己。","jobs":["青年旅館經營","國際志工專案協調","交換學生輔導員"],"jobs_why":"這些位置每天都在接住剛到陌生環境、心裡有點怕的人。你的好奇讓你不怕新地方，你的單純讓對方第一天就放下戒心。","ip":"做「這個世界其實比你想的友善」的真實紀錄：去一個大家有點怕的地方或嘗試，把遇到的好人和實際狀況照實拍出來，也老實講哪裡真的要注意。標題例如「大家都說一個人去很危險，我實際住了 7 天」。","next":"這個月和一位你一直好奇、但還沒聊過的人約一杯咖啡，問他三個關於他工作的問題，回來記下一句最意外的話。"},"凡人":{"name":"替大家先去試的普通人","portrait":"你想試新東西，但你最在意的是「一般人用得上嗎」。凡人那一面把你的好奇拉回地面：你不追最貴的行程，也不炫只有少數人做得到的冒險。你不是沒有野心，而是覺得自己試得到的，別人也該試得到。別人分享五星飯店，你分享的是「三千塊玩兩天」的路線，連哪班公車最空都寫進去。兩邊打架時，你會選那條比較普通、但大家跟得上的路。","jobs":["平價旅遊內容編輯","產品體驗測試員","社區大學講師"],"jobs_why":"這些工作都要有人親自去試，再用一般人聽得懂、付得起的方式講出來。你肯出發，也記得大家的荷包和時間有限。","ip":"做「預算有限也能試」的實測內容：每次訂一個普通人做得到的限制，例如一千塊、一個週末、一支手機，然後真的去做並公開花費。標題例如「月薪三萬也能出國？我用 8000 元在曼谷待了 4 天」。","next":"這個月用一個固定預算（例如 500 元）完成一次新體驗，把每筆花費列成一張表，發到社群或傳給兩個朋友。"},"英雄":{"name":"把冒險當成關卡在破的人","portrait":"你想去遠方，而且不只是去看看，是要完成點什麼。英雄那一面讓你的出發有了終點線：不是「去日本玩」，而是「騎完環島」「三個月學會潛水拿證照」。你不是在逞強，而是有目標的冒險才會讓你覺得沒白走。別人在山屋裡休息，你在看明天的天氣，盤算能不能多攻一座山頭。兩邊打架時，你會把想亂逛的心收起來，先完成計畫，再給自己一天不排行程。","jobs":["戶外挑戰活動企劃","海外市場開發業務","極限運動教練"],"jobs_why":"這些工作同時要你踏進陌生地方，又要你交出看得見的成績。好奇讓你願意去，好勝讓你在那裡撐到有結果。","ip":"做「挑戰紀錄」系列：先公開一個有期限的目標，每集更新進度、失敗和調整，最後一集給結果。觀眾會為了看你成功沒有而回來。標題例如「30 天從不會游泳到游完 1 公里，第 12 天我差點放棄」。","next":"這個月公開一個 30 天內做得到的小挑戰，貼出第一天的紀錄，並約一個朋友每週檢查一次你的進度。"},"叛逆者":{"name":"專走沒人走過那條路的人","portrait":"你想自由，而叛逆者那一面讓你連「自由」的樣子都不想照抄。大家說要等存夠錢、等時機對再出發，你會問：那要等到幾歲？你不是故意唱反調，而是不相信人生只有一套標準版本。朋友在討論哪個打卡景點好拍，你跑去問當地人「你們自己週末都去哪」。兩邊打架時，你會先問這條路是你真的想走，還是只因為大家都不走，問完再決定。","jobs":["獨立旅遊策展人","另類職涯訪談主持人","新創海外拓點專員"],"jobs_why":"這些位置都在找還沒被走爛的路線。你的好奇負責出發，你的不服氣讓你敢說「不一定要照原本的方法」。","ip":"做「反指南」：把一個大家都照著做的熱門建議拿出來，親自去試另一種做法，比一比哪個真的比較好，結果照實說。標題例如「網路上都叫你先存半年錢再離職，我反過來做了一次」。","next":"這個月挑一件你一直照慣例做的事（通勤路線、午餐、排行程方式），連續 7 天換一種做法，記下哪一天最有收穫。"},"戀人":{"name":"為了一種感覺跑很遠的人","portrait":"你出發不是為了打卡，而是為了某一種說不出來的感覺。戀人那一面讓你的探險很有溫度：你記得的不是景點名字，而是某個傍晚的光線、某間小店老闆泡茶的手。你不是想得太浪漫，而是相信旅程真正的意義藏在跟人、跟地方的連結裡。別人收藏地圖，你收藏的是每個城市的一張明信片和一段寫給自己的話。兩邊打架時，你會為了一段好的關係慢下腳步，在一個地方多待幾天。","jobs":["旅遊生活風格寫手","異國婚禮企劃","地方品牌故事採訪"],"jobs_why":"這些工作都要你走進陌生的地方，還要把那裡的人和氣味講到讓人心動。你負責出發，也負責把感覺帶回來。","ip":"做「一個地方，一個人」的短片：每到一處，只拍一位當地人和他的一個日常片段，用你的旁白講你為什麼記得他。不求資訊量，求讓人想去。標題例如「我在台東遇到一個每天只賣 30 碗麵的老闆」。","next":"這個月去一個沒去過的小地方（就算只是隔壁區），跟一位店家聊五分鐘，回來寫 200 字記下他說的一句話。"},"弄臣":{"name":"把出糗當成旅程紀念的人","portrait":"你喜歡新鮮，也喜歡好玩，兩個加起來，你根本不怕出糗。弄臣那一面讓你的冒險多了笑點：搭錯車、點錯菜、語言不通比手畫腳，對你來說都是回來最好講的故事。你不是不在意出錯，而是覺得錯了還能笑，才算真的玩到。朋友問你某個城市好不好玩，你先講你在那裡被鴿子追著跑的十分鐘。兩邊打架時，你會在好笑和有用之間，替聽的人留一個真的用得上的提醒。","jobs":["搞笑旅遊頻道主持","團康活動帶領人","新產品體驗直播主"],"jobs_why":"這些位置要有人肯先去試、試錯了還能讓大家笑。你的好奇提供素材，幽默讓失敗變成大家願意看完的內容。","ip":"做「我先踩坑你來笑」的實測：去試新地方或新工具，把卡住、出錯的過程剪成好笑的片段，最後用 10 秒講清楚正確做法。標題例如「我照著 AI 排的行程走一天，結果迷路了 3 次」。","next":"這個月把一次試新東西時的出糗經驗，整理成一則 60 秒以內的短影片或貼文，最後附上「你可以怎麼避開」一句。"},"創造者":{"name":"把走過的路做成作品的人","portrait":"你想看很多沒看過的東西，而創造者那一面不讓這些見聞只停在相簿裡。你會把旅行拍成一支有配樂的短片，把一次轉職經驗做成一本小誌。你不是只愛到處跑，而是外面看到的每一樣東西，最後都會變成你作品裡的一塊。別人回國整理照片，你在整理的是「這趟可以做成什麼」的筆記，連機場地板的花紋都拍下來當素材。兩邊打架時，你會為了把作品做完，暫時不訂下一張機票。","jobs":["旅遊紀錄片剪輯師","地方創生設計師","選物店採購兼視覺"],"jobs_why":"這些工作要先到處看、到處收集，再把收來的東西變成有風格的成品。好奇替你找素材，美感替你把素材變成作品。","ip":"做「一趟路做一件作品」：每次出門帶一個創作題目，例如只拍藍色、只錄聲音，回來剪成一支有你風格的短片，順便分享怎麼拍。標題例如「我在台南只拍了門，剪成一支 60 秒的城市影片」。","next":"這個月出門一次只帶一個創作題目，拍滿 30 張照片或 10 段影片，兩週內剪成一支作品發出去。"},"統治者":{"name":"幫一群人排好冒險路線的人","portrait":"你想往外走，統治者那一面則讓你連冒險都規劃得井井有條。你會想去很遠的地方，但出發前已經做好分工表：誰訂車、誰管錢、雨天備案是什麼。你不是放不開，而是知道把基本盤顧好，大家才能玩得放心。朋友說要去沒去過的地方，往往是你最後說「好，我來排」，然後隔天就有一份共用行程表。兩邊打架時，你會留下兩成不排的空白，讓意外也有地方放。","jobs":["企業海外參訪規劃","新據點開設專案經理","大型戶外活動總召"],"jobs_why":"這些位置都要走進新地方，同時讓一群人照計畫平安完成。好奇讓你敢接陌生任務，組織力讓陌生任務不會失控。","ip":"做「照著做就能出發」的規劃型內容：把一次陌生的行程或嘗試拆成步驟、時程和預算表，讓觀眾可以直接複製。標題例如「第一次帶爸媽出國，我用這張表排完 5 天行程」。","next":"這個月把你最近一次安排過的行程或專案整理成一張可以重複用的範本，分享給 3 個用得到的人。"},"魔法師":{"name":"一直在找新玩法的實驗家","portrait":"你想看新東西，魔法師那一面則讓你看完還想動手改造。你不只是去試一個新工具，而是試完就在想：如果把它跟另一個工具接起來，會發生什麼？你不是喜新厭舊，而是每一次嘗試都在幫你拼一個更好的做法。別人還在讀新 App 的說明，你已經用它做出一個沒人教過的用法，順手錄成短片。兩邊打架時，你會先把一個實驗做到能給別人用，再去開下一個。","jobs":["AI 工具實測創作者","數位轉型顧問","新零售體驗設計"],"jobs_why":"這些工作需要一直試新東西，再把它組合成別人用得上的方法。好奇讓你先接觸到，改造力讓你做出差別。","ip":"做「新工具混搭實驗」：每集拿兩個看起來不相關的工具或方法組在一起，實際跑一次給大家看，成功失敗都說。標題例如「把 ChatGPT 和 Google 地圖接起來，我讓它幫我排了一趟冷門行程」。","next":"這個月挑兩個你已經會用的工具，花一個晚上試出一種組合用法，寫成 5 步驟的說明傳給一個用得到的朋友。"},"智者":{"name":"走過也查過才下結論的人","portrait":"你想親自去看，智者那一面則讓你看完還想弄懂為什麼。你不是到處跑跑就好，而是每到一個地方，都會去查它的歷史、比較別人的說法，再對照自己看到的。你不是想太多，而是覺得「去過」加上「搞懂」，才算真的知道。別人旅行帶伴手禮回來，你帶回一份自己整理的筆記，連當地物價和哪些網路傳言不對都寫好了。兩邊打架時，你會先出發，路上再查，不讓資料把你綁在家裡。","jobs":["田野調查研究助理","旅遊書作者","產品市場調查員"],"jobs_why":"這些工作都要你親自到現場，又要把看到的整理成可信的結論。好奇讓你肯跑，求證讓你說的話站得住。","ip":"做「實地查證」：把網路上流傳的一個說法（某地很危險、某工具很好用）親自去驗證，對照資料和實際經驗給結論。標題例如「網路說這間店要排 2 小時，我去了 3 次記錄真實排隊時間」。","next":"這個月挑一個你好奇的網路說法，親自去試或查清楚，兩週內寫成一則有「說法／我看到的／結論」三段的貼文。"}},"叛逆者":{"統治者":{"name":"敢拆也會負責重建的人","portrait":"你看不慣不合理的事，但統治者那一面讓你不只拆，還會負責收拾。你在會議上說「這流程不合理」，下週就交出一份新的流程表和分工。你不是只會批評的人，而是會把不服氣變成新規則的人。有時你自己也發現，新的規則你守得一樣嚴。兩面打架時，是你討厭被管，卻又想把事情管好；所以你可以替自己的新規則也加一條「每半年檢討一次」，讓它不會變成你最討厭的那種老規矩。","jobs":["組織改造顧問","品質稽核主管","新創營運主管"],"jobs_why":"這三個位置都要先指出哪裡不對，再建立一套更好的做法。你敢挑問題，也願意對新制度負責，改革不會停在一場抗議。","ip":"適合做「這套制度我會這樣重寫」：拿一個大家都覺得很煩的規定，講哪裡不合理，再給一套你設計的新版本和理由。標題例如「請假要簽四個人？我重新設計了一張表」，有批評也有答案。","next":"這個月挑一條你抱怨過的規定，寫出新版本，並加一行「什麼情況下這條也該被檢討」，交給主管。"},"天真者":{"name":"相信真話會被聽見的人","portrait":"你敢說真話，是因為你相信說出來，事情就會變好。別人覺得講了也沒用，你還是在會議上舉手說「這個收費方式對客人不太公平」，而且語氣一點也不兇。天真者那一面讓你的直不帶刺。你不是在挑戰誰，而是真心覺得大家都想做對的事，只是還沒有人先開口。兩面打架時，是你說了真話卻沒人理，心裡有點失望；所以你可以找一個同樣在意的人一起提，讓聲音不只一個。","jobs":["公益團體倡議企劃","永續品牌行銷","顧客體驗改善專員"],"jobs_why":"這些工作都要指出不公平或不對的地方，又要讓人願意改。你講真話不帶敵意，對方比較不會防衛，改變反而走得比較遠。","ip":"適合做「溫和的實話」：用不嗆人的語氣，講一件對消費者不太公平的事，再教大家怎麼保護自己。標題例如「訂閱制自動續約，很多人到現在都忘了關」，觀眾看完會想馬上去檢查。","next":"這個月找一件你覺得不公平的小事，寫一封具體、附建議的意見信給負責單位，記錄對方怎麼回。"},"凡人":{"name":"替一般人說出心聲的人","portrait":"你看不慣不合理，而凡人那一面讓你特別替一般人抱不平。朋友被房東多扣押金、被健身房綁約，你比他還氣，還會幫他查好規定、寫好要傳的訊息。你不是愛出頭，而是覺得這種事不能讓老實人吃虧。你的叛逆不是往上衝，而是往旁邊站，站在被欺負的人那邊。兩面打架時，是你想說重話，又怕跟大家拉開距離；所以你可以把立場講清楚，語氣用聊天的方式。","jobs":["消費權益創作者","勞資爭議調解人","法律扶助專員"],"jobs_why":"這三個位置都要站在一般人這邊，把複雜的權利講成聽得懂的話。你有替人抱不平的勁，也有讓人覺得你是自己人的親切。","ip":"適合做「一般人別再吃虧」系列：拿生活中最常見的坑，例如綁約、隱藏費用，講清楚怎麼看、怎麼拒絕。標題例如「健身房綁約想解約？這三句話先存起來」，觀眾會收藏起來傳給朋友。","next":"這個月把你幫朋友處理過的一次糾紛，整理成一頁「遇到這種事怎麼做」的清單，分享到你常待的群組。"},"英雄":{"name":"為對的事硬撐到底的人","portrait":"你看不慣不合理，而英雄那一面讓你不只說，還會撐到底。別人抗議完就算了，你會連續三個月每週追一次進度，直到那條規定真的被改掉。你不是脾氣倔，而是覺得說了不做，比不說還糟。對你來說，改變不是一場爭吵，而是一場要跑完的長跑。兩面打架時，是你一個人扛太多、戰線拉太長；所以你可以每次只挑一件最重要的事去改，其他的先寫進清單排隊。","jobs":["調查報導記者","改革型專案主管","社會企業創辦人"],"jobs_why":"這些工作都要挑戰一個不合理的現狀，而且要花很長時間才看得到結果。你敢開第一槍，也撐得住，不會半路放棄。","ip":"適合做「追到底」的系列：挑一個不合理的現象，分集記錄你怎麼查、怎麼反映、最後有沒有改變，結果如何都照實講。標題例如「這個收費方式不合理，我決定追到底：第 1 集」，觀眾會想追下一集。","next":"挑一件你一直想改的小事，這個月訂好四週行動表，每週做一個具體動作，並記下對方的回應。"},"照顧者":{"name":"為弱勢出聲的守門人","portrait":"你敢挑戰規則，多半是因為有人被規則傷到了。新人被要求無薪加班、同事被當眾數落，你常是第一個站出來說「這樣不對」的人，事後還會私下約他吃飯。照顧者那一面讓你的叛逆有方向。你不是為了自己出頭，而是為了身邊說不出話的人。兩面打架時，是你替別人出頭，自己也累壞了；所以你可以先問當事人想怎麼處理，讓他一起決定，不用你一個人扛。","jobs":["員工關係專員","醫院社工師","動物保護組織專員"],"jobs_why":"這三個位置都要替處境比較弱的一方說話，還要陪他走完後面的路。你敢對不合理說不，也願意留下來照顧後續。","ip":"適合做「替誰說句話」：分享職場或生活中常被忽略的人的處境，再給大家一個能幫上忙的小動作。標題例如「新人第一天被要求加班到十點，你可以這樣回」，讓觀眾覺得有人站在他這邊。","next":"這個月主動問一位新同事或後輩「最近有沒有覺得不合理的事」，聽完幫他想一個能做的下一步。"},"探險家":{"name":"走自己路的獨行者","portrait":"你不喜歡被規定怎麼活，探險家那一面又讓你想去看更大的世界。身邊的人都在準備考試、找穩定工作，你已經在研究接國外的案子，或去哪個城市住三個月。你不是在逃避，而是不想把一輩子照著別人寫好的劇本走。你常是朋友圈裡第一個辭職、第一個搬家、第一個試新工作方式的人。兩面打架時，是你想走，卻還沒想好要走去哪；所以你可以先用一個副業試走一段，再決定要不要整個出發。","jobs":["數位遊牧接案者","獨立旅遊創作者","海外市場業務"],"jobs_why":"這些工作都不用照固定的路走，還能一直去新的地方。你不怕跟別人不一樣，也受得了沒有標準答案的日子。","ip":"適合做「不照劇本走」的紀錄：分享你選了一條少有人走的路，真實的收入、卡關和心得都講，不只拍美照。標題例如「離職一年接國外案子，我真實的收入長這樣」，讓想走的人看清楚代價。","next":"這個月花一個週末試一種你一直想試的工作方式，例如接一個小案子，記下收入、花的時間和感受。"},"戀人":{"name":"照自己喜歡過日子的人","portrait":"你不想照別人的標準活，而戀人那一面讓你特別在意日子過得有沒有感覺。婚禮可以不辦宴客，改成一群好朋友去山上吃一頓飯；房子可以先不買，但租的地方一定要佈置得像自己。你不是故意跟人不一樣，而是覺得日子是自己的，就該照自己喜歡的樣子過。兩面打架時，是長輩或伴侶希望你照傳統來；所以你可以先找出對方真正在意的那一點，留下它，其他照你的方式。","jobs":["獨立品牌主理人","非典型婚禮企劃","生活風格創作者"],"jobs_why":"這三個位置都在賣「不一樣的選擇」，要有自己的品味，也要讓人心動。你不跟主流走，又懂得把感覺做出來。","ip":"適合做「不一樣也很好」的生活紀錄：拍你怎麼用自己的方式，過一件大家都照傳統做的事，重點放在你為什麼這樣選。標題例如「我們沒辦喜宴，把那筆錢拿去做了這件事」，讓人看了也想試試看。","next":"這個月挑一件你一直照慣例在做、卻不喜歡的小事，改成你喜歡的方式做一次，記下身邊人的反應。"},"創造者":{"name":"用作品表態的人","portrait":"你不愛用嘴吵，你用作品表態。看不慣大家都做一樣的東西，你就做一個完全不同的：別人的包裝都用粉色，你偏偏全黑；別人的影片都在笑，你拍一支安靜到底的。你不是為了反對而設計，而是覺得作品本來就該說出你真正的想法。兩面打架時，是市場要的是安全的版本；所以你可以接一部分穩定的案子養自己，留一個系列完全照你的想法做。","jobs":["獨立插畫設計師","實驗影像導演","獨立刊物編輯"],"jobs_why":"這些工作都要有鮮明的觀點，而且要靠作品本身說話。你有想挑戰的東西，也有把它做出來的手藝，作品一看就知道是你。","ip":"適合做「反過來做」的作品系列：每支影片挑一個大家都這樣做的風格，你做一個反過來的版本，再講你的想法。標題例如「大家的菜單都長一樣，我做了一份全黑的」，讓觀眾記住你的觀點。","next":"這個月做一件不考慮市場、完全照你想法的小作品，公開分享，附一段你為什麼這樣做的說明。"},"弄臣":{"name":"用吐槽講真話的人","portrait":"你看不慣不合理，而弄臣那一面讓你用笑話把它說出來。公司規定連視訊開會都要穿外套，你做了一張只穿外套配睡褲的梗圖在群組裡傳，大家笑完才發現，你講的就是重點。你不是不敢正面說，而是知道好笑的話比較聽得進去，也比較不傷人。兩面打架時，是事情真的很嚴重，玩笑反而讓人覺得你不認真；所以你可以笑完再補一句正經的建議。","jobs":["職場吐槽創作者","脫口秀演員","廣告創意"],"jobs_why":"這三個位置都要點出大家心裡有、嘴上不說的事，還要讓人笑出來。你看得到哪裡荒謬，也知道怎麼講才不會吵起來。","ip":"適合做「吐槽＋解法」：先用好笑的方式戳破一個大家都受不了的現象，最後給一個真的有用的做法。標題例如「主管說『這很簡單』的時候，其實是這個意思」，笑完還帶得走一招。","next":"這個月把一件你覺得不合理的事寫成一段一分鐘的吐槽，結尾加一句建議，貼出去看大家怎麼留言。"},"智者":{"name":"拿證據說話的拆穿者","portrait":"你懷疑理所當然的說法，而智者那一面讓你一定要拿出證據。廣告說「九成用戶都推薦」，你會去翻這個九成是怎麼算的，最後發現只問了五十個人。你不是愛找碴，而是相信真相要查過才算。也因為你每次都附上資料，大家很難吵贏你。兩面打架時，是你查到一半就忍不住想先開罵；所以你可以先把證據整理完，再決定話要講多重。","jobs":["事實查核編輯","消費評測研究員","數據新聞記者"],"jobs_why":"這些工作都要挑戰大家相信的說法，而且每一句都要有根據。你有懷疑的勁，也有查到底的耐心，結論別人推不倒。","ip":"適合做「這個說法是真的嗎」系列：挑一個流行的說法或廣告，查來源、做實測，最後給清楚的結論。標題例如「號稱省電一半的冷氣，我去查了它的測試報告」，讓觀眾少花冤枉錢。","next":"這個月挑一個你懷疑的流行說法，花兩小時找原始出處，整理成一頁筆記分享給朋友。"},"魔法師":{"name":"帶著解法來翻桌的人","portrait":"你看不慣舊規矩，而魔法師那一面讓你不只抗議，還會變出一個新做法。大家抱怨報名系統很難用，你週末就用免費工具做了一個新版本，週一拿給主管看。你不是只會說不好的人，而是會把「這不對」直接變成「這樣比較好」的人。兩面打架時，是你想一次把舊的全拆掉，新東西卻還沒測過；所以你可以讓新舊兩套並行一個月，讓大家自己選。","jobs":["新創產品經理","流程自動化接案","使用者體驗研究員"],"jobs_why":"這三個位置都要找出舊東西哪裡不好用，再拿出更好的版本。你敢挑毛病，也做得出替代品，大家比較願意給你機會。","ip":"適合做「這個東西很難用，我做了一個新的」：先講舊東西哪裡卡，再展示你的改版和實測結果。標題例如「訂便當的表單太難用，我花一晚重做了一個」，觀眾看得到不滿怎麼變成解法。","next":"這個月挑一個大家都在抱怨的工具或表單，做出一個改良版本，請三個人試用並收集意見。"}},"戀人":{"凡人":{"name":"讓熟客覺得回到家的人","portrait":"戀人那一面想讓人覺得被珍惜，凡人那一面讓你的珍惜很生活、不拘謹。常來的客人不用開口，你就知道他要少冰半糖，下雨天還會說「今天幫你換熱的」。你不是在做服務，而是真心把熟客當朋友。兩邊打架時，你會怕太講究被說難搞，把想改的地方吞回去；所以你可以先在一小塊地方試，例如只換一盞燈，讓大家自己感覺到差別。","jobs":["社區咖啡店老闆","生活風格小編","熟客制美髮師"],"jobs_why":"這些工作靠的是客人願意一直回來。你記得每個人的喜好，又不會讓人覺得有距離，客人來你這裡就像回到熟悉的地方。","ip":"做「熟客的小故事」：每集記錄一位常客和他的小習慣，拍你為他準備的細節，經過他同意再發。標題範例：「這位阿伯每天早上七點來，只點一樣東西」。","next":"這個月記下十位常往來的客人或同事的小喜好，下次見面用上其中一個，記錄他們的反應。"},"天真者":{"name":"相信每段感情都值得的人","portrait":"戀人那一面在意深刻的連結，天真者讓你相信這些連結會有好結局。朋友失戀時，你會陪他吃完一整份鹹酥雞，然後說「下一個一定更懂你」，而且你是真的這麼想。你不是不懂現實，而是覺得先相信好的人，比較有機會遇到好的人。兩邊打架時，你會把心思全放在一段關係上；所以你可以同時經營幾個讓你開心的小圈子，讓心不只靠一個人撐。","jobs":["婚禮紀錄攝影","手作甜點工作室","寵物寫真攝影"],"jobs_why":"這些工作都在記錄或製造幸福的時刻。你真心替別人開心，又抓得到美的瞬間，客人拿到作品會覺得被好好珍藏。","ip":"做「幸福的小瞬間」：拍下你工作或生活裡遇到的溫暖片段，每支只講一個瞬間和它背後的故事。標題範例：「新郎在掀頭紗前偷偷哭了，我按下了快門」。","next":"這個月拍下二十張身邊的人自然笑出來的照片，挑最好的五張送給他們，記下哪一張讓人最感動。"},"探險家":{"name":"為了心動而出發的人","portrait":"戀人那一面追求心動，探險家想去沒去過的地方，所以你出發不是為了打卡，而是為了找到讓你起雞皮疙瘩的那一刻。你可能為了一家只有八個座位的小酒館，特地搭兩小時的車；回來最念念不忘的，是老闆聊起他為什麼開店。你不是不能安定，而是怕日子少了心動。兩邊打架時，你會想離開還不錯的工作去找新鮮感；所以你可以先在原地找一件新的事來試。","jobs":["旅宿品牌企劃","旅遊攝影師","異國料理餐廳經營"],"jobs_why":"這些工作要找到別人沒發現的美，再把那份感動帶回來給客人。你願意出發，也知道怎麼讓人身歷其境。","ip":"做「一個讓人想去的理由」：每集介紹一個地方，不講交通和價格，只講那裡讓你心動的人或畫面。標題範例：「這間只有 8 個座位的小店，讓我搭了兩小時的車」。","next":"這個月去一家你從沒去過的小店或一個小鎮，跟店主聊十分鐘，回來寫一篇三百字的故事貼文。"},"智者":{"name":"說得出美在哪裡的人","portrait":"戀人那一面靠感覺，智者那一面想知道為什麼，所以你不只覺得一杯咖啡好喝，還想知道是產地、烘焙還是水溫讓它好喝。朋友問你一張照片哪裡美，你會說「因為光從左邊斜斜進來，她的側臉才有層次」。你不是在賣弄，而是想把感覺講清楚，讓別人也感受得到。兩邊打架時，你會研究太久，遲遲不敢說自己喜歡；所以你可以先說「我喜歡」，再慢慢補理由。","jobs":["咖啡品鑑講師","餐廳侍酒師","色彩搭配顧問"],"jobs_why":"這些工作要有敏銳的感受，也要說得出背後的道理。你兩者都有，客人跟你學完不只會說好喝好看，還知道為什麼。","ip":"做「美的原因」：每集挑一個大家都覺得好看或好吃的東西，拆解它到底為什麼讓人有感覺。標題範例：「為什麼這家店的照片特別好看？我發現了三個秘密」。","next":"這個月挑一件你很喜歡的東西，寫下三個讓它打動你的原因，整理成一則圖文貼文發出去。"},"英雄":{"name":"為在乎的人拚到底的人","portrait":"戀人那一面為感情投入，英雄那一面讓你投入時不留退路。為了舞蹈教室的年度成果發表，你可以連續三個晚上縫演出服，演出前一晚還在場地調燈光到半夜。你不是愛逞強，而是只要是在乎的人，你就想給他最好的。兩邊打架時，你會把自己操到很累，嘴上還說不累；所以你可以在答應之前先問自己：我是想幫忙，還是怕對方失望？","jobs":["活動執行統籌","舞蹈教室老師","展覽布展執行"],"jobs_why":"這些工作需要熱情，也需要撐過最後一刻的體力。你為人和作品投入，又不輕易放棄，大日子交給你很放心。","ip":"做「大日子的幕後」：記錄你準備一場活動、一場演出或一個驚喜的完整過程，包含熬夜和出包的時刻。標題範例：「成果發表前 48 小時，我們只睡了 4 個小時」。","next":"這個月挑一件你正在準備的事，拍下準備過程裡的三個關鍵時刻，完成後剪成一支一分鐘的幕後影片。"},"叛逆者":{"name":"只照自己喜歡的美過日子","portrait":"戀人那一面追求美和真心，叛逆者讓你不願意為了別人改掉自己的喜好。大家都在穿奶茶色，你偏偏穿了一件復古花襯衫，而且穿得很好看。你不是故意標新立異，而是覺得照別人的標準過日子，就感覺不到自己。兩邊打架時，你會為了堅持美感推掉不錯的合作；所以你可以先列出三條絕對不改的，其他都可以談。","jobs":["獨立品牌設計師","刺青工作室刺青師","獨立書店主理人"],"jobs_why":"這些工作需要強烈的個人風格，也需要真心喜歡自己做的事。你敢跟別人不一樣，又在乎美，作品一眼就認得出是你。","ip":"做「我的不一樣」：分享你為什麼喜歡別人不愛的東西，用你的穿搭、空間或作品直接示範給大家看。標題範例：「大家都說這顏色很難搭，我穿給你看」。","next":"這個月寫下你風格裡三條絕對不改的原則，放在作品集或 IG 首頁，讓找你合作的人一眼就看懂。"},"魔法師":{"name":"把感覺變成體驗的人","portrait":"戀人那一面在意感受，魔法師想讓事情變得不一樣，所以你最擅長把普通的空間變成讓人忘不了的體驗。朋友生日，你把客廳燈關掉，用投影機在牆上放滿他從小到大的照片，大家一進門都安靜了。你不是愛搞噱頭，而是想讓人真的被打動。兩邊打架時，你會想得太大，預算和時間都爆掉；所以你可以每次只做一個驚喜點，其他簡單就好。","jobs":["沉浸式展覽企劃","品牌快閃活動設計","舞台燈光設計師"],"jobs_why":"這些工作要讓人一走進來就有感覺。你知道人會被什麼打動，又想得出新方法做出來，客人會記住那一刻很久。","ip":"做「一個空間的變身」：拍你怎麼用簡單的東西，把一個普通的地方改成有氛圍的場景，材料和花費都列出來。標題範例：「只用 3 樣東西，把我的小套房變成電影院」。","next":"這個月挑一個小聚會，替它設計一個讓人驚喜的小環節，結束後問三個參加的人最記得哪一刻。"},"照顧者":{"name":"把溫柔做成專業的人","portrait":"戀人那一面想讓人覺得被珍惜，照顧者讓你連對方身體和心情的需要都會注意到。客人來做按摩，你記得他上次說右肩痠，這次先把那一側的毛巾換熱一點。你不是在討好客人，而是真心想讓對方離開時比來時舒服。兩邊打架時，你會把溫柔全給別人，自己卻沒力氣；所以你可以替自己排一個固定的休息日，像照顧客人一樣照顧自己。","jobs":["客製禮物顧問","寵物美容師","芳療按摩師"],"jobs_why":"這些工作需要細心照顧，也需要讓人有感覺的細節。你又溫柔又有品味，客人會覺得被好好對待，願意一直回來。","ip":"做「小小的照顧」：分享你為客人或身邊的人準備的貼心細節，每集一個做法，觀眾看完就能照著做。標題範例：「客人說他很累，我多做了這一件事」。","next":"這個月替三位常往來的客人或朋友，各準備一個不超過兩百元的小驚喜，記下他們的反應。"},"創造者":{"name":"把感情做成作品的人","portrait":"戀人那一面在乎感覺，創造者想把畫面做出來，所以你的作品不只好看，還帶著讓人捨不得丟的溫度。替朋友設計喜帖，你會先聽他們怎麼認識，再把那家早餐店畫進角落。你不是只在做設計，而是在替一段感情留下紀念。兩邊打架時，你會為了做到完美一直改，拖過交期；所以你可以在開工前跟客人說好改兩次，第三次另外收費。","jobs":["品牌視覺設計","陶藝工作室主理人","商品攝影師"],"jobs_why":"這些工作要有做出東西的手，也要讓作品帶著感情。你兩者都有，客人拿到的不只是商品，而是一份心意。","ip":"做「作品背後的故事」：每支影片拍一件作品從聽故事到完成的過程，讓觀眾看見心意怎麼變成東西。標題範例：「他們在早餐店認識，我把那家店畫進了喜帖」。","next":"這個月整理你最滿意的五件作品，每件寫一段一百字的故事，放進作品集或 IG 精選動態。"},"統治者":{"name":"讓質感天天到位的人","portrait":"戀人那一面追求質感，統治者讓你把質感變成穩定的標準。你管的門市，每天開門前你會親自檢查燈光、香氛和音樂，連試衣間的鏡子都要擦到沒有指紋。你不是龜毛，而是知道客人感覺到的美，靠的是每一天都做到。兩邊打架時，你會對團隊要求太多細節，讓大家喘不過氣；所以你可以把標準寫成一張清單，讓大家照著做，不用每次靠你盯。","jobs":["精品門市店長","飯店宴會經理","餐廳外場經理"],"jobs_why":"這些位置要讓每一場、每一位客人都感受到同樣的質感。你有美感也會管理，能讓高級感不靠運氣，天天都在。","ip":"做「質感的幕後標準」：分享你經營門市或活動時的細節標準，讓觀眾看見好的體驗是怎麼一步步做出來的。標題範例：「客人進門前的 10 分鐘，我們做了這 7 件事」。","next":"這個月把你最在意的五個細節寫成一張檢查清單，交給團隊試用兩週，再一起修改。"},"弄臣":{"name":"讓浪漫一點都不尷尬的人","portrait":"戀人那一面在乎感情，弄臣想讓大家笑，所以你很會把浪漫變得一點都不尷尬。朋友求婚緊張到手抖，你先跳出來講一個笑話，全場笑開了，他才順利單膝跪下。你不是在搶風頭，而是知道人放鬆了，感動才會真的進到心裡。兩邊打架時，你會用玩笑閃過自己的感情；所以你可以在重要的人面前，練習先說真心話，再開玩笑。","jobs":["婚禮主持人","派對企劃","戀愛情境短劇創作者"],"jobs_why":"這些工作要讓人又笑又感動。你懂得什麼時候輕鬆、什麼時候深情，現場交給你，不會冷場也不會太煽情。","ip":"做「戀愛小劇場」：用短劇演出情侶或朋友之間常見的小摩擦，最後一句給一個真的有用的建議。標題範例：「她說隨便，你到底該點什麼？」。","next":"這個月寫下五個你或朋友遇過的戀愛小糗事，挑兩個拍成一分鐘短劇發出去，看哪一個留言最多。"}},"創造者":{"照顧者":{"name":"為了某個人做出好東西的人","portrait":"你想做出有自己印記的作品，照顧者那一面則讓你常常是為了某個人而做。你不是為了得獎才熬夜，而是想讓用的人覺得「這是替我想過的」。你做一份簡報，會先想看的人視力好不好、字要不要大一點。朋友開店找你設計菜單，你會先去店裡坐一下午，看客人點菜時在哪裡猶豫。兩邊打架時，你會先讓作品好用，再讓它好看，然後才是像你。","jobs":["無障礙介面設計師","長輩友善產品設計","客製化禮物工作室"],"jobs_why":"這些工作要美感，也要真的懂用的人卡在哪。你的創作力做出樣子，你的體貼讓作品被用得順手。","ip":"做「為一個人設計」系列：每集替一個真實的人解決一個小麻煩，記錄你怎麼觀察他、怎麼改作品，最後拍下他用的反應。標題例如「我幫 70 歲的阿嬤重新設計了她的手機桌面」。","next":"這個月找一位身邊的人，花 30 分鐘看他怎麼使用某個東西，然後替他做一個改良版，請他給你一句回饋。"},"天真者":{"name":"做出讓人會心一笑作品的人","portrait":"你想把腦中的畫面做出來，天真者那一面讓你的作品帶著一種乾淨的溫暖。你不追最酷、最尖銳的風格，而是想做讓人看了心情變好的東西。你不是不夠深，而是相信簡單的美比複雜的炫技更難做。你畫的插圖裡，常出現下雨天一起撐傘的兩隻小動物，有人說看了很想傳給朋友。兩邊打架時，你會為了保留那一點單純，刪掉作品裡太花俏的部分。","jobs":["療癒系插畫家","兒童繪本作者","文具品牌設計師"],"jobs_why":"這些工作需要美感，也需要一顆讓人放心的心。你的創作力做出好看的東西，單純讓它溫暖、好親近。","ip":"做「每天一張小確幸」：固定一種簡單的畫風或拍法，記錄生活裡的小美好，讓人滑到就覺得被療癒，再延伸成貼圖或小物。標題例如「我把每天最開心的一件事畫下來，第 100 天變成這樣」。","next":"這個月連續 14 天，每天做一件小作品（一張圖或一張照片），主題都是「今天的好事」，最後整理成一篇合集。"},"凡人":{"name":"做大家都用得起的好物的人","portrait":"你想做有自己風格的東西，凡人那一面則提醒你：好作品要能走進一般人的生活。你不是要做擺在美術館裡的作品，而是想做大家用得上、買得起的好東西。你不是放棄標準，而是覺得把美感做到平價，才是真本事。別人做精品設計，你在研究怎麼讓一個百元便當盒也好看又好洗。兩邊打架時，你會保留一個你最在意的細節，其他的讓給價格和實用。","jobs":["平價生活用品設計師","免費模板設計創作者","連鎖品牌視覺設計"],"jobs_why":"這些工作要美感，也要顧及一般人的預算和習慣。你的創作力讓東西好看，親民的眼光讓它真的被用。","ip":"做「小預算大改造」：示範用一般人負擔得起的材料或免費工具，把普通的東西變好看，步驟和花費都公開。標題例如「只花 300 元，把租屋處的醜衣櫃改成這樣」。","next":"這個月做一份免費的範本或小工具（例如一份簡報模板），放上網路，觀察一週內有幾個人下載或留言。"},"英雄":{"name":"不做到好不肯停的人","portrait":"你想做出好作品，英雄那一面讓你連創作都像在挑戰自己。你不只想做得好看，還想做得比上一次更難、更好。你不是愛折磨自己，而是每次突破一點技術，你才覺得自己有在往前。別人報一堂剪輯課就滿足了，你在給自己出題：「這個月學會一種沒用過的轉場，做出一支完整作品」。兩邊打架時，你會設一個截止日，到了就交，把沒做完的改進留給下一件。","jobs":["比賽型設計師","商業攝影師","遊戲美術設計"],"jobs_why":"這些工作有截止日、有標準，也看得出作品進步。你的創作力負責品質，拚勁讓你在期限內交出好成品。","ip":"做「100 天創作挑戰」：公開一個每天都要完成的創作任務，記錄每一次的進步和卡關，讓觀眾看見技術是怎麼長出來的。標題例如「每天剪一支 15 秒短片，第 30 天和第 1 天的差別」。","next":"這個月開一個 30 天創作挑戰，每天做一件小作品並公開，第 30 天把第 1 天和最後一天的作品放在一起比。"},"探險家":{"name":"到處收集靈感的創作者","portrait":"你想做出自己的作品，探險家那一面讓你的靈感來自一直往外走。你不喜歡關在工作室裡憑空想，而是要去沒去過的地方、看沒看過的東西，作品才會長出新樣子。你不是坐不住，而是相信好作品的材料都在外面。你的手機相簿有一個叫「之後用」的資料夾，裡面全是異國招牌的字體和老公寓的磁磚。兩邊打架時，你會先把手上這件做完，再把收集到的新素材留給下一件。","jobs":["品牌視覺設計師","旅遊攝影師","文創商品開發"],"jobs_why":"這些工作需要源源不絕的新素材，也需要把它們做成成品。好奇心替你找靈感，創造力把靈感變成作品。","ip":"做「靈感來源大公開」：每集拿一個在外面看到的畫面，示範你怎麼把它變成一件設計或作品，從拍下到完成都拍。標題例如「我把在台北街頭看到的老招牌，變成一組新字體」。","next":"這個月出門三次，每次拍 10 張讓你有感覺的畫面，最後挑 1 張做成一件小作品並分享製作過程。"},"叛逆者":{"name":"故意不照規矩做的設計者","portrait":"你想做出自己的東西，叛逆者那一面讓你特別受不了「大家都這樣做」。你會先看產業裡的標準做法，然後故意反著試一次。你不是愛標新立異，而是覺得照抄規則做出來的作品，沒有理由存在。客戶說「我們要跟競爭對手一樣乾淨簡約」，你提的第一版卻是滿版手寫字，還附上一頁「為什麼要不一樣」。兩邊打架時，你會保留一個反骨的地方，把其他部分做得讓人放心接受。","jobs":["獨立品牌主理人","實驗性影像導演","唱片封面設計"],"jobs_why":"這些工作要的就是跟別人不一樣，而且要有說服力。你的反骨給方向，創造力把方向做成真正好看的作品。","ip":"做「打破規則實驗」：拿一個大家公認的設計或拍攝規則，故意做一個反過來的版本，跟標準版放在一起讓觀眾選。標題例如「設計師都說不能用紅配綠，我偏要做一張好看的」。","next":"這個月挑一條你所在領域的「常規」，做一個打破它的作品，和照規則做的版本一起給 5 個人看，請他們選。"},"戀人":{"name":"把心意做成作品的人","portrait":"你想做出好作品，戀人那一面讓你的作品一定要有感情。你在乎的不只是好不好看，而是看的人會不會心頭一熱。你不是太感性，而是知道美感加上心意，作品才會被收藏很久。別人做婚禮影片只剪流程，你會去問新人第一次約會吃了什麼，把那家店的招牌偷偷剪進片頭。兩邊打架時，你會先問這個細節能不能讓對方有感覺，有，就值得多花一晚。","jobs":["婚禮錄影師","手作品牌主理人","花藝設計師"],"jobs_why":"這些工作要美感，也要讓收到的人很感動。你的創作力負責質感，你對感覺的在意讓作品帶著溫度。","ip":"做「一件作品背後的故事」：每集介紹一件你替別人做的作品，從對方的故事開始講，最後揭曉成品和他的反應。標題例如「客人要我把奶奶的老洋裝改成一個包包」。","next":"這個月替一個在乎的人做一件小作品（一張卡片、一支短片），記錄他收到時的反應，問他最喜歡哪個細節。"},"弄臣":{"name":"作品裡藏著笑點的人","portrait":"你想做好作品，弄臣那一面讓你的作品不會太嚴肅。你喜歡在細節裡藏一個小玩笑，讓看得懂的人會心一笑。你不是不認真，而是覺得好的作品也可以讓人輕鬆。你設計的公司月曆，每一頁角落都藏著一隻在偷懶的貓，同事每個月翻頁時都在找牠。兩邊打架時，你會讓玩笑服務作品，刪掉那些只有你自己覺得好笑的部分。","jobs":["動畫分鏡師","趣味包裝設計師","品牌貼圖設計"],"jobs_why":"這些工作要好看，也要有讓人記住的趣味。你的創作力撐起質感，幽默讓作品多了被分享的理由。","ip":"做「藏彩蛋的作品」：每支作品都藏一個小玩笑或彩蛋，請觀眾留言找出來，同時分享你的製作過程。標題例如「這張海報裡我藏了 5 個彩蛋，第 4 個沒人找到」。","next":"這個月做一件藏有 3 個彩蛋的作品，發出去請大家在留言找，一週後公布答案。"},"統治者":{"name":"把作品做成品牌的人","portrait":"你想做出有自己印記的東西，統治者那一面讓你不只想做一件，而是想建一套。你會替自己的風格訂規則：用哪幾個顏色、字型怎麼配、每件作品的流程怎麼走。你不是要把創作變死板，而是知道有系統，好作品才能一直做出來。別人接案一件一件從頭來，你已經有一份自己的品牌手冊，連客戶簽約後第幾天交草圖都寫好了。兩邊打架時，你會讓規則管流程，讓靈感管內容。","jobs":["品牌識別設計師","設計工作室負責人","創意總監"],"jobs_why":"這些位置要好作品，也要能帶團隊穩定產出。你的美感決定方向，組織力讓這個方向能被一群人一起做出來。","ip":"做「從作品到品牌」的經營紀錄：分享你怎麼把個人風格整理成規範、報價、流程，示範給同樣在接案的人看。標題例如「接案三年，我把自己的風格整理成一本 20 頁的品牌手冊」。","next":"這個月把你最常用的 3 個顏色、2 個字型和一套交件流程寫成一頁文件，下一個案子就照它做。"},"魔法師":{"name":"用新工具做出新東西的人","portrait":"你想做出自己的作品，魔法師那一面讓你特別愛用新工具開出新做法。你不是只用熟悉的軟體做到完美，而是一有新技術，就想試試它能讓作品變成什麼樣。你不是追流行，而是覺得新工具能讓你做出以前做不到的畫面。別人還在討論 AI 會不會搶設計師的工作，你已經用它生了二十張草圖，挑一張自己重畫。兩邊打架時，你會讓工具幫你省時間，把最關鍵的手感留給自己。","jobs":["AI 影像創作者","動態設計師","互動裝置藝術家"],"jobs_why":"這些工作要美感，也要敢用新技術。你的創作力決定作品的樣子，愛改造的個性讓你比別人早一步做出新效果。","ip":"做「AI 加手作」的創作過程：示範你怎麼用新工具起頭，再用自己的手感修到有風格，前後對比放在一起。標題例如「AI 生的 Logo 和我改過的版本，差在這 3 個地方」。","next":"這個月用一個新的 AI 工具做出一件作品，把「AI 原版」和「你改過的版本」並排發出去，說明改了哪 3 處。"},"智者":{"name":"先研究透才動手做的人","portrait":"你想做出好作品，智者那一面讓你動手前一定要先搞懂。你會研究配色原理、看設計史、拆解別人的作品，弄清楚為什麼它好看。你不是想太多，而是相信懂了道理，作品才不會只是碰運氣。別人看到一張漂亮海報只會存起來，你會把它的網格、字距、留白一格一格量出來，寫在筆記裡。兩邊打架時，你會給研究一個期限，時間到就開始動手做第一版。","jobs":["設計講師","使用者研究設計師","展覽策展人"],"jobs_why":"這些工作要能做，也要能講清楚為什麼這樣做。你的創作力負責成品，研究精神讓你說得出道理，讓人信服。","ip":"做「好設計拆解」：每集挑一個大家都看過的品牌或作品，拆解它好看的原因，最後示範怎麼用在自己的作品上。標題例如「為什麼你一看就知道是無印良品？我拆了它 50 張海報」。","next":"這個月挑 3 個你欣賞的作品，各寫一段 100 字的拆解，說明它好在哪，再用其中一個原則做一件小作品。"}},"弄臣":{"照顧者":{"name":"用笑話照顧大家的人","portrait":"你想讓大家開心，照顧者那一面讓你的好笑多了一份細心。你不只是在搞氣氛，而是在注意誰今天比較安靜、誰被冷落了，再用一個玩笑把他拉回話題裡。你不是只想當焦點，而是想讓每個人都覺得自己被算進來。聚餐有人一直沒開口，你會故意問他「欸你上次說的那個是怎樣」，讓他當一次主角。兩邊打架時，你會先把好笑讓給需要被看見的人。","jobs":["兒童才藝營帶領老師","長照據點活動規劃","企業內訓破冰講師"],"jobs_why":"這些位置要讓人放鬆，也要照顧到每一個人的狀況。你的幽默讓場子熱起來，你的細心讓沒人被丟在旁邊。","ip":"做「陪你笑過難關」的內容：挑一個大家煩惱的小事（第一次上班、被主管念），用短劇演出來，最後給一句真的能用的安慰或做法。標題例如「新人第一週最尷尬的 5 個瞬間，第 3 個我到現在還記得」。","next":"這個月在一次聚會或會議裡，刻意找一位比較安靜的人，用一個輕鬆的問題讓他多說兩分鐘，回家記下他說了什麼。"},"天真者":{"name":"笑起來沒有心機的開心果","portrait":"你想讓日子好玩，天真者那一面讓你的好笑很乾淨。你不靠酸人、不拿別人的弱點開玩笑，你的梗多半是自嘲，或把生活小事講得很可愛。你不是不會毒舌，而是不想讓任何人因為你的笑話不舒服。同事說你講笑話有種「國小同學」的感覺，大家笑完都很放鬆，沒人需要防備。兩邊打架時，你寧願少一個爆點，也要讓在場每個人都笑得出來。","jobs":["親子節目主持人","繪本說故事老師","品牌吉祥物企劃"],"jobs_why":"這些工作需要讓大人小孩都安心地笑。你的幽默不傷人，你的單純讓人一看就覺得可以信任。","ip":"做「無害系日常小劇場」：把生活中的小尷尬、小幸運演成短短的故事，不酸人、不罵人，看完心情變好。標題例如「我跟早餐店阿姨的三個月對話，越來越像家人」。","next":"這個月每天記一件讓你笑出來的小事，滿 20 件後挑最好笑的 3 件，做成一則貼文或短片。"},"凡人":{"name":"講出大家心聲的吐槽王","portrait":"你想讓人笑，凡人那一面讓你的笑點全都來自日常。你最好笑的梗，常常是大家都經歷過、卻沒人講出來的事：月底吃泡麵、主管下班前五分鐘丟工作。你不是在抱怨，而是讓大家知道自己不孤單，笑完心裡舒服一點。你在群組丟一句「今天週三嗎？我以為週五了」，十幾個人馬上回貼圖。兩邊打架時，你會選大家都懂的梗，不選只有自己覺得高級的笑點。","jobs":["上班族短影音編劇","綜藝節目企劃","品牌社群小編"],"jobs_why":"這些工作都要抓到一般人的共同心聲，再用好笑的方式說出來。你懂大家在煩什麼，也知道怎麼讓它變好笑。","ip":"做「上班族崩潰日常」短劇：每集演一個大家都遇過的情境，最後加一個小技巧幫觀眾真的解決它。標題例如「老闆說『這個很簡單吧』的時候，其實代表 4 件事」。","next":"這個月收集 10 句你身邊上班族最常講的抱怨，挑一句拍成 30 秒短片，看哪句留言最多。"},"英雄":{"name":"邊搞笑邊把事情扛完的人","portrait":"你喜歡好玩，英雄那一面讓你好玩之外，還一定要把事情做成。你會在最累的時候講笑話，但不是在逃避，而是在替大家撐到終點。你不是看起來不認真，而是你認真的方式就是讓大家笑著一起拚完。專案死線前一晚，你一邊吐槽「我們是不是在拍求生節目」，一邊把最難的那一塊默默做完。兩邊打架時，你會先把該交的交出去，再跟大家一起笑這一路有多慘。","jobs":["運動賽事現場主持","業務團隊小組長","健身挑戰課程教練"],"jobs_why":"這些位置要拚出成績，也要讓團隊撐得下去。你的拚勁負責結果，幽默負責讓大家不在半路累垮。","ip":"做「好笑的挑戰紀錄」：公開一個看起來很難的目標，每集用自嘲記錄過程，失敗也拿來笑，最後交出結果。標題例如「一個月學會倒立，我的鄰居以為我在練功」。","next":"這個月選一個有點難的小目標，每週發一則好笑的進度紀錄，連續 4 週不斷更。"},"探險家":{"name":"什麼新東西都想玩一輪的人","portrait":"你想讓日子好玩，探險家那一面讓你的好玩不只在原地。你不只是會搞笑，還會一直去找新的樂子：新開的店、奇怪的課、沒人玩過的遊戲。你不是靜不下來，而是相信新鮮的經驗才會生出新的笑點。朋友聚會說「欸有人玩過那個密室嗎」，你已經玩過兩次，還順便跟店員變熟。兩邊打架時，你會把一個好玩的東西玩到能分享給別人，再去找下一個。","jobs":["新奇體驗開箱創作者","主題活動策劃","桌遊店經營"],"jobs_why":"這些工作要一直找新的樂子，再讓別人也玩得開心。好奇替你找到新玩法，幽默讓大家想跟著試。","ip":"做「怪東西我先玩」系列：每集試一個奇特的新體驗或新工具，誠實講好不好玩、值不值得花錢，笑點來自你的真實反應。標題例如「我付了 800 元去體驗『憤怒房』，砸完盤子我的感想是…」。","next":"這個月試 2 個你從沒玩過的體驗，每個都在 24 小時內用三句話寫下「好玩在哪、值不值得」。"},"叛逆者":{"name":"用笑話戳破假象的人","portrait":"你想讓人笑，叛逆者那一面讓你的笑點帶著一點刺。你最拿手的不是無厘頭，而是用好笑的方式指出「這件事其實很荒謬」。你不是愛找碴，而是覺得有些話直接講會吵架，用笑的講，大家反而聽得進去。公司推出一個要填三張表才能請假的新規定，你畫了一張四格漫畫貼在茶水間，連主管都笑了，隔週流程就簡化了。兩邊打架時，你會讓笑點對著事情，不對著人。","jobs":["時事諷刺節目編劇","脫口秀演員","品牌反差行銷企劃"],"jobs_why":"這些工作都要看穿不合理的地方，再用好笑的方式說出來。你的直讓你看得到問題，幽默讓別人願意聽完。","ip":"做「戳破誇大說法」的吐槽內容：挑一個廣告或網路上很誇張的說法，實際試給大家看，用好笑的方式比較說法和現實。標題例如「號稱 3 分鐘學會的 AI 工具，我實際花了 47 分鐘」。","next":"這個月挑一個你覺得很誇張的廣告說法，親自試一次，做成一則「它說／實際上」的對照貼文。"},"戀人":{"name":"讓氣氛變甜的開心果","portrait":"你想讓大家開心，戀人那一面讓你的好笑很有溫度。你不只是講笑話，還會記得誰喜歡什麼，把驚喜設計得剛剛好。你不是只愛熱鬧，而是想讓重要的人覺得「跟你在一起的時間很特別」。朋友生日，你不送禮物卡，而是做一支把他這一年糗事剪在一起的影片，大家笑到流淚。兩邊打架時，你會把好笑放在溫柔後面，讓人笑完還覺得被珍惜。","jobs":["婚禮主持人","求婚驚喜企劃","生日派對活動設計"],"jobs_why":"這些工作要讓人笑，也要讓人感動。你的幽默炒熱氣氛，你對感覺的敏感讓那一刻被記很久。","ip":"做「好笑又好哭」的人際小故事：拍朋友、情侶之間的日常互動，前面好笑，最後留一句溫暖的話。標題例如「我幫室友辦了一場『終於找到工作』慶功宴，他哭了」。","next":"這個月替一個重要的人準備一個小驚喜，花費不超過 500 元，重點放在一個只有你們懂的梗。"},"創造者":{"name":"把笑點做成作品的人","portrait":"你想讓人笑，創造者那一面讓你連搞笑都要做得很講究。你不滿足於隨口一句梗，而是會把它變成一支剪得剛好的短片、一張排版漂亮的梗圖。你不是在龜毛，而是知道同一個笑點，節奏差半秒就不好笑。別人看完你的影片只覺得好笑，你卻為了那一秒的停頓重剪了六次。兩邊打架時，你會先把八十分的版本放出去，看大家笑在哪裡，再做下一支。","jobs":["短影音剪輯師","搞笑貼圖插畫家","廣告創意文案"],"jobs_why":"這些工作要好笑，也要做得精緻。你的幽默提供點子，對細節的在意讓作品一看就跟別人不一樣。","ip":"做「有質感的搞笑短片」：一個笑點配上精心的畫面、字卡和音效，固定一種你的視覺風格，讓人一滑到就認出是你。標題例如「如果 AI 也要上班打卡，它的一天會長這樣」。","next":"這個月做 4 張同一風格的原創梗圖或 2 支短片，固定一種配色和字體，連續發出去看哪一張被分享最多。"},"統治者":{"name":"笑著帶隊的領頭羊","portrait":"你喜歡好玩，統治者那一面讓你好玩之外還想把場子帶好。你是那個一邊講笑話、一邊把分工說清楚的人。你不是愛管，而是知道大家笑得開心的同時，也要有人確保事情往前走。辦尾牙時，你上台主持逗得全場大笑，台下的流程表、抽獎順序、時間控制也全在你手上。兩邊打架時，你會先把規則講好，再在規則裡留空間讓大家玩。","jobs":["尾牙活動總籌","遊戲公司營運企劃","團隊主管兼內部主持"],"jobs_why":"這些位置要讓氣氛熱，也要讓流程不出錯。你的幽默讓人想參與，安排能力讓大家玩完還準時收工。","ip":"做「好笑的管理技巧」：用短劇演出團隊常見的混亂場面，接著示範一個你實際用過的整理方法。標題例如「會議永遠開不完？我用這招讓 1 小時變 20 分鐘」。","next":"這個月主持一次會議或聚會，事先排好三段流程和時間，開場用一個笑話，準時結束，事後問一個人感覺如何。"},"魔法師":{"name":"把新科技變好玩的人","portrait":"你想讓事情好玩，魔法師那一面讓你特別愛拿新東西來玩出花樣。你會用 AI 生一首替同事加班哀悼的歌，用新工具做一個抽獎小程式讓會議變熱鬧。你不是在浪費時間，而是發現大家笑著玩過一次，才真的敢用新工具。別人覺得新科技很硬，你一出手，大家都在問「這個怎麼弄的」。兩邊打架時，你會把好玩的作品再補一步，讓別人也能照著做出來。","jobs":["AI 工具教學創作者","互動展覽企劃","遊戲化學習設計師"],"jobs_why":"這些工作要讓陌生的新東西變得好親近。你的改造力讓工具動起來，幽默讓別人願意第一次試看看。","ip":"做「拿 AI 搞笑」的實測：每集用一個新工具做一件荒謬但好笑的事，順便帶出它真正好用的地方和步驟。標題例如「我叫 AI 寫了 10 個請假理由，第 7 個連我都想准」。","next":"這個月用一個新工具做一件好玩的小作品，分享給 5 個人，並附上三步驟讓他們也做得出來。"},"智者":{"name":"用笑話講清楚道理的人","portrait":"你想讓人笑，智者那一面讓你的笑點背後都有東西。你喜歡查資料、搞懂原理，再把它講成一段讓人笑出來的話。你不是愛說教，而是知道硬邦邦的知識沒人想聽，包上笑點就會有人記住。朋友轉傳一則誇張的健康謠言，你回一段「我查完了，結論是這樣」的吐槽，大家笑完都去刪了。兩邊打架時，你會先確定資料對，再決定哪裡可以好笑。","jobs":["科普短影音創作者","知識節目主持人","企業教育訓練講師"],"jobs_why":"這些工作要把正確的知識講得好聽好記。你的求證讓內容可信，幽默讓人願意從頭聽到尾。","ip":"做「笑著闢謠」：每集挑一個網路流傳的說法，先演出大家相信的樣子，再用查到的資料一條條戳破，最後給一句結論。標題例如「喝咖啡會脫水？我查了 5 篇研究，答案有點好笑」。","next":"這個月挑一則朋友傳給你的網路說法，查到至少 2 個可靠來源，寫成一段 100 字內的好笑回覆。"}},"智者":{"凡人":{"name":"說人話的知識整理員","portrait":"你想把事情搞懂，凡人那一面讓你更在意一般人聽不聽得懂。你不是在比誰懂得多，而是希望隔壁阿姨聽完也能點頭。大家在吵電費又漲了，你沒有丟出一串數據，而是用超商一杯咖啡的價格，算給大家看一個月多付幾杯。想講得完整、又怕講太難時，你會先挑一個例子講透，細節留給真的想追問的人。","jobs":["生活消費線記者","勞健保諮詢專員","企業內部知識庫編輯"],"jobs_why":"這些工作都要把又硬又長的資訊，變成一般人一看就懂的話。你肯查到底，又站在普通人的角度想，兩邊都會用到。","ip":"做「用生活例子拆解大新聞」的內容：每支只回答一個大家在吵的問題，換算成便當、咖啡、房租這種看得見的東西。標題範例：「電費又漲了，你家一個月多付幾杯咖啡？」。","next":"這個月挑一則大家都在轉的新聞，用 3 句話加一個生活例子寫成貼文，發在自己的社群上。"},"創造者":{"name":"把研究畫成圖的人","portrait":"你想把事情搞懂，創造者那一面讓你想把懂的東西做得又清楚又好看。你不是只做給自己看的筆記，而是做出別人想收藏的圖。讀完一本講睡眠的書，別人劃螢光筆，你畫成一張「一天 24 小時」的圓形圖貼在冰箱上，朋友來家裡看到就拍照帶走。想再查深一點、又想把畫面修美時，你可以先訂一個截稿日，查到那天就動手畫。","jobs":["資訊圖表設計師","博物館展示企劃","科普書籍編輯"],"jobs_why":"這三份工作都要把研究結果變成看得懂、也想看的作品。你查得深，又在意呈現的樣子，少了哪一邊都做不好。","ip":"做圖解型的輪播或短片：一次只畫一個概念，讓觀眾看一張圖就懂，順手存起來。你的研究會變成別人願意轉傳的作品。標題範例：「一張圖看懂：為什麼你睡滿 8 小時還是累」。","next":"這個月挑一本讀過的書，把最重要的一個概念畫成一張圖，兩週內貼出來，記下收藏數。"},"叛逆者":{"name":"專門拆穿誇大說法的人","portrait":"你想看清真相，叛逆者那一面讓你看清了就一定要說出來。你不是愛唱反調，而是受不了錯的東西被當成對的一直傳下去。群組有人轉「喝檸檬水可以抗癌」，你不只回一句「假的」，還附上原始研究截圖，圈出它其實是老鼠實驗。還想再查一輪、又想馬上戳破時，你可以先說「我目前查到的是這樣，另一半還在找」。","jobs":["事實查核編輯","科技產品評測","調查報導記者"],"jobs_why":"這三個位置都要查得很細，查完還要敢公開說「這不對」。你的耐心查證加上不怕得罪人的直，正好是它們要的。","ip":"做「我去查了」的拆穿系列：挑一個流行說法或廣告話術，把原始出處攤開給大家看，最後說你的結論。標題範例：「廣告說『醫生推薦』，我去查了那位醫生」。","next":"這個月挑一個你懷疑的流行說法，花一個週末查到原始出處，寫成 300 字的「我查到的」發出去。"},"天真者":{"name":"相信人人都學得會的老師","portrait":"你想把事情搞懂，天真者那一面讓你相信每個人都學得會。你不是以為事情很簡單，而是相信再難的東西都有一個簡單的入口。同事說「我數學很爛，看不懂報表」，你不跟他講公式，只說「你會算這個月薪水夠不夠花吧？這就是同一件事」。看到一堆例外、又想講得單純時，你可以先給簡單版，再補一句「還有例外，想知道再問我」。","jobs":["國中自然科老師","兒童科學營講師","理財入門課講師"],"jobs_why":"這些工作面對的都是「覺得自己學不會」的人。你懂得夠深，才找得到最簡單的入口；你相信對方，他才敢開始學。","ip":"做「完全零基礎」的入門教學：假設觀眾什麼都不懂，用一個生活例子帶進去，五分鐘內讓他懂一件事。標題範例：「完全不會也沒關係：五分鐘看懂什麼是 ETF」。","next":"這個月找一位說自己「學不會」某件事的朋友，花 30 分鐘教他一次，記下他第一次卡住的地方。"},"弄臣":{"name":"讓知識好笑起來的人","portrait":"你想把事情搞懂，弄臣那一面讓你把懂的東西講得很好笑。你不是在搞笑，而是知道人笑過的東西才記得住。你把公司的資安規定改寫成一段「詐騙集團開週會」的內心戲，同事看完笑翻，下個月真的沒人再點釣魚信。怕笑點把事情講歪、又怕太正經沒人看時，你會讓每一個笑點都踩在一個查得到的事實上。","jobs":["知識節目主持人","資安教育訓練講師","博物館導覽員"],"jobs_why":"這三份工作都要讓聽眾在輕鬆的氣氛裡記住正確的東西。你查得準又講得好笑，大家聽完會記得，也不會被誤導。","ip":"做搞笑科普短片：用短劇或吐槽包住一個真的知識點，結尾用一句話講清楚重點和出處。觀眾笑完還學到東西。標題範例：「如果詐騙集團也要開週會」。","next":"這個月把你最熟的一個知識點寫成 60 秒的短劇或吐槽，拍給 3 個朋友看，問他們記住了什麼。"},"戀人":{"name":"懂道理也懂人心的人","portrait":"你想把事情搞懂，戀人那一面讓你最想搞懂的是人。你不是在分析別人，而是想知道他為什麼會這樣感受。朋友失戀半夜打給你，你沒有丟出心理學名詞，聽完只說「你氣的好像不是他走了，是他走之前沒講清楚」，電話那頭沉默了一下，說「對」。想找原因、又想先陪著時，你可以先陪一會兒，等對方準備好再一起找原因。","jobs":["諮商心理師","使用者訪談研究員","心理勵志書編輯"],"jobs_why":"這三份工作都要聽懂人沒說出口的話，再把它說清楚。你想理解的好奇心，加上對感受的敏銳，在這裡最有用。","ip":"做「拆解人際關係裡的一句話」的內容：挑一句常聽到的話，講出它背後可能的感受，再給一個回應方法。標題範例：「吵架時他一直說『隨便』，其實是在說什麼」。","next":"這個月用同一個問題訪談 3 個人，例如「最近一次覺得被懂是什麼時候」，整理成一篇你的觀察。"},"探險家":{"name":"親自到現場查證的人","portrait":"你想把事情搞懂，探險家那一面讓你不滿足於二手資料。你不是坐在書桌前推理的人，而是會搭車去現場看的人。網路說某條老街的店都撐不下去，你親自去走一趟，跟三個老闆聊完才發現，問題是房租，不是沒人潮。想先把資料讀完、又想直接出發時，你可以讀兩個小時就出門，剩下的在現場補。","jobs":["田野調查研究助理","旅遊書作者","市場調查專員"],"jobs_why":"這些工作要的答案都不在網路上，得親自去問、去看。你想搞懂的心，加上肯出門的腳，能拿到別人拿不到的資料。","ip":"做「網路說的 vs 我看到的」實地查證：先列出網路上的說法，再帶觀眾去現場，一條一條對照。標題範例：「網路說這裡很難逛，我親自走了一整天」。","next":"這個月挑一個只在網路上看過的地方或店，親自去一次，回來寫下 3 件跟網路說法不一樣的事。"},"照顧者":{"name":"把知識變成救生圈的人","portrait":"你想把事情搞懂，照顧者那一面讓你懂了就想拿去保護人。你不是在比誰懂得多，而是看到有人因為不懂而吃虧，就坐不住。爸媽接到「健保卡被盜用」的電話，你沒有罵他們，而是坐下來一條一條拆解話術，最後把 165 存進他們手機的第一個。想把原理講完整、又怕對方越聽越慌時，你可以只給他今天用得到的那一步。","jobs":["反詐騙宣導講師","衛教護理師","法律扶助專員"],"jobs_why":"這三份工作都是用正確的知識，替別人擋掉傷害。你查得清楚，又真心怕對方吃虧，講出來的話別人會願意聽。","ip":"做「防坑」系列：每支只教一種最常見的陷阱，講出怎麼認、遇到時第一步做什麼，讓觀眾傳給家人。標題範例：「接到這通電話先掛掉：長輩最常中的 3 種詐騙」。","next":"這個月找一位長輩或新手朋友，花 20 分鐘教他一件防坑的事，再請他講一遍給你聽。"},"統治者":{"name":"替大家定出標準的人","portrait":"你想把事情搞懂，統治者那一面讓你懂了之後想定出一套做法。你不是只提意見的人，而是把對的做法寫成規則，讓大家照著走。公司每個人報價方式都不一樣，你花兩週研究過去一年的案子，做出一張報價公式表，從此新人第一天就能報價。知道總有例外、又想規則清楚時，你可以每一季回頭檢查一次，規則還對不對。","jobs":["品保工程師","內部稽核人員","企業知識管理顧問"],"jobs_why":"這些位置要先把事情研究透，再變成大家都能照做的標準。你的分析力加上定規則的習慣，能讓團隊少犯同樣的錯。","ip":"做「我研究了很多案例，整理出一套方法」的內容：用數量建立可信度，最後給一份能照做的清單。標題範例：「我研究了 100 份履歷，錄取的人都做了這 4 件事」。","next":"這個月把團隊裡一件大家做法都不同的事，整理成一頁標準做法，請 2 個同事試用一週再修。"},"英雄":{"name":"查完就下場驗證的人","portrait":"你想把事情搞懂，英雄那一面讓你懂了就要親自證明。你不是只會紙上談兵，而是查完就把自己當實驗品。讀完三篇講跑步的研究，隔天清晨你就照著改配速，手機裡記下每一次的心跳，月底拿數字跟上個月的自己比。想再確認、又想馬上出發時，你可以給自己一個「查到週五」的期限，週六就開始。","jobs":["運動科學教練","商業分析師","新創加速器顧問"],"jobs_why":"這些工作要把研究變成看得見的成績，光懂不夠，還要敢下場。你查得細又肯實際去做，給出的建議有數字撐腰。","ip":"做「照研究實際做一次」的實驗紀錄：先講研究說了什麼，再公開你自己 30 天的數字和卡關。標題範例：「照研究說的方法練 30 天，我的數字變這樣」。","next":"這個月挑一個研究過但還沒做的方法，訂一個 14 天的小實驗，每天記一個數字，結束後公開結果。"},"魔法師":{"name":"把研究變成新做法的人","portrait":"你想把事情搞懂，魔法師那一面讓你懂了就想改掉舊做法。你不是在收藏知識，而是想讓知識變成一個大家用得上的新工具。你研究完怎麼用 AI 整理會議記錄，週一就幫部門做好範本，原本要寫一小時的記錄變成十分鐘。想先確定準不準、安不安全，又想趕快用時，你可以先在自己身上試一週，沒問題再推給大家。","jobs":["AI 導入顧問","流程改善工程師","教育科技產品企劃"],"jobs_why":"這三份工作都要先弄懂一個新東西，再把它變成別人的新做法。你查證的習慣讓新工具用得安心，想改變的心讓它真的用起來。","ip":"做工具實測加教學：一次比較幾個工具，講清楚你怎麼測、哪裡卡、最後推薦哪個和原因。標題範例：「我實測了 5 個 AI 會議記錄工具，最後只留下一個」。","next":"這個月挑一個研究過的新工具，自己先用滿 7 天，記下省了多少時間，再教一位同事用。"}},"魔法師":{"統治者":{"name":"替點子蓋好地基的人","portrait":"你一直在想事情可以怎麼變得更好，但你不會只停在點子。統治者那一面會在你最興奮的時候拉你一下：「這要誰負責？三個月後還會有人用嗎？」所以你提案時，除了改造前後的對比圖，還會附上一張分工表和驗收日期。你不是只會畫大餅的夢想家，而是改完還會回頭檢查的人。兩面打架時，是你想再改一次，流程卻才剛穩；所以你可以替每次改變訂一段「穩定期」，期滿再談下一版。","jobs":["產品經理","流程再造顧問","新事業開發主管"],"jobs_why":"這三個位置都要想出新東西，還要讓它上線、有人用、撐得下去。你的點子自帶分工和期限，主管比較敢放手讓你試。","ip":"適合做「改造前後＋怎麼維持」：不只秀改完的樣子，還在三個月後回訪，看改變有沒有真的留下來、哪裡又走回老路。標題例如「幫一間早餐店改點餐流程，三個月後我回去看」，觀眾會更信你的方法。","next":"找一個你三個月前推過的改變，這個月花一小時回頭檢查它還有沒有人在用，寫下三點下一步。"},"天真者":{"name":"讓人放心去試的引路人","portrait":"你想改變事情，而且你真心相信改變會帶來好結果。新工具一出來，你不會先列一長串風險嚇人，而是說「我試過了，你照這三步做就好」，再把截圖一張一張貼給對方。天真者那一面讓你的改變很溫和，不會讓人覺得自己落伍。你不是看不見問題，而是相信大多數問題都能被好好解決。兩面打架時，是你發現新方法沒想像中好用；所以你可以把「這次沒成功」也大方說出來，大家反而更信你。","jobs":["新手軟體課程講師","數位學習設計師","長輩手機課老師"],"jobs_why":"這些工作面對的都是怕新東西、怕按錯的人。你帶來改變，又讓人覺得安全，學的人比較敢自己動手按下第一步。","ip":"適合做「零基礎也能變」的教學：語氣溫和、步驟很少，讓怕科技的人也敢點下去，失敗的地方也照實講。標題例如「我媽第一次用 AI 做出一張生日卡，只花了 5 分鐘」，讓觀眾覺得自己也做得到。","next":"這個月找一位不熟科技的親友，花三十分鐘教他用一個工具完成一件小事，記下他卡住的兩個地方。"},"凡人":{"name":"把厲害東西講成白話的人","portrait":"你喜歡讓事情變得不一樣，但你最在意的是：一般人用不用得到。別人在發表會上講規格，你想的是「隔壁那個不太會用電腦的同事看得懂嗎？」所以你示範新工具時，會拿公司真的在用的報表，不用漂亮的範例。你不是在降低標準，而是知道改變要大家都跟得上才算數。兩面打架時，是你想展示最酷的那一招，又怕大家聽不懂；所以你可以先教最實用的一招，酷的留到最後當彩蛋。","jobs":["科技產品評測","企業內部工具推廣","社區大學講師"],"jobs_why":"這三個位置都要把新東西介紹給沒有技術背景的人。你懂新工具的好，也懂一般人卡在哪，講出來大家聽得懂也願意試。","ip":"適合做「上班族真的用得到」的實測：拿真實的工作情境測新工具，講清楚哪裡好用、哪裡卡、適不適合你。標題例如「AI 幫我做月報，我實測一週的真心話」，像同事在跟你分享。","next":"這個月把你最近學會的一個新工具，用同事真的會遇到的情境，錄一支三分鐘以內的示範影片傳給他。"},"英雄":{"name":"把不可能變成挑戰的人","portrait":"你想讓事情發生改變，而英雄那一面讓你願意為它拚。別人說「這做不到」，你先想出一個新方法，再給自己訂一個期限去證明。你可能連熬三個晚上，就為了讓一份本來要做一週的報表，變成按一個鍵就跑出來。你不是硬撐，而是新方法被證明有效的那一刻，對你來說比睡覺還重要。兩面打架時，是方法還沒成熟，你卻已經全力衝下去；所以你可以先給自己兩週小測試，過關再全力推。","jobs":["新創產品負責人","緊急改版專案主管","創業加速器輔導員"],"jobs_why":"這些位置都有很緊的期限，又需要沒人用過的解法。你想得出新方法，也撐得住壓力把它做完，越難的題目越能看出你的價值。","ip":"適合做「限時挑戰」：給自己一個看起來做不到的目標，用新方法在期限內完成，卡關和失敗也一起拍。標題例如「7 天用 AI 做出一個能上架的 App，我卡在第 3 天」，觀眾會想一路追下去。","next":"這個月挑一個你覺得「應該可以更快」的工作，給自己兩週改出新做法，最後對比前後花了多少時間。"},"照顧者":{"name":"用新方法替人減輕負擔的人","portrait":"你想改變事情，而你最想改的，是讓某個人過得輕鬆一點。看到同事每天手動對帳到晚上八點，你不是只說辛苦了，而是週末研究出一個自動化的做法，週一一早就幫他設定好。照顧者那一面讓你的每個點子都有一個對象。你不是為了展示新技術，而是看不得人被笨方法困住。兩面打架時，是你幫太多人改，自己的事反而沒做；所以你可以每週只接一個求救，其他的整理成一份教學。","jobs":["社福機構數位專員","客戶成功經理","診所行政流程顧問"],"jobs_why":"這三個位置都是用新工具或新流程，去減輕某群人的負擔。你看得到誰最累，也想得出讓他少花力氣的方法。","ip":"適合做「幫一個人解決一件事」的系列：每集找一個真實的煩惱，用新工具幫他改好，拍下他用完的反應。標題例如「幫做美甲的朋友把預約從 LINE 搬到系統，她終於能準時下班」，溫暖又實用。","next":"這個月找一位常抱怨某件事很煩的朋友，花一小時幫他想出更省力的做法，兩週後問他還有沒有在用。"},"探險家":{"name":"到處試新東西的實驗家","portrait":"你想讓事情改變，而探險家那一面讓你停不下來去找新的可能。週末別人在追劇，你已經註冊了三個新工具、加入兩個國外社團，還順手把用法翻成中文丟到群組。你不是三分鐘熱度，而是每一次新嘗試，都在幫你蒐集下一個改變的材料。兩面打架時，是新東西太多，你沒時間把一個做深；所以你可以每個月固定挑一個留下來用滿三十天，其他的先記在清單上。","jobs":["新工具實測創作者","企業創新實驗室成員","海外趨勢研究員"],"jobs_why":"這些工作都要一直接觸新東西，再判斷哪個值得帶回來用。你試得多、試得快，也知道怎麼把試到的東西變成別人能用的方法。","ip":"適合做「我先幫你試」系列：每週試一個新東西，用一分鐘講結論：值不值得、適合誰、卡在哪。標題例如「這週試了 4 個新 AI 工具，只有 1 個我會留下來」，幫觀眾省下自己踩雷的時間。","next":"這個月開一份「試用紀錄表」，每試一個新工具就寫三行：拿來做什麼、好在哪、卡在哪，月底整理成一篇分享。"},"戀人":{"name":"讓轉變變得有感覺的人","portrait":"你想讓事情變得不一樣，而戀人那一面讓你特別在意改完之後的感受。幫一間老店改菜單，你不只改排版，還會想客人翻開那一刻會不會笑出來、店長拿著新菜單會不會覺得驕傲。你不是只追效率，而是覺得好的改變應該讓人心動。兩面打架時，是對方只要快，你卻想做得有溫度；所以你可以先交出快的版本，再附一個「多一點感覺」的選項讓他挑。","jobs":["品牌改造企劃","體驗設計師","老店翻新顧問"],"jobs_why":"這三個位置都要帶來改變，而且要讓人一眼就有感覺。你不只把東西改得更好用，還讓使用的人覺得自己被好好對待。","ip":"適合做「改造前後」，但重點放在人的反應：拍你幫某個人或某間店改一個地方，最後一幕是他看到成果的表情。標題例如「幫開了 30 年的麵店換新菜單，老闆第一句話是……」，讓人想看到最後。","next":"這個月挑一個常去的小店或朋友的作品，免費幫他改一個小地方，拍下改前改後和他看到時的反應。"},"創造者":{"name":"直接做出原型給你看的人","portrait":"你想改變事情，而創造者那一面讓你一定要親手把它做出來。你很少只丟建議，而是直接做出一個能點、能用的原型，丟到群組說「你們先玩玩看」。你的電腦裡可能躺著十幾個做到一半的小工具。你不是愛炫技，而是覺得點子要變成東西，別人才看得懂。兩面打架時，是你想再把細節修漂亮，又急著讓大家用；所以你可以先放出一個醜但能用的版本，收到回饋再慢慢美化。","jobs":["互動設計師","無程式碼工具接案","產品原型設計師"],"jobs_why":"這些工作都要把一個想法快速變成看得到、摸得到的東西。你有改變的點子，也有動手做的耐心，討論不會只停在嘴上。","ip":"適合公開「做一個小工具」的過程：從一個真實的煩惱開始，拍你怎麼做出能用的東西，最後把它送給觀眾。標題例如「我花一個週末做了一個自動記帳小工具，留言就送你」，看得到過程也拿得到成品。","next":"這個月把一個做到一半的小作品，花一個週末修到「別人能用」，分享給五個人，收集他們的第一句反應。"},"弄臣":{"name":"把新東西玩成梗的人","portrait":"你想讓人看見新的可能，而弄臣那一面讓你用最好笑的方式展示它。別人介紹新工具用簡報，你直接用它幫老闆生出一張超好笑的生日卡，全辦公室搶著問怎麼做的。你不是在鬧，而是知道人笑了，才會放下戒心去試。兩面打架時，是你想講清楚原理，大家卻只記得笑點；所以你可以讓笑點跟操作步驟綁在一起，笑完就會做。","jobs":["科技類短影音創作者","新品發表會主持人","品牌社群企劃"],"jobs_why":"這三個位置都要讓人對新東西產生興趣，而且要讓人記住。你懂東西怎麼用，也知道怎麼讓人笑著看完，推廣不會變成上課。","ip":"適合做「搞笑實測」：用好笑的情境測新工具，笑點來自真實的結果，不誇大也不演。標題例如「叫 AI 幫我寫請假理由，結果它比我還會演」，觀眾笑完會想自己也試一次。","next":"這個月用你最近學會的工具，做一個讓朋友笑出來的小作品，貼出去時附上三步驟做法。"},"智者":{"name":"先弄懂原理再動手的改造者","portrait":"你想改變事情，但智者那一面要你先把它搞懂。新工具一出來，別人急著分享心得，你先讀官方文件、查它的資料存在哪裡，確定沒問題才推薦給別人。你不是動作慢，而是不想用一個沒弄懂的方法，去改變別人的工作。兩面打架時，是你還在研究，別人已經先做出成果；所以你可以把研究的過程也公開，讓「慢慢搞懂」本身變成你的價值。","jobs":["技術導入顧問","資安教育講師","研究型產品企劃"],"jobs_why":"這些工作都要帶來新做法，又要確定它可靠、安全、經得起追問。你先查清楚再推，別人比較放心跟著你一起改。","ip":"適合做「拆解原理＋實測」：先用白話講這個東西怎麼運作，再用實測證明你說的是對的。標題例如「這個 AI 擴充功能會讀你的資料嗎？我拆開看了」，讓觀眾覺得有你先查過很安心。","next":"這個月挑一個大家都在用的工具，花兩小時查清楚它怎麼處理資料，整理成一頁白話筆記分享給同事。"},"叛逆者":{"name":"打掉重練的點子王","portrait":"你想讓事情變得不一樣，而叛逆者那一面讓你不怕得罪人。別人想的是怎麼把舊流程修好一點，你想的是「這流程根本不該存在」，然後直接拿出一個全新的做法。你不是故意找麻煩，而是看到更好的路，就沒辦法假裝看不見舊的那條有多繞。兩面打架時，是你急著推翻，別人還沒準備好；所以你可以把新做法先做成一個小實驗，用結果說服人，不用吵。","jobs":["新創創辦人","產品改版總監","產業評論創作者"],"jobs_why":"這三個位置都需要有人敢說舊的不行，還拿得出新的。你不只挑戰現狀，還會帶著替代方案出現，大家比較願意聽你說完。","ip":"適合做「舊方法 vs 新方法」對決：同一件事用傳統做法和你的做法各做一次，計時比較，讓結果自己說話。標題例如「做簡報還在一頁一頁排？我用新方法 10 分鐘做完」，有對比就有說服力。","next":"這個月挑一個你覺得最沒效率的舊做法，用新方法實際做一次並計時，把前後對比貼給團隊看。"}},"統治者":{"天真者":{"name":"相信大家會做好的帶頭人","portrait":"你想把事情排好，但你排的方式跟一般主管不太一樣：你先假設每個人都是想做好的。新人第一次交報告錯了一半，你先問「是不是我說明得不夠清楚？」再陪他改一次。統治者那一面讓你訂標準，天真者那一面讓你相信大家做得到。你不是好說話，而是覺得信任本身就是一種管理。兩面打架時，通常是有人一再食言，你會猶豫很久才改口氣；所以你可以先把底線寫清楚，相信人和照規矩就不必二選一。","jobs":["新人培訓主管","加盟店督導","學校行政組長"],"jobs_why":"這些位置都要訂標準，也要讓人願意照著做。你給規矩時順便給信任，被帶的人比較敢問問題，也比較願意留下來。","ip":"適合做「新手照著做就不會錯」的系列：一步一步的清單，語氣放輕鬆，像學長姐在帶你上手，不像主管在訓話。例如「第一次當小主管，我只用這三條規則帶人」，讓觀眾覺得有規矩也可以很溫和。","next":"這個月把你最常被問的一件事，寫成一頁「新人照做清單」，請兩個人試用，月底前照他們的回饋改一次。"},"凡人":{"name":"沒有架子的那個主管","portrait":"你想把團隊帶穩，卻一點也不想站得比大家高。開會時你不坐主位，排班表貼出去前，會先在群組問一句「這樣週末輪得過來嗎？」你不是沒有主見，而是知道規則要大家覺得公平，才有人願意守。統治者那一面讓你訂得出規矩，凡人那一面讓你訂得像自己人。兩面打架時，是你得做一個不受歡迎的決定，會想把話說軟一點、拖一點；所以你可以先講結論，再坐下來把理由講白，大家反而更服你。","jobs":["連鎖門市店長","社區管委會主委","客服團隊組長"],"jobs_why":"這三個位置都要讓一群背景不同的人照同一套規則做事。你訂規則時會先站在第一線的角度想，大家比較不會陽奉陰違。","ip":"適合拍「小主管日常」：用真實的排班、開會、處理客訴，講你怎麼不擺架子也能讓事情有規矩。標題可以用「當主管後我最常說的一句話：這樣你們覺得公平嗎」，讓觀眾看到帶人也能很接地氣。","next":"這個月開一次十五分鐘的「流程吐槽會」，收集團隊最想改的三件事，挑一件在月底前改掉並公告。"},"英雄":{"name":"帶頭衝也帶頭收尾的人","portrait":"你要的不只是贏一場，而是贏完之後整個團隊還站得住。業績目標一出來，英雄那一面先舉手說「這個我來扛」，統治者那一面接著把目標拆成每週進度表，貼在大家每天經過的白板上。你不是只會拚的猛將，而是會在衝刺前先畫好地圖的人。兩面打架時，是你想自己一路衝到底，又知道應該分給別人；所以你可以把最難的那一關留給自己，其他的放手交出去，讓團隊也有機會長大。","jobs":["業務處經理","延宕專案接手人","新門市開幕負責人"],"jobs_why":"這三種位置都有硬目標和死線，需要有人帶頭衝，也需要有人把分工排好。你兩樣都做得到，團隊比較不會衝到一半散掉。","ip":"適合做「挑戰紀錄」：公開一個有期限的目標，每週回報進度和你怎麼調整計畫，讓觀眾看到拚勁背後其實有一張表。標題例如「90 天帶新團隊衝業績，我每週一只做這件事」，結果好壞都照實講。","next":"挑一個這個月要達成的目標，寫成四週進度表，每週五花十分鐘跟團隊對一次進度，記下差距和調整。"},"照顧者":{"name":"把大家都顧好的大家長","portrait":"你訂規矩，是因為想讓身邊的人不用擔心。排班表上誰家小孩剛出生、誰下週要考證照，你都記著，先幫他們排開。你不是用制度管人，而是用制度保護人：流程清楚了，就沒有人要一個人加班到半夜。照顧者那一面讓你扛責任時，還記得每個人的處境。兩面打架時，是有人一直交不出東西，你想替他扛、又知道對別人不公平；所以你可以把幫忙寫成期限：陪他兩週，之後照標準來。","jobs":["人資暨行政主管","幼兒園園長","長照機構督導"],"jobs_why":"這些工作一邊要守規定、顧品質，一邊要照顧一群需要被在乎的人。你能把關心做成制度，讓好的照顧不會因為換人就消失。","ip":"適合做「讓團隊不用熬夜的制度」系列：分享你怎麼用一張表、一個流程，讓大家準時下班又不出錯，重點放在人過得怎麼樣。標題例如「我們團隊沒人加班到十點，因為我改了這張表」。","next":"這個月找一位夥伴做二十分鐘一對一，只問「最近哪件事最卡」，回去後一週內幫他拿掉一個卡點。"},"探險家":{"name":"幫新地方立規矩的開路人","portrait":"你想建立能長久運作的東西，但在同一個地方待太久，你又會悶。所以你最有勁的時刻，是被派去一個還沒人走過的地方：新市場、新分店、剛成立的部門。你不是坐不住，而是喜歡把一片空地變成有規矩的據點。前三個月你什麼都自己跑，第四個月就開始寫交接手冊。兩面打架時，是事情剛穩下來你就想走；所以你可以把「穩了就交出去」寫進你的計畫，先帶出一個接班人，再去下一個地方。","jobs":["海外市場開發","展店經理","新創營運長"],"jobs_why":"這三個位置都是從零開始，要先闖進去，再把它整理成別人接得住的樣子。你兩段都做得來，而且做完還想去下一個新地方。","ip":"適合做「從零開始建立」的紀錄：每到一個新地方或接一個新專案，拍你怎麼在一個月內把它從亂變穩，最後交給誰。標題例如「被派去一個什麼都沒有的新據點，我第一週先做這三件事」。","next":"把你現在負責的工作寫成一份十頁內的交接手冊，月底前請一位同事試讀，讓自己隨時能接下一個新任務。"},"戀人":{"name":"有品味的管家型主管","portrait":"你要的秩序不只是準時、照流程，還要讓人感覺舒服。辦活動時，你排好每個人幾點到、誰負責哪一區，同時也在意入口的花擺得對不對、來賓名牌上的字有沒有印歪。你不是龜毛，而是覺得規矩和美感本來就該一起出現。統治者那一面讓場面不亂，戀人那一面讓人記得。兩面打架時，是預算或時間不夠，你捨不得砍掉那些「有感覺」的細節；所以你可以先選定一個最重要的感受，其他的照標準做就好。","jobs":["婚禮統籌","精品旅館營運經理","品牌快閃店督導"],"jobs_why":"這些工作要流程準、不出錯，客人卻是因為感覺好才買單。你能同時顧住時間表和氣氛，讓每個細節都在對的位置上。","ip":"適合拍「一場有質感的活動是怎麼被安排出來的」：流程表和擺設一起出現，讓人看到美感背後其實有一套規矩。標題例如「一場 80 人婚宴，我的流程表長這樣」，讓觀眾邊看邊學。","next":"這個月替你負責的一件事做一張「體驗檢查表」，列出客人會碰到的五個時刻，每個各改善一個小細節。"},"創造者":{"name":"替好作品立規矩的人","portrait":"你想做出自己的作品，也想讓它變成能長久經營的事業。別的創作者交完稿就結束，你會順手把配色、字型、交件格式整理成一份品牌手冊，下次換人做也不會走樣。你不是只顧畫面的藝術家，而是會替作品蓋房子的人。創造者那一面要好，統治者那一面要穩。兩面打架時，是你想再改一版，卻看到時程已經到了；所以你可以先訂好「改到第三版就交」，把還想加的東西留給下一個系列。","jobs":["品牌視覺總監","設計工作室主理人","文創商品線企劃"],"jobs_why":"這三個位置都要作品夠好，也要能一直穩定產出。你能把自己的眼光整理成別人照得了的規範，風格就不會只靠你一個人撐。","ip":"適合做「一個作品從草圖到上架」的系列，連定價、規格、交件流程都公開，讓觀眾看到創作也能有條理。標題例如「一款文創商品從草稿到上架，我走過這 7 道關」，專業感和美感一次給。","next":"把你最常做的一種作品整理成一份製作規範（尺寸、配色、交件格式），月底前請一位合作者照著做一次。"},"弄臣":{"name":"讓大家笑著守規矩的人","portrait":"你想讓團隊有規矩，但你更清楚，板著臉訂的規則沒人想記。所以你在週會簡報第一頁放一張梗圖，把「報帳要在五號前交」改成一句大家會笑著唸的口號。你不是不夠嚴肅，而是知道笑完的人比較願意照做。統治者那一面定方向，弄臣那一面讓方向好入口。兩面打架時，是真的出了狀況，你需要收起玩笑講重話；所以你可以先跟團隊約好一個暗號：你一說「這次認真」，大家就知道不是開玩笑。","jobs":["大型活動統籌","企業內訓講師","餐廳外場經理"],"jobs_why":"這些工作人多、節奏快，規定一大堆，大家又常常很累。你能把規矩講得好記又不刺耳，現場氣氛不會垮，事情也照樣做完。","ip":"適合做「把無聊規定講好笑」的內容：用短劇或吐槽，把報帳、交接、開會流程拍成大家看得懂又記得住的樣子。標題例如「報帳規定講三次沒人記？我改用這招」，笑完觀眾也學會了。","next":"這個月把團隊最常被忘記的一條規定，改寫成一句好記的口號或一張梗圖，貼在大家每天都會看到的地方。"},"智者":{"name":"用數據拍板的決策者","portrait":"你想做出能撐很久的決定，所以拍板前一定要先看懂。別人開會靠感覺，你帶著一張比較表和去年的數字進場，最後那句「就選 B」，大家沒什麼好爭。你不是猶豫，而是不想讓團隊替一個沒想清楚的決定付代價。統治者那一面要你決定，智者那一面要你決定得有根據。兩面打架時，是資料還沒齊、期限卻已經到了；所以你可以先替自己訂一條線：有七成把握就決定，剩下的三成邊做邊調。","jobs":["營運分析主管","企業管理顧問","內部稽核主管"],"jobs_why":"這三個位置都要做會影響很多人的判斷，而且事後要講得出理由。你先查清楚再拍板，做出來的決定比較經得起別人追問。","ip":"適合做「比較評比」：把一個大家常卡住的選擇，整理成清楚的比較，最後直接告訴觀眾你會怎麼選、為什麼。標題例如「小公司記帳軟體我比了 5 套，最後選這一套」，讓人看完就能做決定。","next":"這個月挑一個團隊一直在拖的決定，做一張一頁比較表，列三個選項和各自的代價，在下次會議拍板。"},"叛逆者":{"name":"改寫規則的制度派","portrait":"你看不慣不合理的規定，但你不只是抱怨，你會動手寫新的。開會有人說「以前都這樣」，你一邊問「那現在還需要嗎？」，一邊已經在筆記裡列好新流程的五個步驟。你不是單純唱反調，而是想把舊規則拆掉，再蓋一套更好的。統治者那一面讓你在意秩序，叛逆者那一面讓你不怕動到它。兩面打架時，是你想一次全改，又知道制度需要人跟得上；所以你可以先在一個小組試行一個月，數字出來再全面推。","jobs":["企業改革專案經理","流程改善顧問","新創共同創辦人"],"jobs_why":"這些位置都要打破舊做法，又要讓新做法真的站得住。你敢拆也願意負責蓋，改完的東西不會只是換了一套新的混亂。","ip":"適合做「這條規則該改了」系列：先講一個大家習以為常的做法哪裡卡，再提出你的新版本和試行結果。標題例如「團隊週報我直接廢掉，改成這張三格表」，讓觀眾拿了就能回公司試。","next":"這個月挑一條你最想改的規定，寫成一頁「舊做法、新做法、怎麼試行」的提案，交給能做決定的人。"},"魔法師":{"name":"把新點子變成制度的人","portrait":"你喜歡新做法，也想讓它真的留下來。看到一個新工具，魔法師那一面先算「這能省多少時間」，統治者那一面接著問「怎麼讓整個部門都用得起來」。你不是追新潮的人，而是會把新東西寫成操作手冊、排好導入時程，還安排誰負責回答問題的人。兩面打架時，是新點子太多，團隊吃不消；所以你可以一季只導入一個，等它變成大家的日常，再換下一個。","jobs":["數位轉型專案經理","企業系統導入顧問","營運流程主管"],"jobs_why":"這三個位置都要把新工具或新做法帶進一個已經在運作的團隊。你看得到新東西的好處，也排得出讓大家跟上的步驟。","ip":"適合做「導入實錄」：拍一個新工具從試用到全員上手的過程，包含誰卡關、你怎麼排時程、最後省了多少時間。標題例如「全辦公室 12 個人改用新系統，我花了 6 週」，好的壞的都照實講。","next":"這個月挑一個你已經用順的工具，寫一頁三步驟教學，排一場三十分鐘的分享，讓至少三位同事當場裝好。"}}}/*ENDCOMBO*/;
const REPORT = /*REPORT*/{"天真者":{"name":"天真者","en":"Innocent","keywords":["單純","樂觀","真誠","安心","信任","知足"],"people":["奧黛麗・赫本","盧廣仲","幾米","林依晨"],"brands":["Dove","Aveeno","可口可樂","無印良品 MUJI","義美"],"manifesto":"我相信事情可以很簡單，好好做對的事，日子就會慢慢變好。","portrait":{"text":"你習慣先相信，不是因為你不懂人心，而是你覺得用懷疑開場，日子會過得太累。開會時大家在猜老闆那句話背後藏了什麼，你會說：「他應該就是字面上的意思吧。」有時你猜錯，但更多時候，你這一句讓僵掉的氣氛鬆開了。你不是沒看過世界複雜的一面，而是選擇先站在好的那一邊。你喜歡說到做到、乾淨清楚的人和事，對話中有話特別沒耐心。跟你相處的人很少需要防備，因為你本來就沒在算計。","questions":"你常在心裡問：「這樣做對嗎？會不會不小心傷到誰？」事情一團亂時，你會問：「是不是有更簡單的做法，只是大家想複雜了？」被人潑了冷水之後，你偶爾也會問自己：「是我太天真了嗎？還是他們太悲觀了？」","lesson":"你正在練習的，不是學會懷疑，而是學會一邊相信、一邊看清楚。單純不等於不懂；成熟的天真，是知道有人會騙你、事情會出錯，還是願意先伸手，只是簽名前會把合約從頭看完，借錢前先想好拿不回來也沒關係。"},"mechanism":{"pursuit":"你要的不是很大的成就，而是心裡乾淨、日子安穩。你並不是沒有企圖心，只是比起升官發財，你更在意睡前回想今天，沒有哪件事讓你心虛。一份不用勾心鬥角的工作、幾個信得過的人，就很接近你想要的幸福。","drive":"推著你往前的，是「照對的方式做，結果也真的變好」的踏實感。你不是靠贏過別人證明自己，而是靠「我沒走捷徑，還是做到了」。所以守著原則、客人還一直回來的時候，你會比拿到獎金更有力量。","fear":"你最怕的不是失敗，而是發現自己做錯了事，或是相信錯了人。那種「原來我被利用了」的失落，比損失本身更痛。所以收到一則看起來像壞消息的訊息，你可能先放著不點開，好像不看，它就還沒發生。","belief":"「只要真心對待，大部分的事都會有好結果。」這不是你不懂現實，而是你決定先從這個角度出發。"},"strengths":[{"title":"把複雜的事說成一句白話","text":"你不喜歡繞，所以會一直追問到最簡單的那一句。同事被新系統搞得頭昏，你一句「其實就是先按這裡、再按那裡」，大家就鬆一口氣。你不是比較懂技術，而是受不了把簡單的事講複雜。"},{"title":"說話實在，讓人放心相信","text":"你沒在算計，所以也不太會說場面話。朋友問你那家店值不值得去，你會直接說「我覺得普通」，就算那是你以前推薦過的。久了大家都知道，從你嘴裡說出來的好，就是真的好。"},{"title":"在壞消息裡找到還能做的事","text":"專案出包時，你通常不是第一個慌的人，因為你相信事情還有轉圜。你會先找出今天還能做的那一件，再補一句「至少我們知道這條路不通了」。這不是假裝沒事，而是讓大家先有力氣站起來。"},{"title":"一點小事就能讓你滿足","text":"你不需要很大的刺激才覺得幸福。早餐店阿姨記得你要少冰，就能讓你開心一上午。你並不是沒有野心，只是不容易被比較心推著跑，所以能把一件事安安穩穩做很久。"}],"best_scenes":"需要讓人放心的時候最適合你：教完全沒基礎的新手、安撫打電話來抱怨的客人、替品牌說一段誠實的話，或在大家都很緊繃的會議裡，第一個說「我們先把能做的做完」。","value":"你帶給身邊的人的，不是答案，而是「沒事，我們可以」的底氣。大家被壞消息淹沒、開始互相怪罪時，你會把話題拉回「我們一開始想做的是什麼」。你不是看不見問題，只是記得比問題更重要的事。","weaknesses":[{"title":"話說得太平，容易被忘記","text":"你習慣把話講得簡單又溫和，少了起伏。別人聽完覺得很舒服，轉身卻不太記得你講的重點。"},{"title":"以為別人也跟你一樣實在","text":"你自己不說假話，就容易以為對方也不會。對方說「放心啦，這是標準合約」，你可能就真的沒細看。"},{"title":"樂觀到晚一步看見問題","text":"你習慣先找好的一面，問題剛冒出來時，可能先說服自己「應該還好」，等它真的變大才處理。"},{"title":"滿足了就不太想動","text":"現在的日子已經不錯，所以別人在學新工具、換跑道時，你可能覺得「我這樣就好」，慢慢落後也沒察覺。"}],"risks":[{"title":"一次受傷就全面關門","text":"你的信任如果從來沒設過底線，某天被重重騙一次，你可能從「相信所有人」一下跳到「誰都不信」，把最珍貴的那份溫度也一起收起來。"},{"title":"成為大家的緩衝墊","text":"你脾氣好、不計較，團隊裡難搞的人、沒人想接的客人，最後常常被分到你這裡。時間一久，你的好說話會變成別人默認的安排。"},{"title":"把別人的錯攬成自己的","text":"事情出錯時，你第一個念頭常是「是不是我哪裡做錯了」。就算問題不在你，你也可能默默道歉、默默補救，久了連你都相信是自己不夠好。"}],"growth":["重要的合作一律白紙黑字，簽名前把合約從頭讀一遍；借錢之前，先想好拿不回來也沒關係的金額。","覺得怪怪的時候，當天就說一句「這裡我有點不確定」，不要等它自己好轉。","每季挑一件讓你有點怕的新事情去試，例如學一個新工具，讓「我這樣就好」不變成停在原地。"],"evolution":{"from":"相信美好的老好人","to":"看清現實的樂觀者","text":"你不需要變世故，只要多一份判斷。你不是要少相信一點，而是知道該相信誰、相信到哪裡。看得見風險還願意伸手，你的樂觀才不會一碰就碎。"},"relationship":{"shine":"你在人際關係裡讓人放下防備，因為你本來就不是來算計的。朋友跟你說心事，不用擔心隔天全辦公室都知道。吵架之後，常常是你先傳一句「欸，吃飯了沒」遞出台階。你並不是不在意，而是比起吵贏，你更想要這段關係還在。","shadows":[{"title":"把「沒關係」說太多次","text":"你嘴上說沒關係，心裡其實在意。吞久了，可能某天為一件小事突然爆發，連對方都嚇一跳。"},{"title":"期待別人跟你一樣坦白","text":"你真心待人，也默默期待對方同樣坦白；一旦發現對方有所保留，你會比別人更受傷、更難放下。"},{"title":"拖著不談錢","text":"朋友合夥、分攤費用這種該講清楚的事，你怕傷感情一直拖，結果關係卡在模糊地帶，反而更傷。"}],"practice":[{"title":"把沒關係換成真話","text":"下次想說「沒關係」時，改說「我有點在意，我們可以聊一下嗎」。話說得溫和，關係反而更穩。"},{"title":"看他做什麼，不只聽他說","text":"判斷一個人值不值得信任，看他這三個月做了什麼，比聽他保證什麼更準。"},{"title":"先講清楚再開始","text":"跟朋友合作或合買之前，先在對話裡寫好錢怎麼分、誰負責什麼，感情才不會被錢拖下水。"}]},"energy":{"charge":["陽光很好的早上，把房間整理乾淨","跟認識很多年的老朋友吃一頓簡單的飯","看一部結局溫暖、不用提防劇情的電影","收到客人或同事一句真心的謝謝"],"drain":["待在每句話都要猜三層意思的環境","被要求替自己不相信的東西說好話","連續滑了一小時的吵架留言和負面新聞","發現信任的人一直在背後利用你","規則三天兩頭變，卻沒人說清楚"],"message":"世界不會因為你的單純變得更危險；反而因為有你，身邊的人才相信好事還會發生。你不需要變成什麼都懷疑的人，只要簽名前多看一眼、覺得怪的時候多問一句。保護好那份溫度，它是你身上最難被取代的地方。"},"ip":{"positioning":"讓人安心的生活夥伴／新手也不怕的白話老師","core":"你的內容核心是「簡單、真實、做了就會變好」。適合做新手教學、生活小改變、極簡整理、安心選物這類主題。可以賣入門課、懶人包、選物清單、陪伴型社群，或和天然、透明的品牌合作。觀眾買的不只是資訊，而是「跟著你不會出錯」的安心感。","shadows":[{"title":"內容太溫和沒記憶點","text":"每支影片都很舒服，但觀眾滑過就忘了，很難被分享，也不容易被演算法推薦。"},{"title":"不敢談錢","text":"你怕賣東西會破壞形象，結果認真做了很久的內容，卻一直沒有穩定收入。"},{"title":"被負評打擊太深","text":"一則惡意留言就讓你懷疑自己，好幾天提不起勁，不想再拍下一支影片。"}],"practice":[{"title":"在溫暖裡加一個反差","text":"保留你的親切感，但在開頭放一個意外的事實或真實踩雷的經驗，讓觀眾有理由停下來看完。"},{"title":"把推薦當成幫忙","text":"你真心覺得好用的東西，就大方介紹並清楚標示合作。對觀眾誠實，就是你最好的業配策略。"},{"title":"建立留言過濾原則","text":"先決定哪些意見值得回、哪些直接略過，把有限的力氣留給真正在乎你內容、會留下來的人。"}]},"career":{"shine":"你相信誠實做事會有回報，所以在需要長期信任的工作裡最容易發光：教育訓練、客服與售後、社群經營、品牌公關、生活風格相關服務。你不是靠話術成交的人，而是客人買過一次、會帶朋友再來的那種人；選物小店、手作品牌這類靠口碑長大的事業也很適合你。","shadows":[{"title":"開價時先替對方省","text":"報價時你常先想「這樣會不會太貴」，對方還沒殺價，你就自己先打了折。"},{"title":"不好意思說出自己的功勞","text":"專案做成了，你會說「大家一起的啦」，打考績時主管卻不知道最關鍵的那一步是你做的。"}],"practice":[{"title":"先查行情再開價","text":"談條件前，先問兩三個同行的價格，用數字開口，你就不用只靠勇氣硬撐。"},{"title":"每月記下一件你做成的事","text":"把你解決的問題和客人的回饋存成一份清單，考績或報價時拿出來，就不必自己誇自己。"},{"title":"身邊放一個會潑冷水的人","text":"找一個敢說「這裡有風險」的朋友，重要決定前先給他看一眼，補上你最容易看漏的那一角。"}]},"partners":["智者","英雄"],"items":["遇到事情，我習慣先往好的方向想。","朋友心情低落時，我常是先說「會好起來的」的那個人。","我寧願少賺一點，也要每天過得安穩。","做決定前，我很在意會不會不小心做錯了什麼。","別人提醒我小心被騙時，我常覺得他想太多了。","就算被占過便宜，我下次還是傾向先相信對方。"],"as_second":"不管走到哪，你心裡都留著一塊「事情會變好」的地方。它讓你比較容易相信人，也比較容易受傷；但正是這一塊，讓別人在你身邊覺得安心。"},"凡人":{"name":"凡人","en":"Everyman","keywords":["真實","親切","實在","好相處","不裝","同理"],"people":["湯姆・漢克斯","基努・李維","艾德・希蘭","吳念真"],"brands":["IKEA","Levi's","UNIQLO","全聯","大同電鍋"],"manifesto":"我不用比別人厲害，我想當那個你一看就覺得「他跟我一樣」、可以放心靠近的人。","portrait":{"text":"你最在意的，是跟身邊的人站在同一邊，所以你不搶話、不裝懂，也看不慣擺架子。新同事第一天不知道印表機怎麼用，常常會先跑來問你；聚餐時你不是主角，但大家都想坐你旁邊。你很清楚一般人在煩什麼：房租、薪水、下班後還剩多少力氣。你不是沒有特色，而是你的特色就是真實：你說的話，別人聽了會點頭說「對，就是這樣」。","questions":"大家會不會覺得我太普通？我剛剛說的，一般人聽得懂嗎？我是不是為了合群，又把真正的想法吞回去了？你常在群組裡打了一段話，看了看又刪掉，改傳一個貼圖；回家洗完澡才想起，今天其實有一句話很想說。","lesson":"你正在練習的不是變得更特別，而是讓大家看見真正的你。你很會融入，但融入不等於消失。試著在信任的人面前說出不同意見，你會發現，真正的歸屬感不是靠附和換來的，而是別人聽完你的不同，還是想跟你坐在一起。"},"mechanism":{"pursuit":"你要的不是被崇拜，而是在一群人裡有個位置。一個可以穿拖鞋去的聚會、一個講話不用修飾的群組、一個大家互相幫忙收尾的團隊，就是你心中最理想的樣子：沒有誰比較高，大家都是自己人。","drive":"推動你的是「原來不是只有我這樣」。所以你分享經驗時不愛曬成果，反而先講自己踩過的雷：第一次報稅填錯、第一次面試緊張到忘詞。你知道，讓人靠近的不是你多厲害，而是對方在你身上看到自己。","fear":"你怕的不只是被冷落，也怕太突出。群組沒人回你會不安，但被說「你變了」「很跩」也讓你緊張。所以有人恭喜你升職，你常先說「沒有啦，運氣好」，好讓大家覺得你還是同一國的。","belief":"「大家都是普通人，沒有誰比誰高級。」你相信每個人的日常都值得被聽見，平凡不是缺點，而是最多人共有的語言。"},"strengths":[{"title":"讓人放下防備的親和力","text":"你不是刻意討好，而是真的不想讓任何人覺得尷尬。客戶談完會說「跟你講話好舒服」，新人跟你相處一週，就敢開口說「這個我真的不懂」。在你面前，大家不用假裝自己很會。"},{"title":"抓得到一般人卡在哪","text":"你很清楚一般人在乎什麼、怕什麼、會在哪一步放棄。大家在會議室裡討論得很興奮，你一句「我媽應該不會這樣用」，就讓團隊回頭改設計。你像是使用者派來的代表。"},{"title":"替大家把話講白","text":"你很自然就會用大家聽得懂的方式講事情。開會時別人講了一堆專有名詞，你一句「所以就是每天要多填一張表對吧」，整間會議室都鬆了一口氣，因為那正是大家想問又不敢問的。"},{"title":"默默撐住團隊的可靠感","text":"你不一定衝在最前面，但你很少缺席。團隊熬夜趕案時，你會先問大家便當要吃什麼，順手把沒人顧到的檔案整理好。大家未必說出口，但都知道有你在比較安心。"}],"best_scenes":"需要讓一般人放心的地方最適合你：客服、社群經營、帶新人、團隊協調、使用者訪談。尤其是產品很厲害、大家卻看不懂的時候，你一句「講白一點就是……」，就能讓新手願意試試看。","value":"你帶給團隊的是「人味」。在只看效率和數字的會議裡，你會提醒大家「真正在用的人是誰」；在大家吵到快翻臉的時候，你會提一袋飲料進來，讓人想起彼此其實是同一國的。","weaknesses":[{"title":"很難拒絕","text":"因為不想讓氣氛變僵，別人一開口拜託，你常常先說「好啊」，再自己加班把它做完。"},{"title":"等大家都試過才敢試","text":"你太懂一般人的選擇，也容易跟著一般人選，新東西總要等身邊有人用過，你才敢下手。"},{"title":"替大家說，很少替自己說","text":"你很會把大家的心聲講白，輪到自己的不同意見，卻常常吞回去，改成一句「都可以」。"},{"title":"把功勞講小","text":"你做的事多半在幕後，又習慣說「沒什麼啦」，主管很容易看不見你其實扛了多少。"}],"risks":[{"title":"過著別人覺得合理的人生","text":"長期配合大家，你可能慢慢忘了自己真正喜歡什麼。某天整理相簿才發現，這幾年選的工作、去的地方，都是身邊的人覺得合理的，很少是你自己挑的。"},{"title":"被誤會沒有立場","text":"你總是兩邊都說好，衝突時兩邊都想拉你，也都不確定你站哪一邊。等到真的需要你表態時，你說的話反而沒人當一回事。"},{"title":"圈子越來越小","text":"你喜歡熟悉的人和地方，聚會總是那幾個老朋友、那幾家店。這讓你很穩，但新機會常常來自不熟的人，圈子太固定，好機會可能根本傳不到你這裡。"}],"growth":["每週說一次「我的想法有點不一樣」，先從最熟、最安全的那個人開始。","下次有人誇你，先說「謝謝，我花了不少時間」，不要急著說運氣好。","每個月去一個沒有熟人的場合，例如一場講座或一堂體驗課，認識一個新朋友。"],"evolution":{"from":"融入人群的好夥伴","to":"帶著大家前進的自己人","text":"你會從「跟大家一樣」走到「替大家先走一步」。你還是那個沒架子的人，只是開始願意第一個舉手，讓身邊的人覺得：連他都敢試了，我也可以。"},"relationship":{"shine":"你不是沒主見，而是更在乎兩個人都舒服。和你在一起，可以穿著拖鞋、吃著滷味，抱怨今天主管又改了三次需求，不用假裝自己過得很好。你會配合對方的節奏，也顧得到一群朋友裡最安靜的那一個。這種「不用演」的輕鬆，是你給人最珍貴的東西。","shadows":[{"title":"說沒關係，其實有關係","text":"你習慣先說沒關係，不舒服一層層疊起來，某天可能因為一件小事突然爆發，連對方都嚇到。"},{"title":"先想別人會怎麼看","text":"要去哪裡旅行、要不要換房子，你先想到朋友會怎麼說，反而沒問伴侶和自己真正想要什麼。"},{"title":"不讓對方照顧你","text":"你總是配合的那一方，對方可能根本不知道，你其實也想被問一句「你今天還好嗎」。"}],"practice":[{"title":"練習說小小的不要","text":"從「我今天不想吃這家」這種小事開始，讓對方慢慢習慣你也有自己的偏好。"},{"title":"每月寫下自己想要的","text":"每個月花十分鐘，寫下最近真正想做的三件事，先不管別人覺得合不合理。"},{"title":"讓一個人看見真的你","text":"挑一個信任的人，說一件你很少說出口的夢想或不滿，讓他認識沒在配合別人的你。"}]},"energy":{"charge":["跟老朋友吃熱炒，聊沒什麼營養的日常","團隊收工後，大家互相說「辛苦了」","幫同事或鄰居解決一個生活上的小麻煩","聽到有人說「你講的我完全懂」"],"drain":["待在大家互相比職稱、比薪水的場合","被要求上台大談自己的成就","團隊裡有人擺架子、看不起新人","為了場面說違心的話","發現大家另外開了一個沒有你的群組"],"message":"平凡不是你的缺點，而是你的入口：很多人願意靠近你，正是因為在你身上看到自己。你不用變成誰，只要再多一點勇氣，把那句吞回去的話說出來。你會發現，大家不是不想聽你的意見，而是一直在等你開口。"},"ip":{"positioning":"陪你一起試的「小白代表」或「上班族好朋友」","core":"你的內容核心是「真實經驗」：我也是一般人，我試了什麼、卡在哪裡、最後怎麼解決。觀眾喜歡你，是因為在你身上看到自己。適合賣的是實用、平價、新手友善的東西，例如入門課程、清單和模板、團購選物，或陪伴式的社群和讀書會。","shadows":[{"title":"太怕跟別人不一樣","text":"看到什麼紅就跟著拍，最後內容跟大家長得一樣，觀眾滑過就忘，記不住你是誰。"},{"title":"不敢談錢","text":"怕賣東西會讓粉絲覺得你變了，結果經營很久，卻一直沒有穩定的收入。"},{"title":"把自己藏起來","text":"只分享資訊不分享自己，就失去了你最大的優勢：讓人覺得你就像身邊的朋友。"}],"practice":[{"title":"把你的卡關拍出來","text":"不用假裝很會，直接拍你第一次試、搞砸、再試一次的過程。這種真實感，就是別人學不來的個人品牌。"},{"title":"大方介紹真的在用的東西","text":"只推薦自己用過、覺得值得的產品或課程，坦白講優缺點。真心推薦不是背叛粉絲，是幫他們省時間。"},{"title":"固定跟觀眾對話","text":"每週回留言、做問答或小調查，讓觀眾一起決定下一支要試什麼，社群感和信任感會越來越強。"}]},"career":{"shine":"你適合靠信任吃飯的工作：客服、業務、人資、社群經營、使用者研究、教育訓練，或經營在地小店。你賺錢不是靠一次爆紅，而是靠回頭客：客人因為覺得你實在而回購，朋友因為信任你而介紹生意。你不一定最亮眼，但會走得很穩、很久。","shadows":[{"title":"報價先自己打折","text":"報價或談薪水時，你怕開高了顯得不好相處，常常還沒開口，就先在心裡砍了兩成。"},{"title":"等別人看見才行動","text":"你習慣把事做好、等人發現，但升遷和好案子，常常先給願意舉手說「我想試」的人。"}],"practice":[{"title":"照行情開價","text":"談薪水或報價前先查清楚行情，照行情開，不要還沒談就自己先打折。"},{"title":"每季整理成績單","text":"每季記下你解決過的問題和帶來的成果，談加薪或接案時就拿得出來。"},{"title":"找一個敢衝的夥伴","text":"跟願意站在前面的人合作，你穩住後方和客人，他負責開路和衝刺。"}]},"partners":["英雄","創造者"],"items":["買東西時，我會選大家都在用、評價穩定的。","我很容易看出一般人會在哪裡卡住。","我很在意自己是不是被大家當成自己人。","我怕表現得太突出，別人會覺得我變了。","明明不同意，我還是常常跟著大家說好。","太高級、太講究的場合，常讓我渾身不自在。"],"as_second":"不管多有主見，你都不想跟身邊的人拉開距離。它讓你好相處、接地氣，也讓你有時候明明不同意，還是先說好。"},"英雄":{"name":"英雄","en":"Hero","keywords":["勇氣","毅力","挑戰","成就","紀律","守護"],"people":["小威廉絲（Serena Williams）","麥可．喬丹（Michael Jordan）","基普喬蓋（Eliud Kipchoge）","戴資穎","郭婞淳"],"brands":["Nike","Under Armour","Gymshark","Liquid I.V.","大眾銀行《夢騎士》廣告（2011）"],"manifesto":"越難的事，我越想試試看；我要證明，努力真的可以改變結果。","portrait":{"text":"你想證明努力真的能改變結果，所以聽到「這不可能」，你不會退，反而被點燃。你不是愛逞強，而是一個清楚的目標會讓你全身有力：報名半馬那天就排好十二週課表，下雨天也在騎樓原地跑。朋友遇到難關，你不會只說加油，而是說「走，我陪你一起處理」。比起討論事情有多糟，你更想知道下一步是什麼。對你來說，每一道關卡都是讓自己變強的機會。","questions":"你常問自己：「我還能再進步多少？」「現在放棄，以後會不會後悔？」安靜下來的時候，偶爾也會冒出一句：「如果這次沒贏，我還值得被肯定嗎？」你不是只想贏，而是太習慣用結果證明自己，所以最後這一題，才是你最需要回答的。","lesson":"你相信努力不會騙人，所以你正在練習的是接受：有時努力了也贏不了。你並不軟弱，只是很少允許自己停下來。成熟的英雄知道休息不是偷懶、示弱不是輸，真正的勇氣有時是說出「我需要幫忙」，或是決定這一場仗不打。"},"mechanism":{"pursuit":"你追求的是突破。你要的不只是被看見，而是親身證明人能變得比昨天更強：看著上個月的紀錄被自己刷新，那種感覺比任何獎狀都實在，也讓你更有力氣替在乎的人撐住。","drive":"推動你的是挑戰本身。一個明確的目標、一條看得到的進度、一個比你強的對手，都會讓你精神一振。你不是閒不下來，而是沒有目標的日子，會讓你不知道該往哪裡用力。","fear":"你最怕顯得軟弱，或在關鍵時刻退縮。你怕的不是失敗本身，而是發現「我沒有自己以為的那麼強」。所以就算已經累到不行，你在群組裡回的還是「沒問題，我來」。","belief":"「只要沒放棄，就還沒輸。」你不是不知道自己可能會輸，而是相信每一次撐過去，都會讓人更強一點。"},"strengths":[{"title":"說好的目標一定推完","text":"你想看到成果，所以一決定要做，就會拆步驟、排進度、一格一格打勾。別人還在開第三次討論會，你已經交出第一版。你不是急，而是知道拖著不做最消耗人，這種推進力會讓整個團隊跟著動起來。"},{"title":"壓力越大越撐得住","text":"危機反而讓你清醒。系統掛掉、客戶在電話那頭大吼時，你是那個先說「好，我們一件一件來」的人。你不是不怕，而是把害怕轉成動作，先處理最要緊的那一塊，身邊的人也跟著安心。"},{"title":"沒人看的時候也照樣練","text":"你相信成果是累積出來的，所以能在沒掌聲的日子裡把該做的做完。清晨六點的健身房、每天固定一小時的練習，你不是靠意志硬撐，而是早就把它變成跟刷牙一樣的習慣。"},{"title":"會主動拉別人一把","text":"你看不得有人快撐不住，因為你知道一個人扛有多難。同事被客戶當眾刁難，你會站出來把話接過去；學弟妹想放棄，你會把自己當年的筆記丟給他：「你一定做得到。」"}],"best_scenes":"你需要一個清楚的終點才會全力以赴，所以有期限的專案、要扭轉局面的危機、看得到數字的業績和比賽最適合你。你不是只能衝刺，但目標越具體，例如「月底前拿下三家客戶」，你表現得越好。","value":"你相信事情做得到，也讓別人跟著相信。大家想放棄時，你是那個說「再試最後一次」，然後真的帶頭去做的人。你不是只會喊口號，而是用行動當火車頭，在困難的時候把整個團隊往前拉。","weaknesses":[{"title":"推得太快，忘了等人","text":"你一心往終點衝，常常回頭才發現隊友還在第二步，而你已經不耐煩地自己做完了。"},{"title":"平順的日子反而悶","text":"你在混亂裡最清醒，事情一順利就覺得少了什麼，甚至會不自覺地把小事當大事來打。"},{"title":"少練一次就有罪惡感","text":"自律是你的強項，也讓你很難放過自己，排好的訓練少做一次，就像欠了誰一樣。"},{"title":"很難開口求救","text":"你總是拉別人一把，輪到自己快撐不住時，卻說不出一句「可以幫我嗎」。"}],"risks":[{"title":"人生只剩成績單","text":"你習慣用成績介紹自己。哪天換到一個比不出高下的位置，例如轉職、休長假或當全職爸媽，你可能突然不知道自己是誰，也不知道該怎麼被肯定。"},{"title":"永遠需要下一場仗","text":"達標的開心只維持兩三天，你就急著報下一場比賽、訂下一個業績。你不是貪心，只是停不下來；時間一久，成就感越來越短，生活只剩一直追。"},{"title":"把贏看得比人重要","text":"你不是不在乎他們，但專心衝刺時，可能沒注意到隊友的臉色，讓在乎你的人覺得自己只是你路上的配角，慢慢就不再靠近。"}],"growth":["把休息寫進行事曆，像重要會議一樣不隨便取消；恢復本來就是訓練的一部分。","這週挑一件事，主動說「這次我需要幫忙」，讓別人有機會跟你並肩，而不是只能在旁邊看。","每完成一個目標，除了記成績，也寫下一件過程中學到的事，讓沒贏的時候也有東西帶走。"],"evolution":{"from":"單打獨鬥的戰士","to":"帶大家一起贏的隊長","text":"你不再只想證明自己有多強，而是開始讓身邊的人也變強。你不是變得不拚，而是懂得挑值得的戰場、懂得休息，讓你的勇氣可以走得更長。"},"relationship":{"shine":"你想替在乎的人撐住，所以朋友出事時，你是第一個被想到的人。你不只會說加油，而是捲起袖子：幫忙搬家、陪他把履歷改到半夜。你不是愛管事，而是覺得說到就該做到。你那句「你一定可以」，常常真的讓對方多撐了一下。","shadows":[{"title":"把關心變成督促","text":"對方只是想耍廢一個週末，你卻開始幫他排計畫、訂目標，讓人更有壓力。"},{"title":"把相處變成比賽","text":"打個羽球、玩個桌遊，你也認真到想贏，旁邊的人開始玩得有點緊張。"},{"title":"太忙而缺席","text":"訓練和工作排滿了行程，重要的人常常被你排到待辦清單的最後一格。"}],"practice":[{"title":"先問對方要什麼","text":"先問一句「你要我幫你想辦法，還是陪著你就好？」，再決定怎麼出手。"},{"title":"讓別人幫你一次","text":"下次有人問「要不要我幫忙」，先別回「我可以」，說聲「好啊，謝謝」，關係會因此更近。"},{"title":"留時間給不用贏的事","text":"跟家人朋友吃飯、散步、聊天，不設任何目標，只是單純待在一起。"}]},"energy":{"charge":["完成一個很有挑戰性的目標","運動到滿身大汗，身體很累但心裡很爽","看到自己的數字或能力明顯進步","帶著一群人一起把難事搞定"],"drain":["沒有目標，每天不知道自己在忙什麼","努力了很久卻看不到任何進展","被人說「不用那麼拚啦」","跟一直抱怨卻不想改變的人相處","被迫等待、什麼都不能做的狀態"],"message":"你已經很努力了，真的。你不需要每一場都贏，才配得上被肯定。你不是停下來就會變弱，而是停下來才能走得更遠。最好的戰士知道什麼時候出手，也知道什麼時候放下盾牌。你的價值，不只在你做到了什麼，也在你一路上怎麼對待身邊的人。"},"ip":{"positioning":"「帶你一起挑戰的人」：用真實行動證明做得到的挑戰型創作者，或陪觀眾突破瓶頸的教練。","core":"你的內容核心是「我去挑戰了，過程和結果都給你看」。三十天挑戰、從零開始的成長紀錄、前後對比、突破瓶頸的方法，都是你的強項。可以賣的東西包括：挑戰營或陪跑社群、訓練或習慣養成課程、一對一教練服務、目標規劃工具，以及運動、效率相關的品牌合作。","shadows":[{"title":"為了效果誇大成果","text":"想讓挑戰看起來更厲害，可能不小心把數字或難度講得太滿，傷了信任。"},{"title":"只給看贏的時候","text":"畫面都是光鮮的成果，觀眾覺得你離他太遙遠，反而不敢開始跟著做。"},{"title":"讓觀眾壓力很大","text":"內容一直在說要更拚、更自律，容易讓人看完反而覺得自己很失敗。"}],"practice":[{"title":"公開真實的過程","text":"失敗、卡關、想放棄的那幾天也拍出來。觀眾看到你也會掙扎，才會覺得「他做得到，我也可以」，信任感也會更高。"},{"title":"把挑戰設計成觀眾也能參加","text":"例如「七天一起做」，給一個簡單的第一步和打卡方式，讓觀眾從旁觀者變成一起挑戰的夥伴。"}]},"career":{"shine":"你想看到努力變成結果，所以適合目標清楚、看得見成績的工作：業務、創業、專案管理、運動健身產業、救援或醫療第一線，以及需要扭轉局面的主管職。你不是只能領固定薪水，績效獎金、成果導向的顧問、陪跑式課程，都能讓你的拚勁直接變成收入。","shadows":[{"title":"什麼都想自己扛","text":"你不放心交出去，事業越做越大，自己卻成了每件事都要等你點頭的瓶頸。"},{"title":"只看眼前的戰果","text":"太專注拿下這一季的數字，可能忽略了長期的健康、團隊和品牌累積。"}],"practice":[{"title":"學會帶人，不只做事","text":"把你的方法寫成一頁流程教給夥伴，讓團隊一起變強，你也不用事事親自上陣。"},{"title":"先設定「夠了」的標準","text":"每個目標開始前，先寫下做到哪裡算達成，避免達標之後又無止境地加碼。"},{"title":"把睡眠當成基本盤","text":"把睡眠和休息當成整個事業的地基，而不是等有空才順便照顧的事。"}]},"partners":["智者","照顧者"],"items":["越多人說不可能的事，我越想做到給大家看。","事情突然出包時，我通常是負責收拾局面的那個人。","越難的事，做到時我越有成就感。","我很不喜歡被別人看到自己累或撐不住的樣子。","就算很累了，我也很難讓自己停下來休息。","看到別人放棄，我常覺得他們只是不夠努力。"],"as_second":"遇到真正重要的事，你會咬著牙撐到最後。它讓你在關鍵時刻靠得住，也讓你不太會喊累，常常等身體抗議了才停下來。"},"照顧者":{"name":"照顧者","en":"Caregiver","keywords":["體貼","守護","耐心","可靠","付出","同理"],"people":["黛安娜王妃","羅傑斯先生（Fred Rogers）","陳樹菊","孫越","嚴長壽"],"brands":["嬌生 Johnson & Johnson","Volvo","幫寶適 Pampers","UNICEF 聯合國兒童基金會","7-ELEVEN"],"manifesto":"我希望在我身邊的人，都能覺得自己被好好接住，不用一個人硬撐。","portrait":{"text":"你會先看見別人需要什麼，是因為你沒辦法看著有人一個人硬撐。同事臉色不對，你會私下傳一句「還好嗎」；聚餐點菜時，你早就記得誰不吃辣、誰在減糖。你包包裡常備著面紙、OK 繃和胃藥，但用到的人通常不是你。你不是愛管別人的事，而是一旦注意到了，就很難當作沒看到。你很少大聲表現自己，卻常常是讓整個團隊順順運轉的那個人。","questions":"你常在心裡問：「他現在需要的是什麼？我能幫上什麼？」做決定前，你會先想：「這樣做，會不會有人因此受委屈？」只有在很晚、手機終於安靜下來的時候，你才會小聲問自己：「那我呢？誰來問我還好嗎？」","lesson":"你正在練習的，是把自己也寫進需要照顧的名單。你不是付出太多，而是常常忘了自己也是其中一個人。當你懂得累了就說、需要就開口，你給出去的關心才不會變成消耗，也不會在某一天悄悄變成委屈。"},"mechanism":{"pursuit":"你追求的是讓身邊的人過得好一點，不一定要轟轟烈烈。可能只是讓新人少走一段冤枉路，或讓加班的同事桌上多一個便當。你並不需要被歌頌，你要的是看見對方鬆一口氣的那一秒。","drive":"推著你的，是「幫得上忙」的感覺。有人說一句「還好有你」，你會覺得前面的辛苦都值得。你不是想控制誰，而是答應顧好的人和事，你就想顧到底；中途放手，你會比對方還難受。","fear":"你最怕被人覺得自私、冷漠，或付出之後被當成理所當然。所以就算行事曆已經滿了，有人一句「可以幫我一下嗎」，你還是很難說出「我沒辦法」，因為拒絕在你心裡，很像丟下對方。","belief":"「人跟人之間，本來就該互相照應。」你不覺得溫柔是軟弱，你相信一點關心就能改變一個人的一天。"},"strengths":[{"title":"對方還沒開口你就察覺了","text":"你在乎人，所以眼睛自然會停在人身上。開會時你會注意到那個一直想說話卻插不進來的新人，順手把話題遞給他。別人看到的是議程，你看到的是誰卡住了，這讓你特別適合帶人和協調。"},{"title":"讓人覺得被好好接住","text":"你想讓對方知道他不是一個人，所以聽人說煩惱時不急著給答案。你會記得他上週提過去面試，過幾天再問一句「後來有消息嗎」。你不是在套交情，你是真的把他放在心上。"},{"title":"有耐心教到對方真的會","text":"你在意的是對方懂了沒，不是你講過沒。面對卡關的新人，你願意換三種說法解釋同一件事，也不會讓人覺得自己很笨。很多人第一次學會一件難事，背後都有一個像你這樣的人。"},{"title":"默默把細節都顧好","text":"你希望每個人都被照顧到，所以活動要帶的延長線、哪個客戶不吃牛、誰下週生日，你都記得。你做的事很少被看見，但少了你，大家馬上會發現哪裡怪怪的。"}],"best_scenes":"需要有人顧著的地方最適合你：帶新人度過第一個月、接住情緒很滿的客人、協調一群各忙各的同事，或任何要讓人覺得「有人在，不用怕」的時刻。","value":"你帶給團隊的是「出事了有人接」的安全感。有你在，大家比較敢說「我這裡卡住了」，也比較願意互相幫忙。你不是最大聲的人，卻常是讓一群各自忙碌的人，真的變成夥伴的那條線。","weaknesses":[{"title":"別人的需要總排在前面","text":"你太快看見別人缺什麼，自己的需要反而常被跳過，忙到下午三點才想起還沒吃午餐。"},{"title":"付出後默默等一句謝謝","text":"你把別人放在心上，心裡也希望被同樣記得。對方忘了你的生日，你嘴上說沒差，失落卻悄悄累積。"},{"title":"忍不住接過來自己做","text":"看對方做得卡卡的，你可能說「我來就好」直接接手，省了時間，對方卻少了一次自己學會的機會。"},{"title":"什麼都顧，顧到沒時間","text":"你習慣把每個細節都接下來，有人拜託就說好，結果自己的工作常常拖到半夜才開始做。"}],"risks":[{"title":"付出到被掏空","text":"長期只給不收，你可能某天突然對一切都提不起勁，連原本最愛的人和工作都覺得疲倦。這不是你變冷漠了，而是力氣真的用完了。"},{"title":"被習慣性依賴","text":"身邊的人可能慢慢把你的幫忙當成應該，有事就直接丟給你，連一句謝謝都省了。你越好說話，越容易被少數人一直消耗。"},{"title":"委屈變成冷淡","text":"那些沒說出口的不舒服，累積久了可能變成冷淡或酸話。對方感覺得到你變了，卻完全不知道原因，關係就這樣慢慢遠了。"}],"growth":["每週在行事曆上排一段只屬於自己的時間，像排會議一樣，有人約也不輕易讓出去。","有人拜託時先說「我看一下時間再回你」，給自己三分鐘想清楚有沒有餘力。","下次想說「我來就好」時，改成「我做一次給你看，下次換你試試」。"],"evolution":{"from":"犧牲自己的好人","to":"有界線的守護者","text":"成熟的照顧不是無限付出，而是知道什麼時候伸手、什麼時候放手。你不是要少愛別人一點，而是把自己也算進去，這樣你的溫柔才走得更遠。"},"relationship":{"shine":"你在人際裡讓人覺得被在乎，因為你是真的記得。朋友搬家，你會帶著一箱泡麵和膠帶出現；他隨口提過的小事，你過一陣子會再問起。你並不是要對方回報什麼，只是看到他過得好，你就安心。所以朋友遇到難關，第一個想到的常常是你。","shadows":[{"title":"把關心變成操心","text":"你太想保護對方，可能一直提醒「記得帶傘」「那個人你要小心」，對方聽久了會覺得有點被管。"},{"title":"只聽不說自己","text":"你很會聽別人說，卻很少談自己的難處，朋友認識你好幾年，其實不太知道你過得好不好。"},{"title":"用做事代替說話","text":"你不開心時不太直接講，而是默默多做或突然少做，對方只能用猜的，誤會就這樣卡著。"}],"practice":[{"title":"練習說「好，謝謝你」","text":"有人想幫你時，先別說「不用啦」，試著回「好，謝謝你」，讓別人也有機會照顧你一次。"},{"title":"伸手前先問一句","text":"幫忙之前先問「你想要我幫忙，還是想自己來？」，尊重對方想自己處理的空間。"},{"title":"把需要說成一句話","text":"累了就說「我今天很累，可以陪我吃個飯嗎」，真正在乎你的人會很樂意回應。"}]},"energy":{"charge":["幫上某個人的忙，看見他鬆一口氣","和家人或老朋友安靜地吃頓飯","一段手機關靜音、完全屬於自己的時間","收到一張手寫的感謝卡片"],"drain":["被當成什麼都能丟過來的工具人","待在只看數字、不看人的環境","同時被好幾個人需要卻分身乏術","看到有人被欺負卻幫不上忙","長期待命，連休假都在回訊息"],"message":"你已經照顧了很多人，今天也請記得照顧自己。你的價值不只是「有用」，就算哪天什麼都沒幫上，你還是值得被好好對待。休息不是自私，是讓你能繼續溫柔下去的方式。先把自己的杯子裝滿，再倒給別人。"},"ip":{"positioning":"幫你先踩過雷的貼心學姊／保姆級教學的陪伴者","core":"你的內容核心是「我陪你，你不用一個人摸索」。適合做保姆級教學、新手避雷、生活和職場支持、陪伴型成長內容。可以賣入門課程、一對一諮詢、陪跑計畫、會員社群，或幫觀眾挑選安心可靠的產品。觀眾跟著你，是因為覺得被耐心對待。","shadows":[{"title":"什麼都免費給","text":"你怕收費會讓人覺得你不夠真心，結果花大量時間回私訊，卻沒有任何收入。"},{"title":"被留言綁架","text":"你想回應每一個人的需求，內容方向越來越分散，自己也被訊息淹沒而疲憊。"},{"title":"不敢展現專業","text":"你太習慣當配角，不好意思說自己很厲害，讓觀眾看不出你值得信賴的專業。"}],"practice":[{"title":"把陪伴做成產品","text":"把你最常被問的問題整理成課程或陪跑方案，清楚標價。收費讓你能更長久、更專心地幫助真正需要的人。"},{"title":"設定回覆的界線","text":"公開說明私訊回覆的時間和範圍，常見問題做成一支影片或懶人包，讓你的時間和心力不會被切得太碎。"},{"title":"大方分享成果","text":"定期分享學員或觀眾的改變故事，讓大家看見你的方法有效，也讓你的專業被更多人看見。"}]},"career":{"shine":"你最有力量的時候，是知道自己的工作真的讓某個人過得更好。客戶成功、人資培訓、教育、照護相關服務、社群經營、顧問陪跑都很適合你，諮詢工作室、寵物品牌、會員制社群這類以服務為核心的事業也是。你不是靠推銷留住客人，而是客人感受得到你真的在乎。","shadows":[{"title":"收費太客氣","text":"你容易替客戶省錢、多送一次修改或一堂課，做得很累，收入卻跟付出不成比例。"},{"title":"功勞被別人拿走","text":"你在幕後撐起很多事，報告時卻讓別人上台講，升遷或加薪時就容易被忽略。"}],"practice":[{"title":"記錄你的貢獻","text":"每月寫下你解決了哪些問題、幫了多少人，談加薪和報價時就有具體依據。"},{"title":"先講清楚服務範圍","text":"合作前寫明包含什麼、不包含什麼，多出來的需求另外報價，你就不用每次都硬吞。"},{"title":"教一個人接手","text":"挑一件你常做的照顧工作，教會一個同事，你才能放心請假，不用休假還在待命。"}]},"partners":["統治者","探險家"],"items":["同事卡關時，我常會停下手邊的事先去幫他。","別人跟我說過的煩惱，我會記得，過幾天再問起。","我常常先把別人的需要排在自己的前面。","我很怕被人覺得自私或不夠體貼。","就算很累，我也很難拒絕別人的請託。","看到有人被冷落或吃虧，我很難當作沒看到。"],"as_second":"你往前衝的時候，眼角還是會看著身邊的人有沒有跟上。它讓你很得人心，也讓你常常把自己的需要排到最後。"},"探險家":{"name":"探險家","en":"Explorer","keywords":["自由","好奇","出發","新鮮感","獨立","真實自我"],"people":["貝爾．吉羅斯（Bear Grylls）","愛蜜莉亞．艾爾哈特（Amelia Earhart）","雅克．庫斯托（Jacques Cousteau）","謝哲青","劉金標"],"brands":["Patagonia","REI","The North Face","Jeep","捷安特"],"manifesto":"我不想照著別人畫好的地圖走，我要親自出發，看看自己到底能走到哪裡。","portrait":{"text":"你一直想知道，換個地方、換種方式活，自己會變成什麼樣子，所以「沒人試過」這幾個字，對你來說不是警告，是邀請。你不是靜不下來，而是一眼看到底的日子，會讓你慢慢變得不像自己。朋友還在問「那家新開的店好吃嗎」，你上週就去過了，還順便繞進隔壁那條沒走過的巷子。行程排太滿、規定訂太細，你就開始坐立難安；給你一張還沒畫完的地圖，你反而最有精神。","questions":"你常在心裡問：「如果現在不去，以後還會有機會嗎？」「這是我真的想要的，還是大家都這樣，我才跟著做？」還有一個比較安靜的問題，常在剛換完工作、剛搬完家的那幾天冒出來：「我一直換地方，到底在找什麼？」你不是沒有答案，而是相信答案要走過才算數。","lesson":"你想要的是自由，所以你正在練習的是分清楚「出發」和「逃走」。你並不怕難，但事情一變無聊，你很容易把「想離開」誤認成「這裡限制了我」。成熟的探險家不是走得最遠的人，而是願意在某個值得的地方多待一季，讓看過的風景長成自己的東西。"},"mechanism":{"pursuit":"你追求的是能自己選路的人生。你要的不是什麼都不用管，而是方向盤握在自己手上：週末去哪、下一份工作做什麼、用什麼方式賺錢，都想自己拍板，而不是照別人排好的行程走。","drive":"推動你的是「還沒看過」的那種癢。你不是三分鐘熱度，而是好奇心需要一直有新東西餵：新城市、新工具、新認識的人。手機跳出便宜機票的通知，你會先把日期查一遍，就算最後沒買，心裡也亮了一下。","fear":"你最怕被困住：困在一份看得到退休那天的工作，或一種「大家都這樣過」的生活。你怕的不是辛苦，而是重複。更深一層，你怕走了那麼多路，回頭發現心裡還是空空的，什麼都沒留下。","belief":"「沒去過的地方，別人說的都不算。」你不是不信別人，而是一定要親自走一趟，答案才會變成你自己的。"},"strengths":[{"title":"比別人先踏出第一步","text":"你想親眼看到結果，所以等不了太久。別人還在群組裡問「有人試過嗎」，你已經報名、付款、出發了。你不是衝動，而是知道很多事要做了才看得清，這讓你比多數人更早看見機會，也更早知道哪條路走不通。"},{"title":"到哪裡都能很快上手","text":"陌生對你來說是好玩，不是威脅。換部門、換城市、行程臨時取消，你不是不慌，而是慌個十分鐘就開始
